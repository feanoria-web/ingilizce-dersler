<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yönetici şifreni oluştur · English</title><link rel="stylesheet" href="assets/style.css"><link rel="stylesheet" href="assets/access.css"></head><body><main class="admin-signin"><a class="access-brand" href="login.html">English <small>HÜDAVENDİGAR SGM</small></a><section class="admin-login-box"><p class="eyebrow">İLK KURULUM</p><h1>Yönetici şifreni oluştur.</h1><p class="login-intro">Bu şifre yalnızca sana ait. Öğrenciler adlarıyla giriş yapmaya devam edecek. Şifreni sohbete yazmana gerek yok.</p><form id="setup"><label for="new">Yönetici şifresi</label><div class="password-wrap"><input id="new" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></div><p class="field-help">En az 12 karakter kullan.</p><label for="repeat">Şifreyi tekrar yaz</label><div class="password-wrap"><input id="repeat" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></div><p class="form-message" id="status" role="status" aria-live="polite"></p><button class="button button-primary login-submit" type="submit">Şifremi oluştur</button></form></section></main><script>
document.querySelector('#setup').addEventListener('submit',async e=>{e.preventDefault();const a=document.querySelector('#new'),b=document.querySelector('#repeat'),s=document.querySelector('#status'),button=e.target.querySelector('button');if(a.value!==b.value){s.textContent='Şifreler aynı değil.';return;}button.disabled=true;try{const r=await fetch('/api/admin/setup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({newPassword:a.value})});const d=await r.json();if(!r.ok)throw new Error(d.error);a.value='';b.value='';s.textContent='Yönetici şifren oluşturuldu. Bu sekmeyi kapatabilirsin.';s.classList.add('is-success');e.target.querySelectorAll('input').forEach(x=>x.disabled=true);}catch(x){s.textContent=x.message;button.disabled=false;}});
</script></body></html>
