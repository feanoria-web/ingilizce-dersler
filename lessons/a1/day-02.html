anlar: \u003cb>Q, W, X\u003c/b>."]},{"h":"Harfin adı ≠ kelimedeki sesi","p":["Türkçede “A” her kelimede “a” okunur. İngilizcede harfin \u003cb>adı\u003c/b> ile kelimedeki \u003cb>sesi\u003c/b> farklı olabilir: A harfinin adı “ey”, ama \u003ci>apple\u003c/i> kelimesinde “e” gibi duyulur.","Harflerin adı en çok \u003cb>heceleme\u003c/b> için lazım: otelde, hastanede, telefonda adınızı söylemek."]},{"h":"Beş sesli harf: A, E, I, O, U","p":["Türkçeyle en çok bunlar karışır."],"en":"A, E, I, O, U","ok":"ey, i, ay, ou, yu","tr":"sesli harfler"},{"h":"Büyük harf, küçük harf","p":["\u003cb>capital letter\u003c/b> = büyük harf (A B C) · \u003cb>small letter\u003c/b> = küçük harf (a b c).","İngilizcede büyük harfle başlayanlar: isimler (\u003cb>A\u003c/b>yşe), şehir ve ülkeler (\u003cb>B\u003c/b>ursa, \u003cb>T\u003c/b>urkey), günler (\u003cb>M\u003c/b>onday) ve \u003cb>I\u003c/b> (ben) — cümlenin ortasında bile: \u003ci>Yes, I am.\u003c/i>"],"en":"capital letter · small letter","ok":"kepitıl letır · smool letır","tr":"büyük harf · küçük harf"},{"h":"Nerede lazım?","ex":["🏨 Otelde: \u003ci>Can you spell your surname, please?\u003c/i>","📞 Telefonda: \u003ci>Your email, please? — It's a, y, s, e …\u003c/i>","🏥 Hastanede, bankada, havaalanında: adınızı ve soyadınızı harf harf söylemek.","✈️ Uçak biletinde ve pasaportta adınız İngiliz harfleriyle yazılır: Öztürk → OZTURK."]}]},{"type":"sayTiles","title":"26 harf: A'dan Z'ye","titleTR":"The whole alphabet","groups":[{"label":"A – Z","sub":"dinleyin; sonra A – M ve N – Z'yi tek tek çalışacağız","items":[["A","A","ey"],["B","B","bi"],["C","C","si"],["D","D","di"],["E","E","i"],["F","F","ef"],["G","G","ci"],["H","H","eyç"],["I","I","ay"],["J","J","cey"],["K","K","key"],["L","L","el"],["M","M","em"],["N","N","en"],["O","O","ou"],["P","P","pi"],["Q","Q","kyu"],["R","R","aa(r)"],["S","S","es"],["T","T","ti"],["U","U","yu"],["V","V","vi"],["W","W","dabılyu"],["X","X","eks"],["Y","Y","uay"],["Z","zed","zed"]]}]}]},{"id":"am","block":1,"st "teamGame","quiz":true,"label":"REVIEW","items":[{"w":"E harfi İngilizce nasıl okunur?","r":"i","why":"e-mail"},{"w":"W harfi?","r":"double U · dabılyu","why":""},{"w":"Ş harfini İngilizce tarif edin.","r":"S with a tail","why":""},{"w":"How do you spell “coffee”?","r":"C, O, double F, double E","why":""},{"w":"45 in English?","r":"forty-five","why":"forty — u yok!"},{"w":"13 mü 30 mu? “THIRty”","r":"30","why":"vurgu başta → -ty"},{"w":"Fiyat nasıl sorulur?","r":"How much is it?","why":""},{"w":"Çarşamba in English? Spell it!","r":"Wednesday · W, E, D, N, E, S, D, A, Y","why":""},{"w":"Hafta sonu?","r":"the weekend","why":"Saturday and Sunday"},{"w":"“Ayağa kalkın!” in English?","r":"Stand up!","why":""},{"w":"🍎 What's this?","r":"It's an apple.","why":"an: sesli harf"},{"w":"☂️ What's this?","r":"It's an umbrella.","why":""},{"w":"kırmızı bir kalem?","r":"a red pen","why":"renk isimden önce"},{"w":"“Tekrar eder misiniz?” in English?","r":"Can you repeat, please?","why":""}]}]},{"id":"aan-recap","block":5,"step":24,"min":6,"mode":"Tüm sınıf","material":"Ekran, eşyalar","kicker":"Adım 24 · Hatırla","title":"a / an = one","titleTR":"Önce hatırla: a / an = bir (herhangi bir tane)","lead":"\u003cb>a / an\u003c/b> = \u003cb>bir\u003c/b>. Tek bir şey, \u003cb>herhangi biri\u003c/b> — hangisi olduğu önemli değil. \u003cb>an\u003c/b> sadece söylemeyi kolaylaştırır.","sections":[{"type":"rules","cols":3,"title":"a mı, an mı?","titleTR":"Three simple rules","items":[{"tag":"a","h":"a + sessiz harf","tr":"a pen · a book · a key · a red bag","ex":"🖊️ It's \u003cb>a\u003c/b> pen."},{"tag":"an","h":"an + sesli harf (a, e, i, o, u)","tr":"an apple · an egg · an umbrella · an orange","ex":"🍎 It's \u003cb>an\u003c/b> apple."},{"tag":"✗","h":"Çoğulda ve isimlerde yok","tr":"a pens ✗ → two pens · an Ayşe ✗ → Ayşe","ex":"two pens · my friend Ayşe"}]},{"type":"choice","title":"Hızlı kontrol: a mı, an mı?","titleTR":"a or an?","items":[{"q":"🖊️ ___ pen","o":["a","an"],"a":0,"why":"p sessiz harf"},{"q":"🍎 ___ apple","o":["a","an"],"a":1,"why":"a sesli harf"},{"q":"☂️ ___ umbrella","o":["a","an"],"a":1,"why":"u sesli harf"},{"q":"📕 ___ book","o":["a","an"],"a":0,"why":"b sessiz harf"},{"q":"🥚 ___ egg","o":["a","an"],"a":1,"why":"e sesli harf"},{"q":"🔑 ___ key","o":["a","an"],"a":0,"why":"k sessiz harf"},{"q":"🍊 ___ orange","o":["a","an"],"a":1,"why":"o sesli harf"},{"q":"🍎 ___ red apple","o":["a","an"],"a":0,"why":"Dikkat! Hemen sonraki kelime \u003cb>red\u003c/b> → sessiz harf → a"}]}]},{"id":"the-intro","block":5,"step":25,"min":10,"mode":"Tüm sınıf","material":"Ekran, kalemler","kicker":"Adım 25 · the","title":"the = the one we know","titleTR":"the: “hangisi olduğunu ikimiz de biliyoruz”","lead":"\u003cb>a / an\u003c/b> = bir, herhangi biri 🙋 · \u003cb>the\u003c/b> = o, \u003cb>bildiğimiz\u003c/b> 👉. Tek soru: \u003ci>Karşımdaki “hangisi?” diye sorar mı?\u003c/i> Sormazsa → \u003cb>the\u003c/b>.","sections":[{"type":"stepper","title":"Adım adım","titleTR":"Step by step","steps":[{"h":"a / an = bir, herhangi biri 🙋","p":["Masada beş kalem var. \u003ci>“A pen, please.”\u003c/i> → hangisi olursa olsun, bir tane."],"en":"A pen, please.","ok":"ı pen, pliiz","tr":"Bir kalem, lütfen. (herhangi biri)"},{"h":"the = o, bildiğimiz 👉","p":["Masada tek bir kırmızı kalem var. \u003ci>“The red pen, please.”\u003c/i> → ikimiz de hangisi olduğunu biliyoruz."],"en":"The red pen, please.","ok":"dı red pen, pliiz","tr":"Kırmızı kalemi ver, lütfen. (o belli kalem)"},{"h":"Türkçede de var!","p":["Türkçede bildiğimiz şeye \u003cb>-ı / -i\u003c/b> ekleriz: kapı\u003cb>yı\u003c/b> kapat, kitab\u003cb>ı\u003c/b> aç. İngilizcede bunun yerine başa \u003cb>the\u003c/b> gelir."],"ex":["Bir kalem ver. → Give me \u003cb>a\u003c/b> pen.","Kalem\u003cb>i\u003c/b> ver. → Give me \u003cb>the\u003c/b> pen.","Kapı\u003cb>yı\u003c/b> kapat. → Close \u003cb>the\u003c/b> door.","Kitab\u003cb>ı\u003c/b> aç. → Open \u003cb>the\u003c/b> book."]},{"h":"Tek soru: “Hangisi?”","p":["Söylemeden önce düşünün: \u003cb>karşımdaki “hangisi?” diye sorar mı?\u003c/b>","Sorabilir ya da önemli değil → \u003cb>a / an\u003c/b> · Sormaz, biliyor → \u003cb>the\u003c/b>"]}]},{"type":"rules","cols":3,"title":"the ne zaman?","titleTR":"Three situations","items":[{"tag":"1","h":"🔁 İkinci kez söyleyince","tr":"İlk kez a / an, sonra the.","ex":"I have \u003cb>a\u003c/b> cat. \u003cb>The\u003c/b> cat is black."},{"tag":"2","h":"☝️ Tek olan şeyler","tr":"Dünyada ya da sınıfta bir tane var.","ex":"\u003cb>the\u003c/b> sun ☀️ · \u003cb>the\u003c/b> moon 🌙 · \u003cb>the\u003c/b> board · \u003cb>the\u003c/b> door · \u003cb>the\u003c/b> teacher"},{"tag":"3","h":"👉 Gösterdiğimiz, belli olan","tr":"İkimiz de görüyoruz, biliyoruz.","ex":"\u003cb>The\u003c/b> red pen, please. · Look at \u003cb>the\u003c/b> board!"}]},{"type":"ccq","title":"Kontrol soruları","titleTR":"Check questions","items":[{"q":"“A pen, please.” — Hangi kalem?","a":"Herhangi biri. Fark etmez."},{"q":"“The red pen, please.” — Hangi kalem?","a":"Belli olan: masadaki tek kırmızı kalem."},{"q":"“Close the door.” — Sınıfta kaç kapı var?","a":"Bir tane → herkes hangisi olduğunu biliyor → the."},{"q":"“I have a cat. The cat is black.” — İkinci cümlede neden the?","a":"Kediyi artık biliyoruz: ilk cümlede söyledik."}]}]},{"id":"the-story","block":5,"step":26,"min":8,"mode":"Tüm sınıf","material":"Ekran","kicker":"Adım 26 · Hikâyeyle","title":"First a, then the","titleTR":"Hikâyeyle görelim: ilk kez a / an, ikinci kez the","lead":"Her hikâyede aynı desen: bir şeyi \u003cb>ilk kez\u003c/b> söylerken \u003cb>a / an\u003c/b> ☝️, \u003cb>ikinci kez\u003c/b> söylerken \u003cb>the\u003c/b> 👉.","sections":[{"type":"examples","title":"Hikâye 1: Benim çantam 🎒","titleTR":"My bag","cols":1,"items":[["I have a bag.","Bir çantam var.","a · ilk kez"],["The bag is black.","Çanta siyah.","the · ikinci kez"],["In the bag, I have a pen, a book and an apple.","Çantada bir kalem, bir kitap ve bir elma var.","a / an · ilk kez"],["The pen is blue. The book is red. The apple is green.","Kalem mavi. Kitap kırmızı. Elma yeşil.","the · ikinci kez"]]},{"type":"examples","title":"Hikâye 2: Bak! 🐱🐶","titleTR":"Look!","cols":1,"items":[["Look! A cat and a dog!","Bak! Bir kedi ve bir köpek!","a · ilk kez"],["The cat is black. The dog is white.","Kedi siyah. Köpek beyaz.","the · ikinci kez"]]},{"type":"examples","title":"Hikâye 3: Sınıfımız 🏫","titleTR":"Our classroom","cols":1,"items":[["This is our classroom.","Bu bizim sınıfımız.",""],["The door is brown. The board is white.","Kapı kahverengi. Tahta beyaz.","the · sınıfta tek"],["The teacher is Gürkan.","Öğretmen Gürkan.","the · tek öğretmen"]]},{"type":"contrast","title":"Farkı bul","titleTR":"Spot the difference","items":[{"a":"I have \u003cb>a\u003c/b> dog.","b":"\u003cb>The\u003c/b> dog is white.","ans":"Solda köpeği ilk kez söylüyoruz → a. Sağda artık biliyoruz → the."},{"a":"\u003cb>A\u003c/b> pen, please.","b":"\u003cb>The\u003c/b> red pen, please.","ans":"Solda herhangi bir kalem. Sağda belli kalem: masadaki tek kırmızı kalem."},{"a":"It's \u003cb>a\u003c/b> door.","b":"Close \u003cb>the\u003c/b> door, please.","ans":"Solda “bu ne?” → bir kapı. Sağda sınıfın kapısı → herkes biliyor."},{"a":"It's \u003cb>an\u003c/b> apple.","b":"\u003cb>The\u003c/b> apple is green.","ans":"Önce tanıtıyoruz (an), sonra hakkında konuşuyoruz (the)."}]}]},{"id":"the-tpr","block":5,"step":27,"min":8,"mode":"Tüm sınıf, ayakta","material":"Ekran","kicker":"Adım 27 · Sınıfta göster","title":"Touch a … · Point to the …","titleTR":"Sınıfta göster: herhangi biri mi, belli olan mı?","lead":"Herkes ayağa! \u003cb>a\u003c/b> duyarsanız herkes \u003cb>farklı\u003c/b> bir şeye dokunur 🙋🙋🙋; \u003cb>the\u003c/b> duyarsanız herkes \u003cb>aynı\u003c/b> şeyi gösterir 👉.","sections":[{"type":"activity","icon":"👉","name":"Touch a … / Point to the …","en":"a = herhangi biri · the = belli olan","time":"4 dk","group":"Tüm sınıf, ayakta","steps":["Öğretmen: \u003ci>“Touch a chair!”\u003c/i> → herk <script>/* A1 · Day 02 · alphabet & spelling · lesson app (engine: A1 Day 01 + memory / note-taking components) */
(function () {
  const S = LESSON.screens;
  const isExtra = s => !!s.extra;
  const KEY = "a1-day2-2026";
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const strip = s => String(s).replace(/<[^>]+>/g, "").replace(/\{\w\|([^}]+)\}/g, "$1");

  /* ── state ── */
  let st = { idx: -1, tr: true, teacher: false, proj: false, visited: {}, inputs: {}, choices: {}, marks: {}, sorts: {}, scores: { a: 0, b: 0 }, game: {}, deck: {} };
  try { const raw = localStorage.getItem(KEY); if (raw) st = Object.assign(st, JSON.parse(raw)); } catch (e) {}
  let saveT;
  st.teacher=false;
function save() {st.teacher=false; clearTimeout(saveT); saveT = setTimeout(() => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }, 150); }

  function toast(msg, ms = 1800) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("show"), ms); }

  /* ── normalisation for answer checking ── */
  function norm(s) {
    s = String(s).toLowerCase().replace(/[’‘`´]/g, "'").replace(/[.,!?;:"“”]/g, " ");
    s = s.replace(/\bcan't\b/g, "can not").replace(/\bcannot\b/g, "can not").replace(/\bwon't\b/g, "will not").replace(/n't\b/g, " not")
      .replace(/'m\b/g, " am").replace(/'re\b/g, " are").replace(/'ve\b/g, " have").replace(/'s\b/g, " is").replace(/'ll\b/g, " will").replace(/'d\b/g, " would");
    return s.replace(/\s+/g, " ").trim();
  }
  const accepts = (val, alts) => alts.split("|").some(a => norm(a) === norm(val));
  const seeded = (arr, seed) => { const a = arr.map((x, i) => [x, i]); let h = 0; for (const c of String(seed)) h = (h * 31 + c.charCodeAt(0)) >>> 0; for (let i = a.length - 1; i > 0; i--) { h = (h * 1103515245 + 12345) >>> 0; const j = h % (i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  /* ── speech ──
     Yerel (internetsiz) İngilizce sesler önce seçilir. Bir ses 2,5 sn içinde başlamazsa ya da hata verirse
     otomatik olarak sıradaki İngilizce sese geçilir. Öğretmen sağ üstteki “🔊 Ses” panelinden sesi seçip deneyebilir. */
  const synth = window.speechSynthesis;
  const VKEY = "lesson-voice", RATE = 0.8;
  let voices = [], token = 0;
  const bad = new Set(), keep = [];
  const rank = v => (v.localService ? 0 : 10) + (/GB/i.test(v.lang) ? 0 : /US/i.test(v.lang) ? 1 : 2);
  function loadVoices() {
    let all = []; try { all = synth ? synth.getVoices() : []; } catch (e) {}
    voices = all.filter(v => /^en/i.test(v.lang)).sort((x, y) => rank(x) - rank(y));
    paintVoices();
  }
  if (synth) { loadVoices(); try { synth.addEventListener("voiceschanged", loadVoices); } catch (e) { synth.onvoiceschanged = loadVoices; } }
  const savedVoice = () => { let n = ""; try { n = localStorage.getItem(VKEY) || ""; } catch (e) {} return n; };
  function pickVoice(i = 0) {
    if (!voices.length) { try { voices = (synth ? synth.getVoices() : []).filter(v => /^en/i.test(v.lang)).sort((x, y) => rank(x) - rank(y)); } catch (e) {} }
    const ok = voices.filter(v => !bad.has(v.name)); if (!ok.length) return null;
    const c = ok.find(v => v.name === savedVoice());
    const local = ok.filter(v => v.localService), pool = local.length ? local : ok;
    const order = c ? [c, ...pool.filter(v => v !== c)] : pool;
    return order[i % order.length];
  }
  function stopSpeech() { token++; if (synth) synth.cancel(); }
  function noVoiceHelp() {
    toast(voices.length ? "Ses çıkmadı. Sağ üstteki “🔊 Ses” düğmesinden başka bir İngilizce ses seçip “Dene”ye basın." : "Bu bilgisayarda İngilizce ses yok. Windows Ayarlar → Saat ve dil → Konuşma → Ses ekle → English (United Kingdom veya United States).", 6500);
  }
  function speak(parts, btn, onLine) {
    if (!synth) { toast("Bu tarayıcı sesli okumayı desteklemiyor. Edge veya Chrome kullanın.", 4000); return; }
    if (btn && (synth.speaking || synth.pending)) { stopSpeech(); btn.textContent = btn.dataset.label; if (onLine) onLine(-1); return; }
    const list = Array.isArray(parts) ? parts : [{ text: parts }];
    const my = ++token, wasBusy = synth.speaking || synth.pending;
    synth.cancel();
    let started = false, ended = false, cur = -1;
    const finish = () => { if (ended || my !== token) return; ended = true; if (btn) btn.textContent = btn.dataset.label; if (onLine) onLine(-1); };
    const run = attempt => {
      if (my !== token) return;
      cur = attempt; started = false;
      const first = pickVoice(list[0].voice || 0);
      const retry = v => { if (attempt !== cur) return; if (v && attempt < 4) { bad.add(v.name); synth.cancel(); setTimeout(() => run(attempt + 1), 80); } else { synth.cancel(); finish(); noVoiceHelp(); } };
      list.forEach((p, i) => {
        const u = new SpeechSynthesisUtterance(p.text), v = pickVoice(p.voice || 0);
        if (v) { u.voice = v; u.lang = v.lang; } else u.lang = "en-GB";
        u.rate = p.rate || RATE; if (p.pitch) u.pitch = p.pitch;
        u.onstart = () => { if (my !== token || attempt !== cur) return; started = true; if (onLine) onLine(i); };
        u.onerror = e => { if (my !== token || attempt !== cur || e.error === "interrupted" || e.error === "canceled") return; if (!started) retry(v); else if (i === list.length - 1) finish(); };
        if (i === list.length - 1) u.onend = () => { if (attempt === cur) finish(); };
        keep.push(u); if (keep.length > 80) keep.splice(0, keep.length - 80);
        try { synth.resume(); } catch (e) {}
        synth.speak(u);
      });
      setTimeout(() => { if (my === token && attempt === cur && !started && !ended) retry(first); }, 2500);
    };
    if (btn) btn.textContent = "■ Durdur";
    if (wasBusy) setTimeout(() => run(0), 60); else run(0);
  }

  /* voice panel (🔊 Ses) */
  function paintVoices() {
    const sel = document.getElementById("voice-select"), stat = document.getElementById("voice-status"); if (!sel || !stat) return;
    const saved = savedVoice();
    sel.innerHTML = `<option value="">Otomatik (önerilen: yerel İngilizce ses)</option>` + voices.map(v => `<option value="${esc(v.name)}" ${v.name === saved ? "selected" : ""}>${esc(v.name)} · ${esc(v.lang)} · ${v.localService ? "yerel, internetsiz" : "çevrimiçi, internet gerekir"}</option>`).join("");
    const v = pickVoice(0);
    stat.textContent = !synth ? "Bu tarayıcı sesli okumayı desteklemiyor." : !voices.length ? "Bu bilgisayarda İngilizce ses bulunamadı. Windows Ayarlar → Saat ve dil → Konuşma → Ses ekle → English." : `Şu an kullanılan ses: ${v ? v.name + (v.localService ? " (yerel)" : " (çevrimiçi)") : "—"} · ${voices.length} İngilizce ses bulundu.`;
  }
  function buildVoicePanel() {
    const fsb = $("#fs-btn"); if (!fsb || $("#voice-btn")) return;
    const b = document.createElement("button"); b.className = "pill"; b.id = "voice-btn"; b.type = "button"; b.title = "Okuma sesini seç ve dene"; b.textContent = "🔊 Ses";
    fsb.parentNode.insertBefore(b, fsb);
    const p = document.createElement("div"); p.className = "voice-panel"; p.id = "voice-panel"; p.hidden = true;
    p.innerHTML = `<h4>🔊 Okuma sesi</h4><p>İnternetsiz çalışan <b>yerel</b> İngilizce sesler önerilir. 🔊 düğmeleri ses çıkarmıyorsa listeden başka bir ses seçip “Dene”ye basın. Seçim bu bilgisayarda saklanır.</p><select id="voice-select" aria-label="Okuma sesi"></select><div class="row"><button class="btn small primary" id="voice-test" type="button">▶ Dene</button><button class="btn small ghost" id="voice-close" type="button">Kapat</button></div><p class="vp-status" id="voice-status"></p>`;
    document.body.appendChild(p);
    b.addEventListener("click", () => { loadVoices(); p.hidden = !p.hidden; });
    $("#voice-close").addEventListener("click", () => { p.hidden = true; });
    $("#voice-select").addEventListener("change", e => { const n = e.target.value; try { if (n) localStorage.setItem(VKEY, n); else localStorage.removeItem(VKEY); } catch (er) {} bad.delete(n); paintVoices(); });
    $("#voice-test").addEventListener("click", () => { bad.clear(); speak([{ text: "Hello! Nice to meet you. A, B, C. One, two, three." }]); setTimeout(paintVoices, 3000); });
    paintVoices();
  }

  /* ── sidebar ── */
  function screenNum(i) { return String(i + 1).padStart(2, "0"); }
  function buildNav() {
    const nav = $("#lesson-nav"); let html = ""; let curBlock = null;
    S.forEach((s, i) => {
      const b = s.block;
      if (b !== curBlock) {
        curBlock = b;
        if (b > 0) { const bl = LESSON.blocks[b - 1]; html += `<div class="nav-group"><span>Blok ${b} · ${esc(bl.title)}</span></div>`; }
        else html += `<div class="nav-group"><span>Kaynaklar</span></div>`;
      }
      const cls = ["nav-btn"]; if (s.type === "break") cls.push("brk"); if (isExtra(s)) cls.push("extra");
      const num = s.type === "break" ? "☕" : (b === 0 ? "▤" : screenNum(i));
      html += `<button class="${cls.join(" ")}" data-i="${i}"><span class="nav-num">${num}</span><span>${esc(s.title)}</span>${s.min ? `<span class="nav-min">${s.min}′</span>` : ""}</button>`;
    });
    nav.innerHTML = html;
    const sel = $("#screen-select");
    sel.innerHTML = `<option value="-1">Dersin genel görünümü</option>` + S.map((s, i) => `<option value="${i}">${s.type === "break" ? "☕" : screenNum(i)} · ${esc(s.title)}${isExtra(s) ? " (ek)" : ""}</option>`).join("");
  }
  function updateNav() {
    $$(".nav-btn[data-i]").forEach(b => { const i = +b.dataset.i; b.classList.toggle("active", i === st.idx); b.classList.toggle("done", !!st.visited[S[i].id]); });
    $$(".home-nav").forEach(b => b.classList.toggle("active", st.idx === -1));
    $("#screen-select").value = st.idx;
    const core = S.filter(s => s.block > 0 && s.type !== "break" && !isExtra(s));
    const done = core.filter(s => st.visited[s.id]).length;
    $("#progress-count").textContent = `${done} / ${core.length}`;
    $("#progress-fill").style.width = (done / core.length * 100) + "%";
    $("#counter").textContent = st.idx < 0 ? "—" : `${st.idx + 1} / ${S.length}`;
    const a = $(".nav-btn.active"); if (a && a.scrollIntoView) { try { a.scrollIntoView({ block: "nearest" }); } catch (e) {} }
  }

  /* ── go ── */
  const idxOf = id => S.findIndex(s => s.id === id);
  function go(i, push = true) {
    i = Math.max(-1, Math.min(S.length - 1, i));
    if (synth) stopSpeech();
    st.idx = i;
    if (i >= 0) st.visited[S[i].id] = true;
    document.body.classList.remove("show-answers"); $("#ans-btn").setAttribute("aria-pressed", "false"); $("#ans-btn").textContent = "Cevapları göster";
    render(); updateNav(); save();
    if (!timer.running) timer.set(i >= 0 && S[i].min ? S[i].min * 60 : 300);
    if (push) { try { history.replaceState(null, "", "#" + (i >= 0 ? S[i].id : "home")); } catch (e) {} }
    window.scrollTo({ top: 0 }); $("#main").focus({ preventScroll: true });
    document.body.classList.remove("nav-open");
  }

  /* ── render ── */
  function header(s) {
    const badges = [];
    if (s.mode) badges.push(`<span class="badge">${esc(s.mode)}</span>`);
    if (s.min) badges.push(`<span class="badge gray">${s.min} dk</span>`);
    if (s.material) badges.push(`<span class="badge gray">${esc(s.material)}</span>`);
    if (isExtra(s)) badges.push(`<span class="badge amber">Ek / yedek</span>`);
    if (s.short) badges.push(`<span class="badge amber">kısaltılabilir</span>`);
    const stages = (s.stages || []).map(([t, m]) => `<span class="stage"><b>${m ? m + "′" : "·"}</b>${esc(t)}</span>`).join("");
    return `<p class="kicker">${esc(s.kicker || "")}</p>
      <div class="screen-head"><div><h1>${esc(s.title)}</h1>${s.titleTR ? `<p class="title-tr">${esc(s.titleTR)}</p>` : ""}</div><div class="badges">${badges.join("")}</div></div>
      ${s.lead ? `<p class="lead">${s.lead}</p>` : ""}${s.leadTR ? `<p class="lead-tr tr"><span class="tr-badge">TR</span>${s.leadTR}</p>` : ""}
      ${(s.teacher && s.teacher.length) || stages ? `` : ""}`;
  }
  function secTitle(o, fallback) {
    const t = o.title || fallback; if (!t) return "";
    return `<div class="sec-title"><h2>${t}</h2>${o.titleTR ? `<span class="tr">${o.titleTR}</span>` : ""}</div>`;
  }

  function render() {
    const m = $("#main");
    if (st.idx < 0) { m.innerHTML = renderHome(); bindHome(m); return; }
    const s = S[st.idx];
    if (s.type === "break") { m.innerHTML = renderBreak(s); timer.paint(); return; }
    if (s.type === "vocab") { m.innerHTML = header(s) + renderVocab(); bindVocab(m); return; }
    if (s.type === "plan") { m.innerHTML = header(s) + renderPlan(); bindPlan(m); return; }
    let html = header(s);
    s.sections.forEach((sec, k) => { const fn = R[sec.type]; html += `<section class="sec" data-k="${k}">${fn ? fn(sec, s, k) : ""}</section>`; });
    html += `<div class="row" style="margin-top:34px">${st.idx > 0 ? `<button class="btn" data-go="${st.idx - 1}">← ${esc(S[st.idx - 1].title)}</button>` : ""}<span class="spacer"></span>${st.idx < S.length - 1 ? `<button class="btn primary" data-go="${st.idx + 1}">${esc(S[st.idx + 1].title)} →</button>` : ""}</div>`;
    m.innerHTML = html;
    s.sections.forEach((sec, k) => { const b = B[sec.type]; if (b) b($(`section[data-k="${k}"]`, m), sec, s, k); });
    bindCommon(m);
  }

  function bindCommon(root) {
    $$("[data-reveal]", root).forEach(btn => btn.addEventListener("click", () => {
      const host = btn.closest("[data-host]") || btn.parentElement; host.classList.toggle("open");
      btn.textContent = host.classList.contains("open") ? (btn.dataset.hide || "Gizle") : btn.dataset.label;
    }));
    $$("[data-go]", root).forEach(b => b.addEventListener("click", () => go(+b.dataset.go)));
    $$("[data-goto]", root).forEach(b => b.addEventListener("click", () => go(idxOf(b.dataset.goto))));
    $$("[data-peek]", root).forEach(b => b.addEventListener("click", () => {
      const q = b.closest(".q-item"); const on = q.classList.toggle("peek");
      b.textContent = on ? "Gizle" : "💡 Cevap"; b.setAttribute("aria-pressed", on);
    }));
    $$("[data-say]", root).forEach(b => { if (b.closest(".vlist")) return; b.addEventListener("click", () => { if (synth) synth.cancel(); speak(b.dataset.say); }); });
    $$("[data-slowsay]", root).forEach(b => b.addEventListener("click", () => { if (synth) synth.cancel(); speak([{ text: b.dataset.slowsay, rate: 0.55 }]); }));
  }
  const revealBtn = (label = "Cevabı göster", hide = "Gizle") => `<button class="reveal-btn" data-reveal data-label="${label}" data-hide="${hide}">${label}</button>`;
  const peekBtn = `<button class="peek-btn" data-peek title="Bu sorunun cevabını göster">💡 Cevap</button>`;
  const sayBtn = t => `<button class="say-btn" data-say="${esc(strip(t))}" title="Dinle" aria-label="Listen">🔊</button>`;
  const key = (s, k, i, j = 0) => `${s.id}.${k}.${i}.${j}`;

  /* ── section renderers ── */
  const R = {}, B = {};

  R.promptCards = (o) => `${secTitle(o)}<div class="grid ${o.small ? "g3" : "g2"}">${o.cards.map((c, i) => `
    <div class="prompt-card ${o.small ? "small" : ""}" data-host><span class="num">${String(i + 1).padStart(2, "0")}</span><div class="q">${c.en}</div>${c.tr ? `<div class="tr muted">${c.tr}</div>` : ""}
    <div class="foot"><span class="ans tag">${c.ans}</span>${revealBtn(o.reveal || "Show")}</div></div>`).join("")}</div>`;

  R.golden = (o) => `${secTitle(o)}<div class="golden"><div class="bad"><b>✗ ${o.badLabel || "Too short"}</b>${o.short}</div><div class="good"><b>✓ ${o.goodLabel || "Longer + throw it back"}</b>${o.long}</div></div>`;
  R.chips = (o) => `${secTitle(o)}<div class="chips">${o.items.map(c => `<span class="chip">${c}</span>`).join("")}</div>`;
  R.frames = (o) => `${secTitle(o)}<div class="grid g2">${o.items.map(c => `<div class="frame">${c}</div>`).join("")}</div>`;
  R.steps = (o) => `${secTitle(o)}<ol class="steps">${o.items.map(c => `<li><div>${c.en}${c.tr ? `<div class="tr muted">${c.tr}</div>` : ""}</div></li>`).join("")}</ol>`;
  R.callout = (o) => `<div class="callout ${o.tone || "info"}"><h3>${o.title}${o.titleTR ? ` <small class="tr muted">· ${o.titleTR}</small>` : ""}</h3><p>${o.text}</p>${o.textTR ? `<p class="tr" style="margin-top:6px;color:var(--purple)">${o.textTR}</p>` : ""}${o.go ? `<div class="row" style="margin-top:10px">${o.go.map(g => `<button class="btn small" data-goto="${g[0]}">${g[1]} →</button>`).join("")}</div>` : ""}</div>`;
  R.model = (o) => `<div class="model"><span class="label">${o.title || "Model"}</span>${o.text}${o.listen ? `<div style="margin-top:8px">${sayBtn(o.text)}</div>` : ""}</div>`;
  R.modelHidden = (o) => `<div class="model" data-host><span class="label">${o.title}</span>${revealBtn("Örnek metni göster", "Örnek metni gizle")}<div class="ans" style="margin-top:8px">${o.text}</div></div>`;

  /* generic table */
  R.table = (o) => { const hi = [].concat(o.hi === undefined ? [] : o.hi); return `${secTitle(o)}<div class="tbl-wrap"><table class="${o.compact ? "plain" : ""} ${o.cls || ""}"><thead><tr>${o.head.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>
    ${o.rows.map((r, i) => `<tr class="${hi.includes(i) ? "hi-row" : ""}">${r.map((c, j) => `<td class="${j === 0 && o.firstBold !== false ? "tname" : ""}">${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>${o.note ? `<p class="note">${o.note}</p>` : ""}`; };

  /* rule cards */
  R.rules = (o) => `${secTitle(o)}<div class="grid ${o.cols === 3 ? "g3" : o.cols === 4 ? "g4" : "g2"}">${o.items.map((r, i) => `<div class="rule-card r${i % 4}"><span class="rule-n">${r.tag || String(i + 1).padStart(2, "0")}</span><h3>${r.h}</h3>${r.tr ? `<p class="tr-line">${r.tr}</p>` : ""}${r.en ? `<p>${r.en}</p>` : ""}${r.ex ? `<div class="rule-ex">${r.ex}</div>` : ""}</div>`).join("")}</div>`;

  /* flip cards */
  R.flip = (o, s, k) => `${secTitle(o)}<div class="flip-grid ${o.big ? "big" : ""}">${o.items.map((c, i) => `<button class="flip" data-flip="${i}"><span class="f-front">${c[0]}</span><span class="f-back">${c[1]}</span></button>`).join("")}</div>
    <div class="ex-tools"><button class="btn small" data-flip-all>Hepsini çevir</button><button class="btn small ghost" data-flip-reset>Kapat</button>${o.listen ? `<button class="btn small" data-flip-say data-label="🔊 Hepsini dinle">🔊 Hepsini dinle</button>` : ""}<span class="muted" style="font-size:.85rem">Karta dokununca arkası görünür.</span></div>`;
  B.flip = (el, o) => {
    $$("[data-flip]", el).forEach(b => b.addEventListener("click", () => b.classList.toggle("on")));
    $("[data-flip-all]", el).addEventListener("click", () => $$("[data-flip]", el).forEach(b => b.classList.add("on")));
    $("[data-flip-reset]", el).addEventListener("click", () => $$("[data-flip]", el).forEach(b => b.classList.remove("on")));
    const sb = $("[data-flip-say]", el); if (sb) sb.addEventListener("click", e => speak(o.items.map(c => ({ text: strip(c[0]) + ", " + strip(c[1]) })), e.target));
  };

  /* mcq with shared options */
  R.mcq = (o, s, k) => `${secTitle(o)}<div class="q-list">${o.items.map((it, i) => `
    <div class="q-item" data-i="${i}"><div class="qtext"><span>${it.q}</span>${peekBtn}</div><div class="opts">${o.options.map((op, j) => `<button class="opt ${j === it.a ? "is-ans" : ""}" data-j="${j}">${op}</button>`).join("")}</div><div class="why">${it.why ? "✓ " + it.why : ""}</div></div>`).join("")}</div>
    <div class="ex-tools"><span class="score" data-score></span><button class="btn small ghost" data-clear>Temizle</button></div>`;
  B.mcq = (el, o, s, k) => bindChoice(el, o, s, k, it => it.a);

  /* choice with per-item options */
  R.choice = (o, s, k) => `${secTitle(o)}<div class="q-list ${o.start ? "" : ""}" ${o.start ? `style="counter-reset:q ${o.start - 1}"` : ""}>${o.items.map((it, i) => `
    <div class="q-item" data-i="${i}"><div class="qtext"><span>${it.q}</span>${peekBtn}</div><div class="opts">${it.o.map((op, j) => `<button class="opt ${j === it.a ? "is-ans" : ""}" data-j="${j}">${op}</button>`).join("")}</div><div class="why">${it.why ? "✓ " + it.why : ""}</div></div>`).join("")}</div>
    <div class="ex-tools"><span class="score" data-score></span><button class="btn small ghost" data-clear>Temizle</button></div>`;
  B.choice = (el, o, s, k) => bindChoice(el, o, s, k, it => it.a);

  function bindChoice(el, o, s, k, correct) {
    const paint = () => {
      let ok = 0, n = 0;
      $$(".q-item", el).forEach(q => {
        const i = +q.dataset.i, picked = st.choices[key(s, k, i)];
        q.classList.remove("ok", "no", "answered");
        $$(".opt", q).forEach(b => b.classList.remove("right", "wrong"));
        if (picked === undefined) return;
        n++; const c = correct(o.items[i]);
        q.classList.add("answered", picked === c ? "ok" : "no");
        $$(".opt", q)[picked].classList.add(picked === c ? "right" : "wrong");
        if (picked === c) ok++; else $$(".opt", q)[c].classList.add("right");
      });
      $("[data-score]", el).textContent = n ? `${ok} / ${o.items.length} doğru` : "";
    };
    $$(".opt", el).forEach(b => b.addEventListener("click", () => {
      const i = +b.closest(".q-item").dataset.i; st.choices[key(s, k, i)] = +b.dataset.j; save(); paint();
    }));
    $("[data-clear]", el).addEventListener("click", () => { o.items.forEach((_, i) => delete st.choices[key(s, k, i)]); save(); paint(); });
    paint();
  }

  /* gap fill */
  R.gap = (o, s, k) => `${secTitle(o)}${o.bank ? `<div class="word-bank"><span class="label">Word bank</span>${o.bank.map(w => `<span class="chip">${w}</span>`).join("")}</div>` : ""}<div class="q-list" ${o.start ? `style="counter-reset:q ${o.start - 1}"` : ""}>${o.items.map((it, i) => {
    let j = 0;
    const html = it.q.replace(/___/g, () => { const id = key(s, k, i, j); const v = st.inputs[id] || ""; const a = it.a[j].split("|")[0]; const out = `<input class="gap-in" data-j="${j}" value="${esc(v)}" aria-label="Blank ${j + 1}" autocomplete="off" spellcheck="false" style="width:${Math.max(9, a.length + 2)}ch"><span class="gap-ans">${esc(a)}</span>`; j++; return out; });
    return `<div class="q-item" data-i="${i}"><div class="qtext"><span class="gap-text">${html}</span>${peekBtn}</div><div class="why">${it.why ? "✓ " + it.why : ""}</div></div>`;
  }).join("")}</div><div class="ex-tools"><button class="btn primary small" data-check>Kontrol et</button><span class="score" data-score></span><button class="btn small ghost" data-clear>Temizle</button></div>`;
  B.gap = (el, o, s, k) => {
    $$(".gap-in", el).forEach(inp => {
      const i = +inp.closest(".q-item").dataset.i;
      inp.addEventListener("input", () => { st.inputs[key(s, k, i, +inp.dataset.j)] = inp.value; inp.classList.remove("right", "wrong"); save(); });
      inp.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); const all = $$(".gap-in", el); const n = all[all.indexOf(inp) + 1]; n ? n.focus() : $("[data-check]", el).click(); } });
    });
    $("[data-check]", el).addEventListener("click", () => {
      let ok = 0;
      $$(".q-item", el).forEach(q => {
        const it = o.items[+q.dataset.i]; let all = true;
        $$(".gap-in", q).forEach(inp => { const good = accepts(inp.value, it.a[+inp.dataset.j]); inp.classList.toggle("right", good); inp.classList.toggle("wrong", !good); if (!good) all = false; });
        q.classList.add("answered"); q.classList.toggle("ok", all); q.classList.toggle("no", !all); if (all) ok++;
      });
      $("[data-score]", el).textContent = `${ok} / ${o.items.length} doğru`;
    });
    $("[data-clear]", el).addEventListener("click", () => { $$(".gap-in", el).forEach(inp => { inp.value = ""; inp.classList.remove("right", "wrong"); st.inputs[key(s, k, +inp.closest(".q-item").dataset.i, +inp.dataset.j)] = ""; }); $$(".q-item", el).forEach(q => q.classList.remove("answered", "ok", "no")); $("[data-score]", el).textContent = ""; save(); });
  };

  /* fix the sentence / rewrite */
  R.fix = (o, s, k) => `${secTitle(o)}<div class="q-list">${o.items.map((it, i) => `
    <div class="q-item" data-i="${i}"><div class="qtext"><span class="${o.neutral ? "fix-prompt" : "fix-wrong"}">${it.w}${it.cue ? ` <span class="cue">${it.cue}</span>` : ""}</span>${peekBtn}</div>
    <div class="fix-body"><input class="fix-in" placeholder="${o.label || "Doğru cümle"}…" value="${esc(st.inputs[key(s, k, i)] || "")}" autocomplete="off" spellcheck="false">
    <div class="ans ans-box">✓ ${it.r[0]}${it.why ? ` <span class="muted">· ${it.why}</span>` : ""}</div></div></div>`).join("")}</div>
    <div class="ex-tools"><button class="btn primary small" data-check>Kontrol et</button><span class="score" data-score></span><button class="btn small ghost" data-clear>Temizle</button></div>`;
  B.fix = (el, o, s, k) => {
    $$(".fix-in", el).forEach(inp => { const i = +inp.closest(".q-item").dataset.i; inp.addEventListener("input", () => { st.inputs[key(s, k, i)] = inp.value; inp.classList.remove("right", "wrong"); save(); }); });
    $("[data-check]", el).addEventListener("click", () => {
      let ok = 0;
      $$(".q-item", el).forEach(q => {
        const it = o.items[+q.dataset.i], inp = $(".fix-in", q);
        const good = it.r.some(r => norm(r) === norm(inp.value));
        inp.classList.toggle("right", good); inp.classList.toggle("wrong", !good); q.classList.add("open"); if (good) ok++;
      });
      $("[data-score]", el).textContent = `${ok} / ${o.items.length} birebir eşleşti · Diğerlerini modelle karşılaştırın`;
    });
    $("[data-clear]", el).addEventListener("click", () => { $$(".q-item", el).forEach(q => { const inp = $(".fix-in", q); inp.value = ""; inp.classList.remove("right", "wrong"); q.classList.remove("open"); st.inputs[key(s, k, +q.dataset.i)] = ""; }); $("[data-score]", el).textContent = ""; save(); });
  };

  /* word order */
  R.order = (o, s, k) => `${secTitle(o)}<div class="q-list">${o.items.map((it, i) => `<div class="q-item order-item" data-i="${i}"><div class="qtext"><span class="order-line" data-line><span class="muted">Kelimelere sırayla dokunun…</span></span>${peekBtn}</div>
    <div class="chips order-pool" data-pool></div><div class="ans ans-box">✓ ${it.a.split("|")[0]}${it.tr ? ` <span class="muted">· ${it.tr}</span>` : ""}</div></div>`).join("")}</div>
    <div class="ex-tools"><button class="btn primary small" data-check>Kontrol et</button><span class="score" data-score></span><button class="btn small ghost" data-clear>Temizle</button></div>`;
  B.order = (el, o, s, k) => {
    const items = $$(".order-item", el);
    const paint = (q) => {
      const i = +q.dataset.i, it = o.items[i], words = it.w.split(" / ");
      const picked = (st.inputs[key(s, k, i)] || "").split(",").filter(x => x !== "").map(Number);
      $("[data-line]", q).innerHTML = picked.length ? picked.map((w, p) => `<button class="chip on" data-back="${p}">${esc(words[w])}</button>`).join(" ") : `<span class="muted">Kelimelere sırayla dokunun…</span>`;
      $("[data-pool]", q).innerHTML = words.map((w, j) => picked.includes(j) ? "" : `<button class="chip" data-add="${j}">${esc(w)}</button>`).join("");
      $$("[data-add]", q).forEach(b => b.addEventListener("click", () => { picked.push(+b.dataset.add); st.inputs[key(s, k, i)] = picked.join(","); q.classList.remove("ok", "no", "answered"); save(); paint(q); }));
      $$("[data-back]", q).forEach(b => b.addEventListener("click", () => { picked.splice(+b.dataset.back, 1); st.inputs[key(s, k, i)] = picked.join(","); q.classList.remove("ok", "no", "answered"); save(); paint(q); }));
    };
    items.forEach(paint);
    $("[data-check]", el).addEventListener("click", () => {
      let ok = 0;
      items.forEach(q => {
        const i = +q.dataset.i, it = o.items[i], words = it.w.split(" / ");
        const picked = (st.inputs[key(s, k, i)] || "").split(",").filter(x => x !== "").map(Number);
        const good = picked.length === words.length && accepts(picked.map(w => words[w]).join(" "), it.a);
        q.classList.add("answered"); q.classList.toggle("ok", good); q.classList.toggle("no", !good); if (good) ok++;
      });
      $("[data-score]", el).textContent = `${ok} / ${o.items.length} doğru`;
    });
    $("[data-clear]", el).addEventListener("click", () => { items.forEach(q => { st.inputs[key(s, k, +q.dataset.i)] = ""; q.classList.remove("ok", "no", "answered"); paint(q); }); $("[data-score]", el).textContent = ""; save(); });
  };

  /* match halves */
  R.match = (o) => `${secTitle(o)}<div class="match"><div class="m-col" data-left>${o.pairs.map((p, i) => `<button class="m-item m-l" data-l="${i}"><span class="m-n">${i + 1}</span><span class="m-t">${p[0]}</span><span class="m-slot" data-slot="${i}"></span></button>`).join("")}</div>
    <div class="m-col">${seeded(o.pairs.map(p => p[1]), o.id).map(([t, orig], pos) => `<button class="m-item m-r" data-r="${orig}"><span class="m-n abc">${"ABCDEFGHIJKLMN"[pos]}</span><span class="m-t">${t}</span></button>`).join("")}</div></div>
    <p class="note">Soldan bir madde seçin, sonra sağdaki eşine dokunun.</p>
    <div class="ex-tools"><button class="btn primary small" data-check>Kontrol et</button><button class="btn small" data-solve>Cevapları yerleştir</button><span class="score" data-score></span><button class="btn small ghost" data-clear>Temizle</button></div>`;
  B.match = (el, o) => {
    const pl = st.sorts[o.id] = st.sorts[o.id] || {}; let sel = null, checked = false;
    const letter = orig => { const b = $(`[data-r="${orig}"] .m-n`, el); return b ? b.textContent : "?"; };
    const paint = () => {
      $$(".m-l", el).forEach(b => { const i = +b.dataset.l; b.classList.toggle("sel", sel === i); const v = pl[i]; $(".m-slot", b).textContent = v === undefined ? "" : letter(v); b.classList.toggle("ok", checked && v === i); b.classList.toggle("no", checked && v !== undefined && v !== i); });
      $$(".m-r", el).forEach(b => b.classList.toggle("used", Object.values(pl).includes(+b.dataset.r)));

    $$(".m-l", el).forEach(b => b.addEventListener("click", () => { const i = +b.dataset.l; sel = sel === i ? null : i; paint(); }));
    $$(".m-r", el).forEach(b => b.addEventListener("click", () => { if (sel === null) { toast("Önce soldan bir madde seçin"); return; } const r = +b.dataset.r; Object.keys(pl).forEach(x => { if (pl[x] === r) delete pl[x]; }); pl[sel] = r; sel = null; checked = false; save(); paint(); }));
    $("[data-check]", el).addEventListener("click", () => { checked = true; const ok = o.pairs.filter((_, i) => pl[i] === i).length; $("[data-score]", el).textContent = `${ok} / ${o.pairs.length} doğru`; paint(); });

  /* listen and type */
  R.listen = (o, s, k) => `${secTitle(o)}<div class="q-list">${o.items.map((it, i) => `<div class="q-item" data-i="${i}"><div class="qtext"><span class="row" style="gap:8px"><button class="btn small" data-play="${i}" data-label="🔊 Dinle">🔊 Dinle</button><button class="btn small ghost" data-slow="${i}">🐢 Yavaş</button>${it.hint ? `<span class="muted">${it.hint}</span>` : ""}</span>${peekBtn}</div>
    <div class="fix-body"><input class="fix-in" placeholder="Duyduğunuz cümleyi yazın…" value="${esc(st.inputs[key(s, k, i)] || "")}" autocomplete="off" spellcheck="false"><div class="ans ans-box">✓ ${it.text}</div></div></div>`).join("")}</div>
    <div class="ex-tools"><button class="btn primary small" data-check>Kontrol et</button><span class="score" data-score></span><button class="btn small ghost" data-clear>Temizle</button></div>`;
  B.listen = (el, o, s, k) => {
    $$("[data-play]", el).forEach(b => b.addEventListener("click", () => { if (synth) synth.cancel(); speak([{ text: o.items[+b.dataset.play].text }], b); }));

    $$(".fix-in", el).forEach(inp => { const i = +inp.closest(".q-item").dataset.i; inp.addEventListener("input", () => { st.inputs[key(s, k, i)] = inp.value; inp.classList.remove("right", "wrong"); save(); }); });

      let ok = 0;
      $$(".q-item", el).forEach(q => { const it = o.items[+q.dataset.i], inp = $(".fix-in", q); const good = norm(inp.value) === norm(strip(it.text)); inp.classList.toggle("right", good); inp.classList.toggle("wrong", !good); q.classList.add("open"); if (good) ok++; });
      $("[data-score]", el).textContent = `${ok} / ${o.items.length} doğru`;
    });
    $("[data-clear]", el).addEventListener("click", () => { $$(".q-item", el).forEach(q => { const inp = $(".fix-in", q); inp.value = ""; inp.classList.remove("right", "wrong"); q.classList.remove("open"); st.inputs[key(s, k, +q.dataset.i)] = ""; }); $("[data-score]", el).textContent = ""; save(); });

  /* team game / quiz */
  R.teamGame = (o, s, k) => {
    if (o.plain) return `<div class="plain-list">${o.items.map((it, i) => `<div class="plain-item" data-host><div class="w">✗ ${it.w}</div><div class="ans"><div class="r">✓ ${it.r}</div><div class="muted">${it.why}</div></div>${revealBtn("Düzeltmeyi göster")}</div>`).join("")}</div>`;
    return `${secTitle(o)}<div class="team"><div class="team-score a"><span class="tname">Team A</span><span class="pts" data-pts="a">0</span><div class="row"><button class="btn small" data-sc="a,-1">−1</button><button class="btn small primary" data-sc="a,1">+1</button></div></div>
      <div class="game-card ${o.quiz ? "quiz" : ""}" data-card><span class="cnt" data-cnt></span><div class="wrong-s" data-w></div><div class="right-s" data-r></div>
      <div class="row"><button class="btn" data-prev>←</button><button class="btn primary" data-show>${o.quiz ? "Cevabı göster" : "Düzeltmeyi göster"}</button><button class="btn" data-next>Sonraki →</button></div></div>
      <div class="team-score b"><span class="tname">Team B</span><span class="pts" data-pts="b">0</span><div class="row"><button class="btn small" data-sc="b,-1">−1</button><button class="btn small primary" data-sc="b,1">+1</button></div></div></div>
      <div class="ex-tools"><button class="btn small ghost" data-reset>Skoru ve oyunu sıfırla</button>${o.note ? `<span class="muted" style="font-size:.88rem">${o.note}</span>` : ""}</div>`;
  };
  B.teamGame = (el, o, s) => {
    if (o.plain) return;
    const card = $("[data-card]", el);
    const show = () => {
      const i = Math.min(st.game[s.id] || 0, o.items.length - 1), it = o.items[i];
      $("[data-cnt]", el).textContent = `${o.quiz ? (o.label || "QUESTION") : "SENTENCE"} ${i + 1} / ${o.items.length}`;
      $("[data-w]", el).innerHTML = (o.quiz ? "" : "✗ ") + it.w;
      $("[data-r]", el).innerHTML = (o.quiz ? "" : "✓ ") + it.r + (it.why ? `<small>${it.why}</small>` : "");

    $("[data-show]", el).addEventListener("click", () => card.classList.toggle("open"));
    $("[data-next]", el).addEventListener("click", () => { st.game[s.id] = Math.min(o.items.length - 1, (st.game[s.id] || 0) + 1); save(); show(); });
    $("[data-prev]", el).addEventListener("click", () => { st.game[s.id] = Math.max(0, (st.game[s.id] || 0) - 1); save(); show(); });
    $$("[data-sc]", el).forEach(b => b.addEventListener("click", () => { const [t, d] = b.dataset.sc.split(","); st.scores[t] = Math.max(0, st.scores[t] + +d); save(); show(); }));

  /* reading with marking */
  function parseMarks(p, rid, pi) {
    let n = 0;
    return p.replace(/\{(\w)\|([^}]+)\}/g, (_, k, w) => `<span class="mw" data-k="${k}" data-id="${rid}.${pi}.${n++}" role="button" tabindex="0">${w}</span>`);
  }
  R.reading = (o) => {

        <div class="card"><h3>${o.colTitle || "Sort the words"}</h3><div class="colbox">${keys.map(k => `<div class="col"><h4>${o.columns[k]}</h4><ul data-col="${k}"></ul></div>`).join("")}</div></div>
        ${o.rule ? `<div class="card"><h3>Find the rule</h3><div class="qa">${o.rule.map(q => `<div class="qa-item" data-host><div class="qq">${q.q}</div><div class="ans ans-box">${q.a}</div>${revealBtn()}</div>`).join("")}</div></div>` : ""}
      </div></div>`;

  B.reading = (el, o) => {
    const keys = Object.keys(o.marks), mk = st.marks[o.id] = st.marks[o.id] || {};

    const paint = () => {
      $$(".mw", el).forEach(w => {
        Object.values(o.marks).forEach(m => w.classList.remove(m.cls)); w.classList.remove("bad");
        const k = revealed ? w.dataset.k : mk[w.dataset.id]; if (k) w.classList.add(o.marks[k].cls);

      keys.forEach(k => {
        const words = $$(".mw", el).filter(w => (revealed ? w.dataset.k : mk[w.dataset.id]) === k).map(w => w.textContent.trim());
        $(`[data-col="${k}"]`, el).innerHTML = words.length ? words.map(w => `<li>${esc(w)}</li>`).join("") : `<li class="empty" style="list-style:none;margin-left:-18px">${o.tap || "Fiillere"} dokunun…</li>`;
      });
    };
    $$(".mw", el).forEach(w => {
      const cyc = () => { revealed = false; const cur = mk[w.dataset.id]; const ni = cur ? keys.indexOf(cur) + 1 : 0; if (ni >= keys.length) delete mk[w.dataset.id]; else mk[w.dataset.id] = keys[ni]; save(); paint(); };
      w.addEventListener("click", cyc); w.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); cyc(); } });
    });
    $("[data-showmarks]", el).addEventListener("click", e => { revealed = !revealed; e.target.textContent = revealed ? "Kendi işaretlerime dön" : "Doğru renkleri göster"; paint(); });
    $("[data-checkmarks]", el).addEventListener("click", () => {
      revealed = false; paint(); let ok = 0, n = 0;
      $$(".mw", el).forEach(w => { const m = mk[w.dataset.id]; if (!m) return; n++; if (m === w.dataset.k) ok++; else w.classList.add("bad"); });
      toast(n ? `${ok} / ${n} işaret doğru · Toplam ${$$(".mw", el).length} ${o.unit || "fiil"}` : "Henüz işaret yok");
    });
    $("[data-clearmarks]", el).addEventListener("click", () => { Object.keys(mk).forEach(x => delete mk[x]); revealed = false; save(); paint(); });
    $("[data-listen]", el).addEventListener("click", e => speak(o.paragraphs.map(p => ({ text: strip(p) })), e.target));
    el._reveal = on => { revealed = on; paint(); };
    paint();
  };

  R.usesBox = (o) => `${secTitle(o)}<div class="uses">${o.rows.map(r => `<div class="use-row" data-host><span class="use-side s${r.side}">${o.cols[r.side]}</span><div class="u">${r.use}<small>${r.tr}</small></div><div class="use-ex"><span class="ans">${r.ex}</span>${revealBtn("Örneği göster")}</div></div>`).join("")}</div>`;
  R.formCompare = (o) => `${secTitle(o)}<div class="grid g2">${[o.left, o.right].map((c, i) => `<div class="card form-card"><h3><span class="use-side s${i}">${c.name}</span>${c.tr ? ` <small class="tr muted" style="font-weight:500">${c.tr}</small>` : ""}</h3>${c.rows.map(r => `<div class="form-row"><span class="sign">${r[0]}</span><span>${r[1]}</span></div>`).join("")}</div>`).join("")}</div>`;
  R.spelling = (o) => `${secTitle(o, "Spelling")}${o.title ? "" : ""}<div class="grid g2">${o.items.map(c => `<div class="card"><h3>${c.title}</h3>${c.rows.map(r => `<div class="spell-row"><span>${r[0]}</span><span>${r[1]}</span></div>`).join("")}</div>`).join("")}</div>`;
  R.trTrap = (o) => `${secTitle(o)}<div class="trap-head"><span>Türkçe</span><span>✗ Turkish-style English</span><span>✓ Correct English</span></div><div class="trap">${o.rows.map(r => `<div class="trap-row" data-host><span class="trs">${r.tr}</span><span class="wr">${r.wrong}</span><span><span class="ans rt">${r.right}</span>${revealBtn("Doğrusu?")}</span></div>`).join("")}</div>`;
  R.twoCols = (o) => `${secTitle(o)}<div class="grid g2 two-cols">${o.cols.map((c, i) => `<div class="card col-card c${c.c !== undefined ? c.c : i} ${c.items[0].length > 25 ? "list" : ""}"><h3>${c.name}</h3>${c.sub ? `<p class="col-sub">${c.sub}</p>` : ""}<ul>${c.items.map(x => `<li>${x}</li>`).join("")}</ul></div>`).join("")}</div>`;
  R.contrast = (o) => `${secTitle(o)}<div class="grid g2">${o.items.map(c => `<div class="contrast-item" data-host><div class="contrast-pair"><span>${c.a}</span><span class="vs">VS</span><span>${c.b}</span></div><div class="ans ans-box">${c.ans}</div>${revealBtn("Farkı göster")}</div>`).join("")}</div>`;
  R.ccq = (o) => `${secTitle(o, "Check questions")}<div class="ccq">${o.items.map(c => `<div class="ccq-item" data-host><span class="tagq">CCQ</span><span>${c.q}</span><span class="ans">${c.a}</span>${revealBtn()}</div>`).join("")}</div>`;
  R.bigQuestion = (o) => `${secTitle(o)}<div class="bigq" data-host>${o.pre ? `<div class="pre">${o.pre}</div>` : ""}<div class="s">“${o.q}”</div>${o.opts ? `<div class="bq-opts">${o.opts.map(x => `<span>${x}</span>`).join("")}</div>` : ""}<div class="ans">${o.a}<small>${o.why}</small></div><button class="btn" data-reveal data-label="${o.btn || "Is this OK? → Cevap"}" data-hide="Gizle">${o.btn || "Is this OK? → Cevap"}</button></div>`;
  R.formTable = (o) => `${secTitle(o, "Form")}<div class="grid" style="gap:8px">${o.rows.map(r => `<div class="ft-row"><span class="sign">${r.sign}</span><span>${r.ex}</span><span class="note-c">${r.note}</span></div>`).join("")}</div>`;
  R.phraseBox = (o) => `${secTitle(o)}<div class="grid g4">${o.groups.map(g => `<div class="card phrase-card"><h3>${g.name}<small>${g.tr}</small></h3><ul>${g.items.map(x => `<li>${x}</li>`).join("")}</ul></div>`).join("")}</div>`;
  R.formula = (o) => `${secTitle(o)}<div class="formula-box">${o.lines.map(l => `<div class="formula">${l.map(p => p.startsWith("!") ? `<span class="k">${p.slice(1)}</span>` : `<span>${p}</span>`).join("")}</div>`).join("")}${o.note ? `<p class="z-note">${o.note}</p>` : ""}</div>`;

  /* past continuous timeline */
  R.pcTimeline = (o) => `${secTitle(o)}<div class="grid g2">${o.items.map(it => `<div class="pct"><div class="pct-line"><span class="pct-lbl l">PAST</span><span class="pct-lbl r">NOW</span><div class="pct-long" style="left:${it.from || 12}%;width:${it.w || 50}%"><span>${it.longLbl}</span></div>${it.shortLbl ? `<div class="pct-x" style="left:${it.x || 40}%"><span>✕</span><em>${it.shortLbl}</em></div>` : ""}${it.second ? `<div class="pct-long two" style="left:${it.from || 12}%;width:${it.w || 50}%"><span>${it.second}</span></div>` : ""}</div><div class="pct-s">${it.s}</div>${it.tr ? `<div class="tr muted">${it.tr}</div>` : ""}</div>`).join("")}</div>`;

  /* diary rule (future arrangements) */
  R.diaryRule = (o) => `${secTitle(o)}<div class="diary"><div class="diary-page"><div class="diary-top"><span>MY DIARY</span><span>${o.week}</span></div>${o.inDiary.map(d => `<div class="d-entry" data-host><span class="d-time">${d.time}</span><span class="d-what">${d.entry}</span><span class="d-ok">✓</span><div class="d-sent ans">${d.sent}</div>${revealBtn("Cümle?")}</div>`).join("")}</div>
    <div class="diary-out"><span class="label" style="color:var(--red)">✗ Not in a diary</span>${o.notDiary.map(d => `<div class="d-out" data-host><div class="d-note">${d.note}</div><div class="d-sent ans">${d.sent}</div>${revealBtn("Cümle?")}</div>`).join("")}<div class="callout warn" style="margin-top:6px"><h3>Ajanda testi</h3><p>${o.rule}</p></div></div></div>`;

  /* triangle in on at */
  R.triangle = () => `<div class="tri-wrap"><div class="tri">
      <div class="tri-band b-in"><b>IN</b><span>years · months · seasons · parts of the day</span></div>
      <div class="tri-band b-on"><b>ON</b><span>days · dates · special days</span></div>
      <div class="tri-band b-at"><b>AT</b><span>times · night · weekend</span></div></div>
    <div class="tri-ex"><div class="tri-row in"><b>IN</b> in 1998 · in October · in summer · in the morning · in the 1980s</div><div class="tri-row on"><b>ON</b> on Monday · on 6 October · on my birthday · on New Year's Day · on Friday evening</div><div class="tri-row at"><b>AT</b> at 9 o'clock · at noon · at night · at the weekend · at lunchtime</div>
    <p class="note">Ters üçgen: en geniş zaman <b>in</b>, orta <b>on</b>, en dar nokta <b>at</b>.</p></div></div>`;

  /* dialogue */
  const AVC = ["#2e5bd8", "#c2410c", "#735fc4", "#0f766e"];
  R.dialogue = (o) => { const names = [...new Set(o.lines.map(l => l[0]))]; return `<div class="reading"><div class="card"><div class="row" style="margin-bottom:12px"><h3 style="margin:0">${o.title || "Dialogue"}</h3><span class="spacer"></span><button class="btn small" data-listen data-label="🔊 Diyaloğu dinle">🔊 Diyaloğu dinle</button></div>
    <div class="dlg">${o.lines.map(([w, t], i) => `<div class="line"><span class="avatar" style="background:${AVC[names.indexOf(w) % AVC.length]}">${w[0]}</span><div class="bubble" data-line="${i}"><span class="who">${w}</span>${t}${o.lines[i][2] ? `<small class="dlg-tr">${o.lines[i][2]}</small>` : ""}</div></div>`).join("")}</div></div>
    <div class="card"><h3>${o.findTitle || "Diyalogda bulun"}</h3><div class="qa">${(o.find || []).map(q => `<div class="qa-item" data-host><div class="qq">${q.q}</div><div class="ans ans-box">${q.a}</div>${revealBtn()}</div>`).join("")}</div>
    ${o.note ? `<p class="note">${o.note}</p>` : ""}</div></div>`; };
  B.dialogue = (el, o) => {
    const names = [...new Set(o.lines.map(l => l[0]))], pitches = [1.1, 0.85, 1.25, 0.95];

      i => $$(".bubble", el).forEach(b => b.classList.toggle("speaking", +b.dataset.line === i))));
  };

  /* card draw */
  R.cardDraw = (o, s) => {
    const d = st.deck[s.id] = st.deck[s.id] || { cur: o.decks[0].key, used: {}, card: null };
    if (!o.decks.some(x => x.key === d.cur)) d.cur = o.decks[0].key;
    return `${secTitle(o)}${o.decks.length > 1 ? `<div class="deck-tabs">${o.decks.map(dk => `<button class="deck-tab ${dk.key === d.cur ? "active" : ""}" data-deck="${dk.key}">${dk.name} <small class="tr">· ${dk.tr}</small> <small class="muted" data-left="${dk.key}"></small></button>`).join("")}</div>` : `<div hidden>${o.decks.map(dk => `<small data-left="${dk.key}"></small>`).join("")}</div>`}
      <div class="draw"><div class="draw-card" data-dc></div><div class="side-stack"><div class="card"><h3>${o.promptTitle || "Discuss"}</h3><ul class="prompts" data-prompts></ul></div>

      <details class="card"><summary style="cursor:pointer;font-weight:600">Tüm kartları gör</summary><ol data-all style="margin:10px 0 0;padding-left:20px;font-size:.92rem"></ol></details></div></div>`;
  };
  B.cardDraw = (el, o, s) => {
    const d = st.deck[s.id];
    const deck = () => o.decks.find(x => x.key === d.cur);
    const paint = (anim) => {
      const dk = deck(), used = d.used[dk.key] || [], dc = $("[data-dc]", el);
      dc.className = "draw-card d" + o.decks.indexOf(dk) + (anim ? " flip" : "");
      const c = d.card && d.card.deck === dk.key ? dk.cards[d.card.i] : null;
      dc.innerHTML = c ? `<span class="dc-cat">${dk.name} · ${used.length} / ${dk.cards.length}</span><div class="dc-en">${c.en}</div><div class="dc-tr tr">${c.tr || ""}</div>`
        : `<span class="dc-cat">${dk.name}</span><div class="dc-empty">Press <b>Kart çek</b> to draw a card.</div>`;
      $("[data-prompts]", el).innerHTML = dk.prompts.map(p => `<li>${p}</li>`).join("");
      $("[data-all]", el).innerHTML = dk.cards.map(x => `<li>${x.en}${x.tr ? ` <span class="tr muted">— ${x.tr}</span>` : ""}</li>`).join("");
      o.decks.forEach(x => { const l = $(`[data-left="${x.key}"]`, el); if (l) l.textContent = `${x.cards.length - (d.used[x.key] || []).length} kaldı`; });
      $$(".deck-tab", el).forEach(t => t.classList.toggle("active", t.dataset.deck === d.cur));
    };
    $$(".deck-tab", el).forEach(t => t.addEventListener("click", () => { d.cur = t.dataset.deck; save(); paint(); }));
    $("[data-draw]", el).addEventListener("click", () => {
      const dk = deck(); let used = d.used[dk.key] = d.used[dk.key] || [];

  /* ═════════ projector spelling game: the teacher drives, the class answers aloud ═════════
     modes: spell (picture → spell, letters open one by one) · scramble (mixed letters) ·

  const TRL = { "Ç": "C with a tail", "Ş": "S with a tail", "Ğ": "soft G", "Ö": "O with two dots", "Ü": "U with two dots" };
  const sgUp = (w, tr) => tr ? w.toLocaleUpperCase("tr-TR") : w.toUpperCase();
  const sgLet = c => /[A-ZÇŞĞÖÜİ]/.test(c);

  /* spelled-out form: for speech (zed, a pause between words) or for the screen (Z, · between words) */
  const sgSpell = (w, tr, voice) => sgUp(w, tr).split(" ").map(u => { const out = []; for (let i = 0; i < u.length; i++) { const c = u[i]; if (!sgLet(c)) { out.push({ "@": "at", ".": "dot", "-": "dash", "_": "underscore" }[c] || c); continue; } const n = voice ? sgName(c, tr) : (TRL[c] || (tr && c === "I" ? "I without a dot" : c === "İ" ? "I" : c)); if (u[i + 1] === c) { out.push("double " + n); i++; } else out.push(n); } return out.join(", "); }).join(voice ? ". " : " · ");
  const SG_HOW = { spell: "Resme bakın → kelimeyi söyleyin → harf harf heceleyin!", scramble: "Karışık harflerden kelimeyi bulun ve heceleyin!", missing: "Eksik harfleri İngilizce söyleyin!", flash: "Ekrandakini İngilizce söyleyin!", listen: "Dinleyin ve yapın / söyleyin!" };
  R.spellGame = (o) => { const m = o.mode || "spell"; return `${secTitle(o)}<div class="sg sg-${m}">

    <div class="row sg-btns"><button class="btn" data-sg-prev aria-label="Önceki">←</button><button class="btn" data-sg-say>🔊 ${m === "flash" ? "Dinle" : "Kelime"}</button>${m === "flash" ? "" : `<button class="btn" data-sg-one>🔤 Sonraki harf</button>`}<button class="btn primary" data-sg-all>👁 Cevap</button>${o.random ? `<button class="btn" data-sg-rnd>🎲 Rastgele</button>` : ""}<button class="btn" data-sg-next>Sonraki →</button></div>
    ${o.teams ? `<div class="sg-score"><span class="sg-t a">Team A <b data-sgp="a"></b></span><button class="btn small" data-sgsc="a,-1">−1</button><button class="btn small primary" data-sgsc="a,1">+1</button><span class="spacer"></span><span class="sg-t b">Team B <b data-sgp="b"></b></span><button class="btn small" data-sgsc="b,-1">−1</button><button class="btn small primary" data-sgsc="b,1">+1</button></div>` : ""}
  </div>${o.note ? `<p class="note">${o.note}</p>` : ""}`; };
  B.spellGame = (el, o, s, k) => {
    const gk = `sg.${s.id}.${k}`, m = o.mode || "spell", tr = !!o.turkish; let shown = new Set();
    const idx = () => Math.min(st.game[gk] || 0, o.items.length - 1);
    const letters = it => [...sgUp(it.w, tr)].map((c, i) => sgLet(c) ? i : -1).filter(i => i >= 0);
    const hidden = it => m !== "missing" ? letters(it) : (it.miss || letters(it).filter(i => "AEIOU".includes(sgUp(it.w, tr)[i])));
    const scr = (it, i) => { const L = [...sgUp(it.w, tr)].filter(sgLet); let seed = (i + 3) * 7919; const r = () => (seed = (seed * 16807) % 2147483647) / 2147483647; const a = L.slice(); for (let j = a.length - 1; j > 0; j--) { const x = Math.floor(r() * (j + 1)); [a[j], a[x]] = [a[x], a[j]]; } if (a.join("") === L.join("") && a.length > 1) a.push(a.shift()); return a; };
    const tiles = (it, vis) => [...sgUp(it.w, tr)].map((c, i) => c === " " ? `<span class="sg-tile sp"></span>` : !sgLet(c) ? `<span class="sg-tile pun">${c}</span>` : `<span class="sg-tile ${vis.has(i) ? "on" : ""}">${vis.has(i) ? c + (TRL[c] || (tr && c === "I") ? `<small>${sgName(c, tr)}</small>` : "") : ""}</span>`).join("");
