labı)","cooker (ocak)","sink (lavabo, eviye)","bed (yatak)","mirror (ayna)","plant (bitki)","wall (duvar)","floor (yer)"]},{"type":"prompts","cols":2,"rows":4,"items":[{"label":"My living room","task":"In my living room there's … / there are …","tr":"Oturma odanızı yazın","ph":"In my living room there's …","eg":"In my living room there's a sofa next to the window. There are some plants on the shelf."},{"label":"My kitchen","task":"In my kitchen there's … / there isn't …","tr":"Mutfağınızı yazın","ph":"In my kitchen …","eg":"In my kitchen there's a big table. There isn't a dishwasher."}]}]},{"id":"k7-town","block":2,"step":7,"min":6,"extra":true,"mode":"Pairs","material":"Ekran","kicker":"Step 7 · Extra","title":"In my neighbourhood","titleTR":"Mahallemde: Is there a …? Are there any …?","lead":"Ask about your partner's neighbourhood. Give extra information!","leadTR":"Partnerinizin mahallesini sorun; cevapta ek bilgi verin.","sections":[{"type":"promptCards","small":true,"reveal":"Model","cards":[{"en":"Is there a bakery near your house?","ans":"Yes, there is. It's opposite my building."},{"en":"Are there any parks in your neighbourhood?","ans":"Yes, there are two. / No, there aren't."},{"en":"Is there a pharmacy in your street?","ans":"No, there isn't, but there's one near the hospital."},{"en":"Is there a bus stop near your house?","ans":"Yes, there is. It's in front of the school."},{"en":"Are there any good restaurants?","ans":"Yes, there's a very good kebab restaurant."},{"en":"Is there a market (pazar) on Saturdays?","ans":"Yes, there is. There's a big market every Saturday."}]},{"type":"chips","title":"Places","titleTR":"Yerler","items":["bakery (fırın)","pharmacy (eczane)","supermarket","market / bazaar (pazar)","mosque (cami)","school","hospital","post office (PTT)","bank","park","café","restaurant","bus stop (durak)","butcher's (kasap)","greengrocer's (manav)","hairdresser's (kuaför)"]}]},{"id":"k8-intro","block":2,"step":8,"min":2,"mode":"Whole class","material":"Ekran · Kutu 8","kicker":"Step 8 · Kutu 8 (1)","title":"Present Simple: when do we use it?","titleTR":"Geniş zaman: ne zaman kullanılır?","lead":"Habits, routines, facts and things that are always true.","leadTR":"Alışkanlıklar, rutinler, genel gerçekler ve kalıcı durumlar.","sections":[{"type":"rules","cols":4,"items":[{"tag":"Habit","h":"Alışkanlık","tr":"her gün, her hafta","ex":"I \u003cb>drink\u003c/b> tea every morning."},{"tag":"Routine","h":"Rutin, program","tr":"günlük düzen","ex":"The bus \u003cb>leaves\u003c/b> at 8:15."},{"tag":"Fact","h":"Genel gerçek","tr":"her zaman doğru","ex":"Water \u003cb>boils\u003c/b> at 100 °C."},{"tag":"Permanent","h":"Kalıcı durum","tr":"iş, ev, sevdiklerim","ex":"My son \u003cb>lives\u003c/b> in İzmir."}]},{"type":"bigQuestion","pre":"Big question","q":"Her sabah yürüyüş yapıyorum.","opts":["I'm walking every morning.","I walk every morning."],"btn":"Hangisi? → Cevap","a":"I walk every morning.","why":"every morning = alışkanlık → Present Simple. Türkçedeki “-yor” her zaman Present Continuous demek değildir!"}]},{"id":"k8-rule","block":2,"step":8,"min":4,"mode":"Whole class","material":"Ekran · Kutu 8","kicker":"Step 8 · Kutu 8 (2)","title":"Present Simple: he / she / it + -s","titleTR":"Olumlu cümle, üçüncü tekil şahıs -s, yazım ve okunuş","lead":"I work · you work · we work · they work — but \u003cb>he works\u003c/b>, \u003cb>she works\u003c/b>, \u003cb>it works\u003c/b>.","leadTR":"Tüm şahıslarda fiil yalın; yalnızca he / she / it ile fiile -s eklenir.","sections":[{"type":"explain","title":"Konu anlatımı","icon":"🔁","paras":["Olumlu cümlede fiil \u003cb>yalın\u003c/b> hâliyle kullanılır: \u003ci>I work, you work, we work, they work.\u003c/i> am / is / are \u003cb>kullanılmaz\u003c/b>: \u003ci>I am work\u003c/i> ✗.","Tek bir istisna var, en önemli kural da bu: \u003cb>he / she / it\u003c/b> (ve tekil isimler: my husband, Ayşe, the shop) ile fiile \u003cb>-s\u003c/b> eklenir: \u003ci>He work\u003cb>s\u003c/b>. My mother cook\u003cb>s\u003c/b>. The shop open\u003cb>s\u003c/b> at nine.\u003c/i>","Yazım: çoğu fiil + s (works, plays) · -s, -sh, -ch, -x, -o ile bitenler + \u003cb>es\u003c/b> (watches, washes, fixes, goes, does) · sessiz harf + y → \u003cb>-ies\u003c/b> (study → studies, carry → carries) · sesli + y → + s (play → plays) · \u003cb>have → has\u003c/b>."]},{"type":"persons","rows":[["I","I \u003cb>work\u003c/b> in a shop.",false,"çalışırım"],["you","You \u003cb>work\u003c/b> hard.",false,"çalışırsın / çalışırsınız"],["he","He \u003cb>works\u003c/b> in a bank.",true,"çalışır (erkek)"],["she","She \u003cb>works\u003c/b> at home.",true,"çalışır (kadın)"],["it","The shop \u003cb>opens\u003c/b> at nine.",true,"açılır"],["we","We \u003cb>work\u003c/b> together.",false,"çalışırız"],["they","They \u003cb>work\u003c/b> at night.",false,"çalışırlar"]],"note":"Sarı satırlar: he / she / it → fiil + s. Bu kuralı unutan cümle “yabancı” durur."},{"type":"spelling","title":"Spelling","titleTR":"Yazım","items":[{"title":"Most verbs → + s","rows":[["work → works",""],["live → lives",""],["play → plays","sesli + y"]]},{"title":"-s, -sh, -ch, -x, -o → + es","rows":[["watch → watches",""],["wash → washes · fix → fixes",""],["go → goes · do → does",""]]},{"title":"consonant + y → -ies","rows":[["study → studies","sessiz + y"],["carry → carries",""],["fly → flies",""]]},{"title":"Irregular","rows":[["have → has","she has (haves ✗)"],["be → is","she is"],["",""]]}]},{"type":"table","title":"Pronunciation of -s","titleTR":"-s'nin üç okunuşu","head":["Sound","When?","Examples"],"rows":[["/s/","after p, t, k, f sounds","works, likes, eats, stops, laughs"],["/z/","after most other sounds","plays, lives, goes, reads, cleans"],["/ɪz/","after s, z, sh, ch, x sounds","watches, washes, finishes, dances, relaxes"]]},{"type":"examples","title":"Examples","titleTR":"Örnekler","items":[["I \u003cb>get up\u003c/b> at six every day.","Her gün altıda kalkarım."],["My wife \u003cb>makes\u003c/b> the best dolma in Bursa.","Eşim Bursa'nın en iyi dolmasını yapar."],["Our son \u003cb>lives\u003c/b> in İzmir. He \u003cb>works\u003c/b> in a hotel.","Oğlumuz İzmir'de yaşıyor, bir otelde çalışıyor."],["The bakery \u003cb>opens\u003c/b> at seven.","Fırın yedide açılır."],["We \u003cb>visit\u003c/b> our grandchildren every Sunday.","Her pazar torunlarımızı ziyaret ederiz."],["My husband \u003cb>watches\u003c/b> the news every evening.","Eşim her akşam haberleri izler."],["Ayşe \u003cb>studies\u003c/b> English on Mondays.","Ayşe pazartesileri İngilizce çalışır."],["My mother \u003cb>has\u003c/b> tea with her neighbours every afternoon.","Annem her öğleden sonra komşularıyla çay içer."]]}]},{"id":"k8-negq","block":2,"step":8,"min":3,"mode":"Whole class","material":"Ekran · Kutu 8","kicker":"Step 8 · Kutu 8 (3)","title":"don't / doesn't · Do / Does …?","titleTR":"Olumsuz, soru ve kısa cevap: -s yardımcı fiile geçer","lead":"In negatives and questions, \u003cb>do / does\u003c/b> helps — and the main verb has \u003cb>no -s\u003c/b>.","leadTR":"Olumsuz ve soruda do / does yardım eder; ana fiil -s almaz.","sections":[{"type":"formula","title":"The -s moves to does","titleTR":"-s yardımcı fiile geçer","lines":[["She","!works","in a bank.","→ +"],["She","!doesn't","work","in a bank. → −"],["!Does","she","work","in a bank? → ?"]],"note":"he / she / it → doesn't · Does …? · I / you / we / they → don't · Do …? · Ana fiil her zaman yalın."},{"type":"formTable","rows":[{"sign":"+","ex":"I \u003cb>like\u003c/b> fish. · My wife \u003cb>likes\u003c/b> fish.","note":"fiil / fiil + s"},{"sign":"−","ex":"I \u003cb>don't like\u003c/b> coffee. · He \u003cb>doesn't like\u003c/b> coffee.","note":"don't / doesn't + yalın fiil"},{"sign":"?","ex":"\u003cb>Do\u003c/b> you \u003cb>like\u003c/b> tea? · \u003cb>Does\u003c/b> she \u003cb>like\u003c/b> tea? · Where \u003cb>do\u003c/b> they \u003cb>live\u003c/b>?","note":"Do / Does + özne + yalın fiil"},{"sign":"↩","ex":"Yes, I \u003cb>do\u003c/b>. / No, I \u003cb>don't\u003c/b>. · Yes, she \u003cb>does\u003c/b>. / No, she \u003cb>doesn't\u003c/b>.","note":"kısa cevap"}]},{"type":"examples","title":"Examples","titleTR":"Örnekler","items":[["I \u003cb>don't eat\u003c/b> meat. I'm a vegetarian.","Et yemem. Vejetaryenim."],["My husband \u003cb>doesn't drink\u003c/b> coffee.","Eşim kahve içmez."],["\u003cb>Do\u003c/b> you \u003cb>live\u003c/b> near here? — Yes, I \u003cb>do\u003c/b>.","Buraya yakın mı oturuyorsunuz? — Evet."],["\u003cb>Does\u003c/b> your daughter \u003cb>work\u003c/b>? — No, she \u003cb>doesn't\u003c/b>. She's a student.","Kızınız çalışıyor mu? — Hayır, öğrenci."],["Where \u003cb>do\u003c/b> your children \u003cb>live\u003c/b>?","Çocuklarınız nerede yaşıyor?"],["What time \u003cb>does\u003c/b> the market \u003cb>open\u003c/b>?","Pazar saat kaçta açılıyor?"],["We \u003cb>don't watch\u003c/b> TV in the morning.","Sabahları televizyon izlemeyiz."],["\u003cb>Does\u003c/b> it \u003cb>snow\u003c/b> in Bursa? — Yes, it \u003cb>does\u003c/b>. On Uludağ!","Bursa'ya kar yağar mı? — Evet, Uludağ'a!"]]},{"type":"trTrap","title":"The most common mistakes","titleTR":"En sık hatalar","rows":[{"tr":"O kahve sevmez.","wrong":"She don't like coffee.","right":"She doesn't like coffee."},{"tr":"O çay sever mi?","wrong":"Does she likes tea?","right":"Does she like tea?"},{"tr":"O çalışmıyor (hiç).","wrong":"He doesn't works.","right":"He doesn't work."},{"tr":"Bursa'da mı yaşıyorsunuz?","wrong":"Are you live in Bursa?","right":"Do you live in Bursa?"},{"tr":"Evet, severim.","wrong":"Yes, I like.","right":"Yes, I do."},{"tr":"Ben her gün çalışırım.","wrong":"I am work every day.","right":"I work every day."}]}]},{"id":"k8-practice","block":2,"step":8,"min":5,"mode":"Individual → class","material":"Ekran","kicker":"Step 8 · Kutu 8 · Practice","title":"Practice: Present Simple","titleTR":"Alıştırma: olumlu, olumsuz, soru — Present Simple","lead":"Write the verb in the correct form. Short forms are OK.","leadTR":"Fiili doğru biçimde yazın. Kısaltmalar kabul.","sections":[{"type":"gap","items":[{"q":"My husband ___ (get up) at six every day.","a":["gets up"],"why":"he → gets"},{"q":"We ___ (live) in a flat in Nilüfer.","a":["live"],"why":"we → yalın fiil"},{"q":"My daughter ___ (study) at university.","a":["studies"],"why":"sessiz + y → -ies"},{"q":"Ali ___ (watch) the news every evening.","a":["watches"],"why":"-ch → -es"},{"q":"My mother ___ (have) a small garden.","a":["has"],"why":"have → has"},{"q":"I ___ (not / drink) coffee at night.","a":["don't drink|do not drink"],"why":"I → don't"},{"q":"She ___ (not / eat) meat. She's a vegetarian.","a":["doesn't eat|does not eat"],"why":"she → doesn't + yalın fiil"},{"q":"___ you ___ (like) Turkish coffee?","a":["Do","like"],"why":"you → Do … like?"},{"q":"___ your son ___ (work) on Saturdays? — Yes, he ___.","a":["Does","work","does"],"why":"kısa cevap: Yes, he does"},{"q":"Where ___ your sister ___ (live)?","a":["does","live"],"why":"Where + does + özne + yalın fiil"},{"q":"The shops ___ (close) at nine.","a":["close"],"why":"they → yalın fiil"},{"q":"My grandson ___ (go) to school by bus.","a":["goes"],"why":"go → goes"}]}]},{"id":"k8-pron","block":2,"step":8,"min":5,"extra":true,"mode":"Pairs","material":"Ekran","kicker":"Step 8 · Extra","title":"/s/, /z/ or /ɪz/?","titleTR":"-s okunuşu: sınıflandırma","lead":"Say the verb aloud. Which sound do you hear at the end?","leadTR":"Fiili sesli söyleyin. Sonda hangi sesi duyuyorsunuz?","sections":[{"type":"sort","id":"ssort","buckets":["/s/ · works","/z/ · plays","/ɪz/ · watches"],"items":[["likes",0],["eats",0],["stops",0],["walks",0],["drinks",0],["lives",1],["goes",1],["reads",1],["cleans",1],["sings",1],["washes",2],["finishes",2],["dances",2],["relaxes",2],["teaches",2]]}]},{"id":"k8-reading","block":2,"step":8,"min":8,"extra":true,"mode":"Individual → class","material":"Ekran","kicker":"Step 8 · Extra","title":"Reading: A day in Hasan's life","titleTR":"Okuma: Hasan'ın bir günü — -s alan ve almayan fiiller","lead":"Read about Hasan. Tap the verbs: \u003cb>with -s\u003c/b> (he / she) or \u003cb>without -s\u003c/b> (I / we / they)?","leadTR":"Hasan'ı okuyun. Fiillere dokunun: -s alanlar (he / she) mı, almayanlar (I / we / they) mı?","sections":[{"type":"reading","id":"hasan","title":"A day in Hasan's life","byline":"Hasan Kaya, 61, retired · Kestel","marks":{"s":{"label":"+ s","tr":"he / she / it","cls":"m-teal"},"b":{"label":"no -s","tr":"I / we / they · don't / doesn't + fiil","cls":"m-coral"}},"columns":{"s":"+ s","b":"no -s"},"paragraphs":["Hasan is retired, but he is never bored. He {s|gets} up at half past six and he {s|goes} for a walk in the park. Then he and his wife Fatma {b|have} breakfast together. Fatma {s|makes} fresh tea and Hasan {s|buys} bread from the bakery.","In the morning Hasan {s|works} in his garden. He {s|grows} tomatoes and peppers. Fatma doesn't {b|like} gardening. She {s|reads} or she {s|visits} her sister. They {b|eat} lunch at one o'clock.","In the afternoon Hasan {s|plays} backgammon with his friends at the café. They {b|talk} about football and they {b|drink} a lot of tea! In the evening Hasan and Fatma {b|watch} TV. Hasan doesn't {b|watch} the news. He {s|says}: “I {b|want} a quiet life!”"],"questions":[{"q":"What time does Hasan get up?","a":"He gets up at half past six."},{"q":"Who makes tea?","a":"Fatma makes tea."},{"q":"What does Hasan grow?","a":"He grows tomatoes and peppers."},{"q":"Does Fatma like gardening?","a":"No, she doesn't."},{"q":"What do Hasan and his friends drink at the café?","a":"They drink a lot of tea."}],"rule":[{"q":"Why “Hasan gets” but “they eat”?","a":"he / she / it → fiil + s; we / they / I → yalın fiil."},{"q":"Why “doesn't like” and not “doesn't likes”?","a":"doesn't'ta -s var; fiil yalın kalır."}]}]},{"id":"k8-me","block":2,"step":8,"min":6,"extra":true,"mode":"Individual → pairs","material":"Ekran","kicker":"Step 8 · Extra","title":"True for you? Positive or negative","titleTR":"Sizin için doğru mu? Olumlu ya da olumsuz yazın","lead":"Make the sentences true for you or for your family. Use \u003cb>positive\u003c/b> or \u003cb>negative\u003c/b>.","leadTR":"Cümleleri kendinize veya ailenize göre doğru yapın: olumlu ya da olumsuz.","sections":[{"type":"prompts","cols":3,"rows":2,"items":[{"label":"coffee","task":"I … (drink) coffee in the morning.","ph":"I drink / I don't drink …","eg":"I don't drink coffee in the morning. I drink tea."},{"label":"TV","task":"My husband / wife … (watch) football on TV.","ph":"He watches / He doesn't watch …","eg":"My husband watches football every weekend."},{"label":"cooking","task":"I … (cook) every day.","ph":"I cook / I don't cook …","eg":"I cook every day. I love it."},{"label":"phone","task":"My children … (call) me every day.","ph":"They call / They don't call …","eg":"My children don't call me every day, but they send messages."},{"label":"sport","task":"I … (do) sport.","ph":"I do / I don't do …","eg":"I don't do sport, but I walk a lot."},{"label":"early","task":"My best friend … (get up) early.","ph":"She gets up / She doesn't get up …","eg":"My best friend gets up at five!"}]}]},{"id":"k8-game","block":2,"step":8,"min":8,"extra":true,"mode":"Two teams","material":"Ekran","kicker":"Step 8 · Extra","title":"Present Simple quiz: Bursa and Turkey","titleTR":"Present Simple bilgi yarışması: Bursa ve Türkiye","lead":"Answer the questions with a full sentence. Correct answer + correct grammar = 1 point!","leadTR":"Soruları tam cümleyle cevaplayın. Doğru bilgi + doğru dilbilgisi = 1 puan!","sections":[{"type":"teamGame","quiz":true,"label":"QUESTION","items":[{"w":"Which mountain do skiers love in Bursa?","r":"They love Uludağ.","why":"they → love"},{"w":"What does Bursa produce? (famous fruit)","r":"Bursa produces peaches and chestnuts.","why":"Bursa (it) → produces"},{"w":"Where does İskender kebab come from?","r":"It comes from Bursa.","why":"it → comes"},{"w":"How often does the World Cup happen?","r":"It happens every four years.","why":"it → happens"},{"w":"When does winter start in Turkey?","r":"It starts in December.","why":"it → starts"},{"w":"What does a cow give us?","r":"It gives us milk.","why":"it → gives"},{"w":"How many days does February have (usually)?","r":"It has twenty-eight days.","why":"have → has"},{"w":"What do people eat on Kurban Bayramı?","r":"They eat meat.","why":"they → eat"},{"w":"Where does the sun rise?","r":"It rises in the east.","why":"it → rises"},{"w":"What do bees make?","r":"They make honey.","why":"they → make"}]}]},{"id":"k9-rule","block":2,"step":9,"min":3,"mode":"Whole class","material":"Ekran · Kutu 9","kicker":"Step 9 · Kutu 9","title":"always · usually · often · sometimes · never","titleTR":"Sıklık zarfları, cümledeki yerleri ve zaman ifadeleri","lead":"Before the main verb: I \u003cb>always\u003c/b> drink tea. After \u003cb>be\u003c/b>: I'm \u003cb>never\u003c/b> late.","leadTR":"Ana fiilden önce: I always drink tea. be'den sonra: I'm never late.","sections":[{"type":"freqScale","items":[["always",100,"her zaman","I always drink tea for breakfast."],["usually",90,"genellikle","I usually get up at seven."],["often",70,"sık sık","We often visit our children."],["sometimes",50,"bazen","I sometimes go to the cinema."],["rarely",10,"nadiren","I rarely eat fast food."],["never",0,"asla, hiç","My husband never cooks!"]]},{"type":"rules","cols":3,"items":[{"tag":"Rule 1","h":"Before the main verb","tr":"Ana fiilden önce","ex":"She \u003cb>often\u003c/b> cooks fish. · They \u003cb>never\u003c/b> watch TV."},{"tag":"Rule 2","h":"After be","tr":"be'den (am / is / are) sonra","ex":"I'm \u003cb>always\u003c/b> happy here. · He's \u003cb>never\u003c/b> late."},{"tag":"Rule 3","h":"Questions: How often …?","tr":"Ne sıklıkla …?","ex":"\u003cb>How often\u003c/b> do you see her? — \u003cb>Once a week\u003c/b>."}]},{"type":"table","title":"Time expressions","titleTR":"Zaman ifadeleri (genelde cümle sonunda)","head":["Expression","Türkçe","Example"],"r 12","kicker":"Step 12 · Kutu 12 (1)","title":"Present Continuous: am / is / are + -ing","titleTR":"Şimdiki zaman: şu an ve bu aralar olanlar — yapı ve -ing yazımı","lead":"Look! It\u003cb>'s raining\u003c/b>. Shh! The baby \u003cb>is sleeping\u003c/b>. These days I\u003cb>'m learning\u003c/b> English.","leadTR":"Şu an olan (Look! Shh!) ve bu aralar süren (these days) eylemler için.","sections":[{"type":"explain","title":"Konu anlatımı","icon":"⏳","paras":["Present Continuous iki parçadır: \u003cb>am / is / are + fiil-ing\u003c/b>. be fiili Kutu 2'deki gibi özneye göre değişir; -ing'li fiil hiç değişmez: \u003ci>I'm cooking, she's cooking, they're cooking.\u003c/i>","Kullanım 1 — \u003cb>şu an, konuşma anında\u003c/b> olan eylem: now, right now, at the moment, Look!, Listen!, Shh! → \u003ci>Look! The bus is coming.\u003c/i>","Kullanım 2 — \u003cb>bu aralar\u003c/b> süren, geçici durum (tam şu an olmasa da): these days, this week, this month → \u003ci>I'm reading a good book these days. My son is staying with us this week.\u003c/i>","Olumsuz: be + \u003cb>not\u003c/b> (I'm not working) · Soru: be başa (\u003cb>Are\u003c/b> you working?) · Kısa cevap: Yes, I am. / No, she isn't."]},{"type":"formTable","rows":[{"sign":"+","ex":"I'\u003cb>m cooking\u003c/b>. · She'\u003cb>s watching\u003c/b> TV. · They'\u003cb>re playing\u003c/b> in the garden.","note":"be + fiil-ing"},{"sign":"−","ex":"I'\u003cb>m not working\u003c/b> today. · He \u003cb>isn't sleeping\u003c/b>. · We \u003cb>aren't listening\u003c/b>.","note":"be + not + fiil-ing"},{"sign":"?","ex":"\u003cb>Are\u003c/b> you \u003cb>listening\u003c/b>? · What \u003cb>is\u003c/b> she \u003cb>doing\u003c/b>? · Where \u003cb>are\u003c/b> you \u003cb>going\u003c/b>?","note":"be + özne + fiil-ing"},{"sign":"↩","ex":"Yes, I \u003cb>am\u003c/b>. / No, I'\u003cb>m not\u003c/b>. · Yes, she \u003cb>is\u003c/b>. / No, they \u003cb>aren't\u003c/b>.","note":"kısa cevap"}]},{"type":"spelling","title":"-ing spelling","titleTR":"-ing yazımı","items":[{"title":"Most verbs → + ing","rows":[["cook → cooking",""],["read → reading",""],["play → playing",""]]},{"title":"-e → -ing (e düşer)","rows":[["make → making",""],["write → writing",""],["drive → driving",""]]},{"title":"short verb: double","rows":[["sit → sitting","sessiz-sesli-sessiz"],["swim → swimming",""],["run → running · shop → shopping",""]]},{"title":"-ie → -ying","rows":[["lie → lying","uzanmak"],["die → dying",""],["tie → tying",""]]}]},{"type":"examples","items":[["Look! It'\u003cb>s snowing\u003c/b> on Uludağ!","Bak! Uludağ'a kar yağıyor!"],["Shh! Grandpa \u003cb>is sleeping\u003c/b>.","Şşş! Dede uyuyor."],["What \u003cb>are\u003c/b> you \u003cb>doing\u003c/b>? — I'\u003cb>m making\u003c/b> tea.","Ne yapıyorsun? — Çay demliyorum."],["My daughter \u003cb>is studying\u003c/b> for an exam this week.","Kızım bu hafta sınava çalışıyor."],["Sorry, I can't talk now. I'\u003cb>m driving\u003c/b>.","Kusura bakma, şimdi konuşamam, araba kullanıyorum."],["These days we'\u003cb>re learning\u003c/b> English and we'\u003cb>re enjoying\u003c/b> it!","Bu aralar İngilizce öğreniyoruz ve çok hoşumuza gidiyor!"]]}]},{"id":"k12-vs","block":3,"step":12,"min":2,"mode":"Whole class","material":"Ekran · Kutu 12","kicker":"Step 12 · Kutu 12 (2)","title":"Usually or now? The -yor trap","titleTR":"Present Simple mı Continuous mı? -yor tuzağı ve durum fiilleri","lead":"One question decides: \u003cb>always / usually\u003c/b> → Present Simple · \u003cb>now / these days\u003c/b> → Present Continuous.","leadTR":"Tek soru: her zaman mı, şu an / bu aralar mı?","sections":[{"type":"formCompare","left":{"name":"Present Simple","tr":"her zaman, genelde","rows":[["✓","I \u003cb>drink\u003c/b> tea every morning."],["✓","My husband \u003cb>works\u003c/b> in a factory."],["⏱","always, usually, often, sometimes, never, every day, on Mondays"]]},"right":{"name":"Present Continuous","tr":"şu an, bu aralar","rows":[["✓","Today I'\u003cb>m drinking\u003c/b> coffee."],["✓","This week he'\u003cb>s working\u003c/b> from home."],["⏱","now, right now, at the moment, today, this week, these days, Look! Listen!"]]}},{"type":"trTrap","title":"The -yor trap","titleTR":"-yor tuzağı","rows":[{"tr":"Her hafta markete gidiyorum.","wrong":"I'm going to the market every week.","right":"I go to the market every week."},{"tr":"Babam her sabah yürüyor.","wrong":"My father is walking every morning.","right":"My father walks every morning."},{"tr":"Seni anlıyorum.","wrong":"I'm understanding you.","right":"I understand you."},{"tr":"Şu an yemek pişiriyorum.","wrong":"I cook now.","right":"I'm cooking now."},{"tr":"Bu çayı çok seviyorum.","wrong":"I'm loving this tea.","right":"I love this tea."}]},{"type":"callout","tone":"tr","title":"State verbs: no -ing","titleTR":"Durum fiilleri","text":"\u003cb>like, love, hate, want, need, know, understand, remember, believe, have (sahip olmak)\u003c/b> → genelde Present Simple: \u003ci>I want a tea\u003c/i> (I'm wanting ✗) · \u003ci>Do you know him?\u003c/i> (Are you knowing ✗)"}]},{"id":"k12-practice","block":3,"step":12,"min":3,"mode":"Individual → class","material":"Ekran","kicker":"Step 12 · Kutu 12 · Practice","title":"Practice: Simple or Continuous?","titleTR":"Alıştırma: Present Simple mı, Present Continuous mı?","lead":"Choose the correct form. Look for the signal words!","leadTR":"Doğru biçimi seçin. İşaret kelimelerine bakın!","sections":[{"type":"choice","items":[{"q":"My grandson ___ football every Saturday.","o":["plays","is playing"],"a":0,"why":"every Saturday → alışkanlık"},{"q":"Be quiet, please. I ___ to the news.","o":["listen","'m listening"],"a":1,"why":"şu an"},{"q":"___ you like Turkish coffee?","o":["Do","Are"],"a":0,"why":"like → durum fiili"},{"q":"This month my daughter ___ with us.","o":["stays","is staying"],"a":1,"why":"this month → geçici"},{"q":"The shops in our village ___ at nine.","o":["open","are opening"],"a":0,"why":"program"},{"q":"Why ___ you ___ a coat? It's hot today!","o":["do … wear","are … wearing"],"a":1,"why":"şu an, bugün"},{"q":"I ___ what you mean.","o":["know","'m knowing"],"a":0,"why":"know → -ing almaz"},{"q":"Look! Your phone ___.","o":["rings","is ringing"],"a":1,"why":"Look! → şu an"},{"q":"She usually ___ the bus, but today she ___.","o":["takes / walks","takes / 's walking"],"a":1,"why":"usually / today"},{"q":"Where's Dad? — He ___ in the garden.","o":["works","'s working"],"a":1,"why":"şu an nerede, ne yapıyor"}]}]},{"id":"k12-pictures","block":3,"step":12,"min":6,"extra":true,"mode":"Whole class","material":"Ekran","kicker":"Step 12 · Extra","title":"What are they doing?","titleTR":"Ne yapıyorlar? Sahneleri anlatın","lead":"Look at the picture and the words. Say a full sentence in the Present Continuous.","leadTR":"Resim ve kelimelere bakın; Present Continuous ile tam cümle kurun.","sections":[{"type":"promptCards","small":true,"reveal":"Sentence","cards":[{"en":"👩‍🍳 Ayşe · cook · dolma","ans":"Ayşe is cooking dolma."},{"en":"👴📰 Grandpa · read · newspaper","ans":"Grandpa is reading the newspaper."},{"en":"👧👦⚽ the children · play · football","ans":"The children are playing football."},{"en":"🌧️ it · rain","ans":"It's raining."},{"en":"🚌 we · wait for · the bus","ans":"We're waiting for the bus."},{"en":"📞 Mehmet · talk · on the phone","ans":"Mehmet is talking on the phone."},{"en":"🧺 I · hang out · the washing","ans":"I'm hanging out the washing."},{"en":"🐈💤 the cat · sleep · on the sofa","ans":"The cat is sleeping on the sofa."},{"en":"☕ they · drink · tea · in the garden","ans":"They're drinking tea in the garden."}]}]},{"id":"k12-mime","block":3,"step":12,"min":8,"extra":true,"mode":"Whole class game","material":"Ekran","kicker":"Step 12 · Extra","title":"Mime game: What am I doing?","titleTR":"Pandomim: Ne yapıyorum?","lead":"Draw a card. Act it — no words! The class guesses: \u003cb>Are you …ing?\u003c/b>","leadTR":"Kart çekin ve konuşmadan canlandırın. Sınıf tahmin eder: Are you …ing?","sections":[{"type":"cardDraw","promptTitle":"Guess with a question","decks":[{"key":"mime","name":"Action cards","tr":"Eylem kartları","prompts":["Are you …ing?","Yes, I am! / No, I'm not.","Is she / he …ing?","She's / He's …ing!"],"cards":[{"en":"driving a bus","tr":"otobüs kullanmak"},{"en":"making Turkish coffee","tr":"Türk kahvesi yapmak"},{"en":"swimming in the sea","tr":"denizde yüzmek"},{"en":"brushing your teeth","tr":"dişlerini fırçalamak"},{"en":"reading a newspaper","tr":"gazete okumak"},{"en":"playing backgammon","tr":"tavla oynamak"},{"en":"taking a photo","tr":"fotoğraf çekmek"},{"en":"watering the flowers","tr":"çiçek sulamak"},{"en":"knitting a jumper","tr":"kazak örmek"},{"en":"waiting for a bus in the rain","tr":"yağmurda otobüs beklemek"},{"en":"dancing the halay","tr":"halay çekmek"},{"en":"fishing","tr":"balık tutmak"}]}]}]},{"id":"k12-phone","block":3,"step":12,"min":6,"extra":true,"mode":"Pairs","material":"Ekran","kicker":"Step 12 · Extra","title":"Phone call: Where are you? What are you doing?","titleTR":"Telefon konuşması: Neredesin? Ne yapıyorsun?","lead":"Listen and read. Then make your own phone call with a partner.","leadTR":"Dinleyin ve okuyun. Sonra partnerinizle kendi telefon konuşmanızı yapın.","sections":[{"type":"dialogue","title":"On the phone","lines":[["Selin","Hi Kemal! \u003cb>Where are you\u003c/b>? It's very noisy!"],["Kemal","Hi Selin! I'\u003cb>m standing\u003c/b> at the bus stop. A lot of cars \u003cb>are going\u003c/b> past."],["Selin","\u003cb>Are you coming\u003c/b> home now?"],["Kemal","Yes, I am. I'\u003cb>m waiting\u003c/b> for the 38. What \u003cb>are you doing\u003c/b>?"],["Selin","I'\u003cb>m cooking\u003c/b> dinner, and Zeynep \u003cb>is helping\u003c/b> me. She's making a salad."],["Kemal","Lovely! Oh, the bus \u003cb>is coming\u003c/b>. See you soon!"]],"find":[{"q":"Where is Kemal?","a":"He's at the bus stop."},{"q":"What is Selin doing?","a":"She's cooking dinner."},{"q":"Who is helping Selin?","a":"Zeynep is helping her."},{"q":"Why is it noisy?","a":"Because a lot of cars are going past."}]}]},{"id":"k13-rule","block":3,"step":13,"min":3,"mode":"Whole class","material":"Ekran · Kutu 13","kicker":"Step 13 · Kutu 13","title":"like + -ing · would like · imperatives","titleTR":"Sevmek ve istemek: like + -ing, would like, want to · emir cümleleri ve Let's","lead":"\u003cb>Do you like\u003c/b> tea? (in general) ≠ \u003cb>Would you like\u003c/b> a tea? (now — an offer)","leadTR":"Do you like …? genel olarak sever misin · Would you like …? şimdi ister misin (teklif).","sections":[{"type":"rules","cols":3,"items":[{"tag":"like / love / hate + -ing","h":"Sevdiğim / sevmediğim şeyler","tr":"fiil ise -ing alır","ex":"I \u003cb>love cooking\u003c/b>. I \u003cb>don't like driving\u003c/b>. She \u003cb>hates shopping\u003c/b>."},{"tag":"like + noun","h":"Sevdiğim şeyler (isim)","tr":"genel konuşurken tanımlık yok","ex":"I like \u003cb>tea\u003c/b>. Do you like \u003cb>cats\u003c/b>?"},{"tag":"would like","h":"Kibar istek / teklif","tr":"isterim / ister misiniz?","ex":"\u003cb>I'd like\u003c/b> a coffee, please. \u003cb>Would you like\u003c/b> some cake?"},{"tag":"would like to / want to","h":"Yapmak istediğim şey","tr":"+ to + yalın fiil","ex":"I'd like \u003cb>to visit\u003c/b> London. I want \u003cb>to learn\u003c/b> English."},{"tag":"Imperative","h":"Emir, talimat","tr":"fiille başlar · olumsuz: Don't","ex":"\u003cb>Open\u003c/b> your books. \u003cb>Don't\u003c/b> worry. Please \u003cb>sit\u003c/b> down."},{"tag":"Let's","h":"Öneri: …lim","tr":"Let's + yalın fiil","ex":"\u003cb>Let's\u003c/b> have a break! \u003cb>Let's not\u003c/b> wait."}]},{"type":"contrast","items":[{"a":"\u003cb>Do you like\u003c/b> tea? — Yes, I \u003cb>do\u003c/b>. I drink it every day.","b":"\u003cb>Would you like\u003c/b> a tea? — Yes, \u003cb>please\u003c/b>. / No, \u003cb>thank you\u003c/b>.","ans":"Soldaki: genel olarak sever misin? (Present Simple, cevap do / don't). Sağdaki: şimdi ister misin? (teklif; cevap Yes, please / No, thank you)."},{"a":"I \u003cb>like\u003c/b> swimming.","b":"I'\u003cb>d like\u003c/b> to swim.","ans":"Soldaki: yüzmeyi severim (genel). Sağdaki: (şimdi / bir gün) yüzmek isterim."}]},{"type":"examples","title":"Examples","titleTR":"Örnekler","items":[["I \u003cb>love walking\u003c/b> by the sea.","Deniz kenarında yürümeye bayılırım."],["My husband \u003cb>hates shopping\u003c/b>.","Eşim alışverişten nefret eder."],["\u003cb>Do you like\u003c/b> gardening? — Yes, I \u003cb>do\u003c/b>. I grow tomatoes.","Bahçe işini sever misin? — Evet, domates yetiştiririm."],["\u003cb>Would you like\u003c/b> a cup of tea? — Yes, \u003cb>please\u003c/b>.","Bir fincan çay ister misiniz? — Evet, lütfen."],["\u003cb>I'd like\u003c/b> a kilo of apples, please.","Bir kilo elma istiyorum, lütfen."],["\u003cb>I'd like to visit\u003c/b> my son in Germany.","Almanya'daki oğlumu ziyaret etmek isterim."],["Please \u003cb>sit\u003c/b> down. \u003cb>Don't\u003c/b> worry!","Lütfen oturun. Merak etmeyin!"],["It's late. \u003cb>Let's go\u003c/b> home.","Geç oldu. Hadi eve gidelim."]]}]},{"id":"k13-practice","block":3,"step":13,"min":3,"mode":"Individual → class","material":"Ekran","kicker":"Step 13 · Kutu 13 · Practice","title":"Practice: like, would like, imperatives","titleTR":"Alıştırma: like + -ing, would like, emir cümleleri","lead":"Choose the correct answer.","leadTR":"Doğru cevabı seçin.","sections":[{"type":"choice","items":[{"q":"I love ___ in the garden.","o":["work","working","works"],"a":1,"why":"love + -ing"},{"q":"My husband doesn't like ___.","o":["shopping","shop","to shopping"],"a":0,"why":"like + -ing"},{"q":"___ some more tea? — Yes, please.","o":["Do you like","Would you like","You like"],"a":1,"why":"teklif → Would you like"},{"q":"Do you like fish? — ___","o":["Yes, please.","Yes, I do.","Yes, I would."],"a":1,"why":"Do …? → Yes, I do"},{"q":"I'd like ___ Cappadocia one day.","o":["visit","visiting","to visit"],"a":2,"why":"would like + to + fiil"},{"q":"___ touch that! It' "a / an · -s · many · How many?","c":0,"items":["an egg → eggs","a tomato → tomatoes","an apple → apples","a potato → potatoes","a lemon → lemons","a bottle → bottles","a friend → friends","a lira → lira"]},{"name":"Uncountable · sayılamaz","sub":"no a / an · no -s · much · How much?","c":1,"items":["water · milk · tea · coffee","bread · cheese · butter · meat","rice · sugar · salt · flour","money · time · information","fruit · food · furniture · hair"]}]},{"type":"table","title":"Containers and quantities","titleTR":"Kaplar ve ölçüler","head":["English","Türkçe","Example"],"rows":[["a bottle of …","bir şişe","a bottle of water / olive oil"],["a glass of …","bir bardak (cam)","a glass of milk"],["a cup of …","bir fincan","a cup of coffee"],["a loaf of …","bir somun","two loaves of bread"],["a kilo of …","bir kilo","a kilo of tomatoes / rice"],["a piece of …","bir parça","a piece of cake / cheese"],["a packet of …","bir paket","a packet of biscuits / tea"],["a jar of …","bir kavanoz","a jar of honey / jam"]]},{"type":"rules","cols":4,"items":[{"tag":"+","h":"some · a lot of","tr":"biraz / birkaç · çok","ex":"There's \u003cb>some\u003c/b> cheese. I've got \u003cb>a lot of\u003c/b> eggs."},{"tag":"−","h":"any · much · many","tr":"hiç · çok","ex":"There isn't \u003cb>any\u003c/b> milk. I haven't got \u003cb>much\u003c/b> time."},{"tag":"?","h":"any · How much / many","tr":"hiç … var mı? · ne kadar / kaç?","ex":"Are there \u003cb>any\u003c/b> eggs? \u003cb>How many\u003c/b> do you need?"},{"tag":"Offer","h":"some in offers","tr":"teklif ve ricada some","ex":"Would you like \u003cb>some\u003c/b> tea? Can I have \u003cb>some\u003c/b> water?"}]},{"type":"examples","title":"Examples","titleTR":"Örnekler","items":[["There's \u003cb>some\u003c/b> cheese, but there isn't \u003cb>any\u003c/b> bread.","Biraz peynir var ama hiç ekmek yok."],["Have you got \u003cb>any\u003c/b> eggs? — Yes, I've got \u003cb>a lot of\u003c/b> eggs.","Hiç yumurtan var mı? — Evet, bir sürü."],["\u003cb>How many\u003c/b> tomatoes do you need? — Six.","Kaç domates lazım? — Altı."],["\u003cb>How much\u003c/b> rice do we need? — Two kilos.","Ne kadar pirinç lazım? — İki kilo."],["I don't drink \u003cb>much\u003c/b> coffee.","Çok kahve içmem."],["We haven't got \u003cb>many\u003c/b> friends in İstanbul.","İstanbul'da çok arkadaşımız yok."],["Would you like \u003cb>some\u003c/b> more tea?","Biraz daha çay ister misiniz?"],["\u003cb>How much\u003c/b> are the peaches? — Forty lira a kilo.","Şeftaliler kaç para? — Kilosu kırk lira."]]}]},{"id":"k14-practice","block":3,"step":14,"min":4,"mode":"Individual → class","material":"Ekran","kicker":"Step 14 · Kutu 14 · Practice","title":"Practice: some, any, much, many","titleTR":"Alıştırma: miktar ifadeleri","lead":"Complete with \u003cb>some, any, much, many, a lot of, How much\u003c/b> or \u003cb>How many\u003c/b>.","leadTR":"some, any, much, many, a lot of, How much ya da How many ile tamamlayın.","sections":[{"type":"gap","bank":["some","any","much","many","a lot of","How much","How many"],"items":[{"q":"There are ___ eggs in the fridge. (olumlu)","a":["some|a lot of"],"why":"olumlu çoğul → some"},{"q":"We haven't got ___ bread. Can you buy some?","a":["any"],"why":"olumsuz → any"},{"q":"___ sugar do you want in your tea?","a":["How much"],"why":"sugar sayılamaz → How much"},{"q":"___ grandchildren have you got?","a":["How many"],"why":"sayılabilir → How many"},{"q":"I don't have ___ time today. Sorry!","a":["much"],"why":"time sayılamaz + olumsuz → much"},{"q":"There aren't ___ tomatoes at the market this week.","a":["many|any"],"why":"sayılabilir + olumsuz → many / any"},{"q":"Would you like ___ cake?","a":["some"],"why":"teklif → some"},{"q":"My husband drinks ___ tea — ten glasses a day!","a":["a lot of"],"why":"olumlu → a lot of"},{"q":"___ is this bag? — It's 450 lira.","a":["How much"],"why":"fiyat → How much"},{"q":"Are there ___ good restaurants near here?","a":["any"],"why":"soru → any"}]}]},{"id":"k14-sort","block t":"nine fifteen"},{"h":9,"m":45,"say":"It's quarter to ten.","alt":"nine forty-five"},{"h":9,"m":10,"say":"It's ten past nine.","alt":"nine ten"},{"h":9,"m":40,"say":"It's twenty to ten.","alt":"nine forty"},{"h":3,"m":5,"say":"It's five past three.","alt":"three oh five"},{"h":7,"m":55,"say":"It's five to eight.","alt":"seven fifty-five"}]}]},{"id":"k15-prep","block":3,"step":15,"min":2,"short":true,"mode":"Whole class","material":"Ekran · Kutu 15","kicker":"Step 15 · Kutu 15 (2)","title":"in · on · at for time","titleTR":"Zaman edatları: ters üçgen kuralı ve istisnalar","lead":"The upside-down triangle: \u003cb>in\u003c/b> (big) → \u003cb>on\u003c/b> (middle) → \u003cb>at\u003c/b> (small, exact).","leadTR":"Ters üçgen: en geniş zaman in, orta on, en dar nokta at.","sections":[{"type":"triangle"},{"type":"table","title":"Exceptions","titleTR":"İstisnalar ve edatsız ifadeler","head":["✓ Correct","✗ Wrong","Why?"],"rows":[["\u003cb>at\u003c/b> night","in the night","kalıp"],["\u003cb>at\u003c/b> the weekend","in the weekend","kalıp (İngiliz İngilizcesi)"],["\u003cb>on\u003c/b> Monday morning","in Monday morning","gün + gün bölümü → on"],["\u003cb>—\u003c/b> next Friday","on next Friday","next / last / this / every → edat yok"],["\u003cb>—\u003c/b> tomorrow · yesterday · today","on tomorrow","edat yok"],["\u003cb>—\u003c/b> every day","in every day","edat yok"]]},{"type":"examples","title":"Examples","titleTR":"Örnekler","items":[["I get up \u003cb>at\u003c/b> seven o'clock.","Saat yedide kalkarım."],["I was born \u003cb>in\u003c/b> March, \u003cb>in\u003c/b> 1965.","1965'te, martta doğdum."],["My birthday is \u003cb>on\u003c/b> the third of May.","Doğum günüm 3 Mayıs'ta."],["The market is \u003cb>on\u003c/b> Tuesdays.","Pazar salı günleri kurulur."],["I go for a walk \u003cb>in\u003c/b> the morning.","Sabahları yürüyüşe çıkarım."],["I can't sleep \u003cb>at\u003c/b> night.","Geceleri uyuyamıyorum."],["What do you do \u003cb>at\u003c/b> the weekend?","Hafta sonu ne yaparsınız?"],["See you \u003cb>—\u003c/b> next week!","Haftaya görüşürüz! (edat yok)"]]}]},{"id":"k15-practice","block":3,"step":15,"min":2,"short":true,"mode":"Individual → class","material":"Ekran","kicker":"Step 15 · Kutu 15 · Practice","title":"Practice: in, on, at or nothing?","titleTR":"Alıştırma: in, on, at ya da edat yok (—)","lead":"Choose the correct answer.","leadTR":"Doğru cevabı seçin.","sections":[{"type":"mcq","options":["in","on","at","—"],"items":[{"q":"I was born ___ 1968.","a":0,"why":"yıl → in"},{"q":"The lesson starts ___ half past nine.","a":2,"why":"saat → at"},{"q":"My birthday is ___ the fifth of May.","a":1,"why":"tarih → on"},{"q":"We go to the seaside ___ summer.","a":0,"why":"mevsim → in"},{"q":"I can't sleep ___ night.","a":2,"why":"at night"},{"q":"The market is ___ Saturdays.","a":1,"why":"günler → on"},{"q":"See you ___ next week!","a":3,"why":"next → edat yok"},{"q":"I always read ___ the evening.","a":0,"why":"gün bölümü → in the evening"},{"q":"What do you do ___ the weekend?","a":2,"why":"at the weekend"},{"q":"Let's meet ___ tomorrow.","a":3,"why":"tomorrow → edat yok"}]}]},{"id":"k15-clockquiz","block":3,"step":15,"min":5,"extra":true,"mode":"Whole class","material":"Ekran","kicker":"Step 15 · Extra","title":"Clock quiz","titleTR":"Saat testi: dijital rakam yok — saati siz söyleyin","lead":"Look at the clock. Say the time in two ways. Then check.","leadTR":"Saate bakın, iki şekilde söyleyin, sonra kontrol edin.","sections":[{"type":"clocks","noDigital":true,"btn":"Kontrol","items":[{"h":7,"m":30,"say":"It's half past seven.","alt":"seven thirty"},{"h":11,"m":15,"say":"It's quarter past eleven.","alt":"eleven fifteen"},{"h":4,"m":45,"say":"It's quarter to five.","alt":"four forty-five"},{"h":2,"m":20,"say":"It's twenty past two.","alt":"two twenty"},{"h":6,"m":50,"say":"It's ten to seven.","alt":"six fifty"},{"h":12,"m":0,"say":"It's twelve o'clock.","alt":"midday / midnight"},{"h":8,"m":25,"say":"It's twenty-five past eight.","alt":"eight twenty-five"},{"h":10,"m":35,"say":"It's twenty-five to eleven.","alt":"ten thirty-five"}]}]},{"id":"k15-times","block":3,"step":15,"min":6,"extra":true,"mode":"Pairs","material":"Ekran","kicker":"Step 15 · Extra","title":"What time do you …?","titleTR":"Saat kaçta …? Saat + rutin konuşması","lead":"Ask your partner. Answer with \u003cb>at\u003c/b> + time.","leadTR":"Partnerinize sorun; at + saat ile cevap verin.","sections":[{"type":"inputTable","head":["What time do you …?","Me","My partner"],"ph":["at …","at …"],"rows":[{"topic":"get up","tr":"kalkmak"},{"topic":"have breakfast","tr":"kahvaltı"},{"topic":"have lunch","tr":"öğle yemeği"},{"topic":"drink your afternoon tea","tr":"ikindi çayı"},{"topic":"have dinner","tr":"akşam yemeği"},{"topic":"go to bed","tr":"yatmak"}],"note":"Soru: What time do you get up? · Cevap: At seven. / At half past six. / I usually get up at …"}]},{"id":"k16-was","block":3,"step":16,"min":3,"mode":"Whole class","material":"Ekran · Kutu 16","kicker":"Step 16 · Kutu 16 (1)","title":"was / were","titleTR":"be fiilinin geçmişi: -dim, -di, -ydi · there was / there were · I was born","lead":"am / is → \u003cb>was\u003c/b> · are → \u003cb>were\u003c/b>. Yesterday I \u003cb>was\u003c/b> at home. My children \u003cb>were\u003c/b> at school.","leadTR":"am / is → was, are → were. Dün evdeydim; çocuklarım okuldaydı.","sections":[{"type":"explain","title":"Konu anlatımı","icon":"⏪","paras":["Kutu 2'deki be fiilinin geçmiş hâli: \u003cb>am / is → was\u003c/b> · \u003cb>are → were\u003c/b>. Türkçedeki “evdeydim, yorgundu, oradaydık” cümleleri bununla kurulur.","Olumsuz: \u003cb>wasn't / weren't\u003c/b> · Soru: was / were başa (\u003ci>\u003cb>Were\u003c/b> you tired?\u003c/i>) · Kısa cevap: \u003ci>Yes, I was. / No, they weren't.\u003c/i> Tıpkı am / is / are gibi; did gerekmez.","Geçmişte bir yerde bir şey vardı: \u003cb>There was\u003c/b> (tekil) / \u003cb>There were\u003c/b> (çoğul): \u003ci>There was a cinema here.\u003c/i> · Doğum: \u003cb>I was born\u003c/b> in 1970 / in Bursa.","Geçmiş zaman ifadeleri: \u003cb>yesterday\u003c/b> (dün), \u003cb>last\u003c/b> night / week / year (geçen …), \u003cb>… ago\u003c/b> (… önce: two days ago), \u003cb>in\u003c/b> 1990, \u003cb>when I was\u003c/b> young (gençken)."]},{"type":"persons","rows":[["I","I \u003cb>was\u003c/b> at home yesterday.",true,"evdeydim"],["he / she / it","She \u003cb>was\u003c/b> tired. It \u003cb>was\u003c/b> cold.",true,"yorgundu · soğuktu"],["you","You \u003cb>were\u003c/b> late!",false,"geç kaldın"],["we","We \u003cb>were\u003c/b> in Mudanya last summer.",false,"Mudanya'daydık"],["they","They \u003cb>were\u003c/b> very happy.",false,"çok mutluydular"]]},{"type":"formTable","rows":[{"sign":"+","ex":"I \u003cb>was\u003c/b> at the market. · They \u003cb>were\u003c/b> at work.","note":"was / were"},{"sign":"−","ex":"It \u003cb>wasn't\u003c/b> expensive. · We \u003cb>weren't\u003c/b> at home.","note":"wasn't / weren't"},{"sign":"?","ex":"\u003cb>Were\u003c/b> you tired? · Where \u003cb>was\u003c/b> he? · \u003cb>Was\u003c/b> it good?","note":"was / were başa"},{"sign":"↩","ex":"Yes, I \u003cb>was\u003c/b>. / No, it \u003cb>wasn't\u003c/b>.","note":"kısa cevap"},{"sign":"★","ex":"I \u003cb>was born\u003c/b> in 1966 in İnegöl. · \u003cb>There was\u003c/b> a cinema here. \u003cb>There were\u003c/b> a lot of trees.","note":"kalıplar"}]},{"type":"examples","title":"Examples","titleTR":"Örnekler","items":[["I \u003cb>was\u003c/b> at the doctor's yesterday.","Dün doktordaydım."],["The weather \u003cb>was\u003c/b> lovely last weekend.","Geçen hafta sonu hava çok güzeldi."],["We \u003cb>were\u003c/b> in Ayvalık last summer.","Geçen yaz Ayvalık'taydık."],["\u003cb>Were\u003c/b> you at home last night? — No, I \u003cb>wasn't\u003c/b>. I \u003cb>was\u003c/b> at my sister's.","Dün akşam evde miydin? — Hayır, kız kardeşimdeydim."],["Where \u003cb>were\u003c/b> you born? — I \u003cb>was\u003c/b> born in İnegöl.","Nerede doğdunuz? — İnegöl'de."],["\u003cb>There was\u003c/b> a cinema in our street, but now there's a bank.","Sokağımızda bir sinema vardı, şimdi banka var."],["My parents \u003cb>were\u003c/b> farmers.","Annemle babam çiftçiydi."],["It \u003cb>wasn't\u003c/b> expensive.","Pahalı değildi."]]}]},{"id":"k16-past","block":3,"step":16,"min":3,"mode":"Whole class","material":"Ekran · Kutu 16","kicker":"Step 16 · Kutu 16 (2)","title":"Past Simple: worked, went, didn't go","titleTR":"Geçmiş zaman: düzenli (-ed) ve düzensiz fiiller, did / didn't","lead":"Regular: \u003cb>work → worked\u003c/b>. Irregular: \u003cb>go → went\u003c/b>. Negative and question: \u003cb>did\u003c/b> + base verb.","leadTR":"Düzenli fiil -ed alır, düzensiz fiil ezberlenir. Olumsuz ve soruda did + yalın fiil.","sections":[{"type":"explain","title":"Konu anlatımı","icon":"📜","paras":["Past Simple geçmişte \u003cb>bitmiş\u003c/b> olayları anlatır: \u003ci>I visited my aunt yesterday.\u003c/i> Tüm şahıslarda \u003cb>aynı\u003c/b> biçim: I worked, she worked, they worked (he / she için ek yok!).","\u003cb>Düzenli fiiller\u003c/b> -ed alır: work → worked, live → lived (-e → -d), study → studied (sessiz + y → -ied), stop → stopped (çift harf). Okunuş: /t/ worked, /d/ lived, /ɪd/ wanted (t / d ile bitenler).","\u003cb>Düzensiz fiiller\u003c/b> ezberlenir: go → went, see → saw, buy → bought … Aşağıdaki 20 fiil günlük konuşmanın çoğunu karşılar.","Olumsuz: \u003cb>didn't + yalın fiil\u003c/b> (I didn't go) · Soru: \u003cb>Did + özne + yalın fiil\u003c/b> (Did you go?) · Kısa cevap: \u003ci>Yes, I did. / No, I didn't.\u003c/i>"]},{"type":"table","title":"20 irregular verbs","titleTR":"En sık 20 düzensiz fiil","head":["Verb","Past","Türkçe","Verb","Past","Türkçe"],"firstBold":false,"rows":[["go","\u003cb>went\u003c/b>","gitmek","have","\u003cb>had\u003c/b>","sahip olmak, yemek"],["do","\u003cb>did\u003c/b>","yapmak","make","\u003cb>made\u003c/b>","yapmak"],["see","\u003cb>saw\u003c/b>","görmek","come","\u003cb>came\u003c/b>","gelmek"],["get","\u003cb>got\u003c/b>","almak, olmak","take","\u003cb>took\u003c/b>","almak, götürmek"],["buy","\u003cb>bought\u003c/b>","satın almak","eat","\u003cb>ate\u003c/b>","yemek"],["drink","\u003cb>drank\u003c/b>","içmek","meet","\u003cb>met\u003c/b>","buluşmak, tanışmak"],["say","\u003cb>said\u003c/b>","söylemek","give","\u003cb>gave\u003c/b>","vermek"],["write","\u003cb>wrote\u003c/b>","yazmak","read","\u003cb>read\u003c/b> (/red/)","okumak"],["sleep","\u003cb>slept\u003c/b>","uyumak","leave","\u003cb>left\u003c/b>","ayrılmak"],["know","\u003cb>knew\u003c/b>","bilmek","think","\u003cb>thought\u003c/b>","düşünmek"]]},{"type":"formTable","rows":[{"sign":"+","ex":"I \u003cb>visited\u003c/b> my aunt. · We \u003cb>went\u003c/b> to Mudanya.","note":"fiilin 2. hâli"},{"sign":"−","ex":"I \u003cb>didn't visit\u003c/b> her. · We \u003cb>didn't go\u003c/b>.","note":"didn't + yalın fiil"},{"sign":"?","ex":"\u003cb>Did\u003c/b> you \u003cb>visit\u003c/b> her? · Where \u003cb>did\u003c/b> you \u003cb>go\u003c/b>?","note":"did + özne + yalın fiil"},{"sign":"↩","ex":"Yes, I \u003cb>did\u003c/b>. / No, I \u003cb>didn't\u003c/b>.","note":"kısa cevap"}]},{"type":"examples","title":"Examples","titleTR":"Örnekler","items":[["I \u003cb>visited\u003c/b> my aunt yesterday.","Dün teyzemi ziyaret ettim."],["We \u003cb>watched\u003c/b> a film last night.","Dün akşam film izledik."],["My daughter \u003cb>called\u003c/b> me two hours ago.","Kızım iki saat önce beni aradı."],["I \u003cb>went\u003c/b> to the bazaar and \u003cb>bought\u003c/b> some peaches.","Pazara gittim ve biraz şeftali aldım."],["We \u003cb>had\u003c/b> breakfast in the garden.","Bahçede kahvaltı yaptık."],["I \u003cb>didn't sleep\u003c/b> well last night.","Dün gece iyi uyuyamadım."],["\u003cb>Did\u003c/b> you \u003cb>see\u003c/b> the match? — Yes, I \u003cb>did\u003c/b>!","Maçı gördün mü? — Evet!"],["What \u003cb>did\u003c/b> you \u003cb>do\u003c/b> at the weekend?","Hafta sonu ne yaptın?"]]},{"type":"trTrap","rows":[{"tr":"Dün pazara gittim.","wrong":"I goed to the bazaar yesterday. / I go …","right":"I went to the bazaar yesterday."},{"tr":"Onu görmedim.","wrong":"I didn't saw him.","right":"I didn't see him."},{"tr":"Dün evde miydin?","wrong":"Did you be at home yesterday?","right":"Were you at home yesterday?"},{"tr":"1970'te doğdum.","wrong":"I born in 1970.","right":"I was born in 1970."}]}]},{"id":"k16-practice","block":3,"step":16,"min":3,"mode":"Individual → class","material":"Ekran","kicker":"Step 16 · Kutu 16 · Practice","title":"Practice: was, were, went, didn't …","titleTR":"Alıştırma: was / were ve Past Simple","lead":"Write the correct past form. Short forms are OK.","leadTR":"Doğru geçmiş biçimini yazın. Kısaltmalar kabul.","sections":[{"type":"gap","items":[{"q":"I ___ (be) at my sister's house yesterday.","a":["was"],"why":"I → was"},{"q":"The children ___ (be) very tired last night.","a":["were"],"why":"they → were"},{"q":"We ___ (go) to Uludağ last winter.","a":["went"],"why":"go → went"},{"q":"My husband ___ (cook) dinner on Sunday.","a":["cooked"],"why":"düzenli → -ed"},{"q":"I ___ (buy) a new coat last week.","a":["bought"],"why":"buy → bought"},{"q":"She ___ (not / come) to the lesson on Monday.","a":["didn't come|did not come"],"why":"didn't + yalın fiil"},{"q":"___ (be) you at home at nine? — Yes, I ___.","a":["Were","was"],"why":"be → Were you …? (did yok)"},{"q":"___ you ___ (see) the match? — No, I ___.","a":["Did","see","didn't|did not"],"why":"Did + özne + yalın fiil"},{"q":"Where ___ you ___ (go) on holiday?","a":["did","go"],"why":"Where + did + özne + yalın fiil"},{"q":"I ___ (be) born in 1969 in Gemlik.","a":["was"],"why":"I was born"}]}]},{"id":"k16-irregular","block":3,"step":16,"min":5,"extra":true,"mode":"Whole class","material":"Ekran","kicker":"Step 16 · Extra","title":"Irregular verb cards","titleTR":"Düzensiz fiil kartları: söyleyin, çevirin","lead":"Say the past form. Then turn the card.","leadTR":"Geçmiş hâlini söyleyin, sonra kartı çevirin.","sections":[{"type":"flip","listen":true,"items":[["go","went"],["have","had"],["do","did"],["see","saw"],["come","came"],["get","got"],["make","made"],["take","took"],["buy","bought"],["eat","ate"],["drink","drank"],["meet","met"],["say","said"],["give","gave"],["write","wrote"],["read","read \u003csmall>/red/\u003c/small>"],["sleep","slept"],["leave","left"],["know","knew"],["think","thought"],["find","found"],["sit","sat"],["swim","swam"],["speak","spoke"]]}]},{"id":"k16-reading","block":3,"step":16,"min":8,"extra":true,"mode":"Individual → class","material":"Ekran","kicker":"Step 16 · Extra","title":"Reading: Ayşe's Sunday","titleTR":"Okuma: Ayşe'nin pazar günü — düzenli ve düzensiz fiiller","lead":"Read the story. Tap the past verbs: \u003cb>regular\u003c/b> (-ed) or \u003cb>irregular\u003c/b>?","leadTR":"Hikâyeyi okuyun. Geçmiş zaman fiillerine dokunun: düzenli mi, düzensiz mi?","sections":[{"type":"reading","id":"ayse","title":"Ayşe's Sunday","byline":"A short story · Past Simple","marks":{"r":{"label":"Regular","tr":"düzenli · -ed","cls":"m-teal"},"i":{"label":"Irregular","tr":"düzensiz","cls":"m-coral"}},"columns":{"r":"Regular","i":"Irregular"},"paragraphs":["Last Sunday Ayşe {i|got} up at eight. She {r|opened} the window and {r|looked} at the sky. It {i|was} a beautiful day.","After breakfast she {i|went} to the market in Setbaşı. She {i|bought} tomatoes, peppers and some fresh bread. On the way home she {r|stopped} at her sister's house and they {i|drank} tea together.","In the afternoon her grandchildren {r|visited} her. They {r|played} in the garden and she {i|made} a big apple cake. Everybody {i|ate} two pieces! In the evening Ayşe {r|watched} a film, but she {i|slept} before the end. She didn't {r|finish} it — but it {i|was} a lovely Sunday."],"questions":[{"q":"What time did Ayşe get up?","a":"She got up at eight."},{"q":"Where did she go after breakfast?","a":"She went to the market in Setbaşı."},{"q":"What did she buy?","a":"Tomatoes, peppers and some fresh bread."},{"q":"What did she make?","a":"She made a big apple cake."},{"q":"Did she finish the film?","a":"No, she didn't. She slept before the end."}]}]},{"id":"k16-talk","block":3,"step":16,"min":7,"extra":true,"mode":"Pairs → class","material":"Ekran","kicker":"Step 16 · Extra","title":"Tell me about last weekend","titleTR":"Geçen hafta sonunuzu anlatın","lead":"Tell your partner about last weekend. Your partner asks two questions.","leadTR":"Partnerinize geçen hafta sonunuzu anlatın; partneriniz iki soru sorsun.","sections":[{"type":"frames","items":["On Saturday morning I …","In the afternoon we …","In the evening I …","On Sunday I didn't … because …","It was really nice / boring / tiring."]},{"type":"chips","title":"Questions for your partner","titleTR":"Partnerinize sorular","items":["Where did you go?","Who did you see?","What did you eat?","Did you enjoy it?","What time did you get home?","Was it expensive?","How was the weather?"]},{"type":"modelHidden","title":"Teacher's model","text":"On Saturday morning I \u003cb>cleaned\u003c/b> the house and \u003cb>went\u003c/b> to the market. In the afternoon my daughter \u003cb>came\u003c/b> with the children. We \u003cb>made\u003c/b> pizza together. On Sunday I \u003cb>didn't get up\u003c/b> early. It \u003cb>was\u003c/b> a lovely, quiet weekend."}]},{"id":"k16-listen","block":3,"step":16,"min":6,"extra":true,"mode":"Individual","material":"Ekran","kicker":"Step 16 · Extra","title":"Dictation: past sentences","titleTR":"Dikte: geçmiş zaman cümleleri","lead":"Listen and write the sentence. Press 🐢 to hear it slowly.","leadTR":"Dinleyin ve cümleyi yazın. Yavaş dinlemek için 🐢.","sections":[{"type":"listen","items":[{"text":"I was at home yesterday.","hint":"was"},{"text":"We went to the seaside last summer.","hint":"went"},{"text":"I didn't see my friends.","hint":"olumsuz"},{"text":"Did you buy any bread?","hint":"soru"},{"text":"She was born in Bursa.","hint":"born"},{"text":"They stayed at a small hotel.","hint":"düzenli fiil"}]}]},{"id":"mixed","block":3,"step":17,"min":8,"mode":"Individual → class","material":"Ekran / kâğıt","kicker":"Step 17 · Mixed review","title":"Mixed review: 20 questions","titleTR":"Karma tekrar: 16 kutu bir arada — doğru yapıyı siz seçin","lead":"All the boxes together. Read carefully: which structure do you need?","leadTR":"Bütün kutular bir arada. Dikkatle okuyun: hangi yapı gerekiyor?","sections":[{"type":"choice","items":[{"q":"___ your brother live in Bursa? — No, he lives in İzmir.","o":["Is","Does","Do"],"a":1,"why":"Present Simple sorusu, he → Does · Kutu 8, 10"},{"q":"My mother ___ seventy-five years old.","o":["has","is","have"],"a":1,"why":"yaş → be · Kutu 2"},{"q":"There ___ a lot of people at the market yesterday.","o":["was","were","are"],"a":1,"why":"geçmiş + çoğul → there were · Kutu 7, 16"},{"q":"I ___ cook, but my husband ___ — he's a great cook!","o":["can't / can","don't can / can","can't / cans"],"a":0,"why":"can / can't değişmez · Kutu 11"},{"q":"Look! The children ___ in the snow.","o":["play","are playing","plays"],"a":1,"why":"Look! → şu an · Kutu 12"},{"q":"What ___ your daughter ___? — She's a nurse.","o":["is / do","does / do","do / does"],"a":1,"why":"meslek sorusu: What does she do? · Kutu 10"},{"q":"We haven't got ___ milk. Can you buy some?","o":["some","any","many"],"a":1,"why":"olumsuz → any · Kutu 14"},{"q":"This is Selin and this is ___ husband, Kemal.","o":["his","her","their"],"a":1,"why":"Selin (kadın) → her · Kutu 3"},{"q":"I usually go to bed ___ eleven o'clock.","o":["in","on","at"],"a":2,"why":"saat → at · Kutu 15"},{"q":"My son ___ two children.","o":["have got","has got","is having"],"a":1,"why":"he → has got · Kutu 6"},{"q":"___ you like a glass of water? — Yes, please.","o":["Do","Would","Are"],"a":1,"why":"teklif → Would you like · Kutu 13"},{"q":"She ___ to the cinema last night.","o":["go","goes","went"],"a":2,"why":"last night → went · Kutu 16"},{"q":"My father was ___ farmer.","o":["a","an","—"],"a":0,"why":"meslek → a · Kutu 4"},{"q":"How ___ apples do you want? — Six, please.","o":["much","many","lot"],"a":1,"why":"apples sayılabilir → How many · Kutu 14"},{"q":"___ shoes are too small for me. (elimdekiler)","o":["This","These","That"],"a":1,"why":"yakın + çoğul → these · Kutu 5"},{"q":"He ___ coffee in the evening.","o":["doesn't drink","don't drink","doesn't drinks"],"a":0,"why":"he → doesn't + yalın fiil · Kutu 8"},{"q":"I ___ late for work.","o":["am never","never am","never"],"a":0,"why":"sıklık zarfı be'den sonra · Kutu 9"},{"q":"___ a bank near here? — Yes, opposite the mosque.","o":["Are there","Is there","Has it"],"a":1,"why":"tekil soru → Is there · Kutu 7"},{"q":"Where ___ you born? — In Gemlik.","o":["did","was","were"],"a":2,"why":"you → were born · Kutu 16"},{"q":"My grandchildren love ___ in the sea.","o":["swim","swimming","swims"],"a":1,"why":"love + -ing · Kutu 13"}]},{"type":"prompts","title":"Your own sentences","titleTR":"Serbest üretim: kendi cümleleriniz","cols":2,"rows":2,"items":[{"label":"21 · A question","task":"Write a question for your teacher. Use do / does, can or was / were.","tr":"Öğretmeninize bir soru yazın.","ph":"Where do you …?","eg":"What do you usually do at the weekend?"},{"label":"22 · Yesterday","task":"Write two sentences about yesterday: one positive, one negative.","tr":"Dün hakkında bir olumlu, bir olumsuz cümle.","ph":"Yesterday I … I didn't …","eg":"Yesterday I visited my sister. I didn't watch TV."}]},{"type":"callout","tone":"info","title":"Wrong answer? Go back to the box","titleTR":"Yanlış mı? Kutuya dönün","text":"Her cevabın altında kutu numarası var. Kutuların tek sayfalık özeti ve tanı tablosu kaynaklarda.","go":[["cheatsheet","Kutu 1–16 özet"],["diagnosis","Tanı tablosu"]]}]},{"id":"mixed-fix","block":3,"step":17,"min":8,"extra":true,"mode":"Individual → class","material":"Ekran","kicker":"Step 17 · Extra","title":"Correct the mistakes: 12 sentences","titleTR":"Hataları düzeltin: karma 12 cümle","lead":"Every sentence has one mistake. Write the correct sentence. Which box is it?","leadTR":"Her cümlede bir hata var. Doğrusunu yazın. Hangi kutu?","sections":[{"type":"fix","items":[{"w":"My wife have got a new car.","r":["My wife has got a new car.","My wife's got a new car."],"why":"she → has got · Kutu 6"},{"w":"Do you can help me?","r":["Can you help me?"],"why":"Can + özne · Kutu 11"},{"w":"There are a lot of traffic in Bursa.","r":["There is a lot of traffic in Bursa.","There's a lot of traffic in Bursa."],"why":"traffic sayılamaz → there is · Kutu 7, 14"},{"w":"I didn't went to work yesterday.","r":["I didn't go to work yesterday.","I did not go to work yesterday."],"why":"didn't + yalın fiil · Kutu 16"},{"w":"He is work in a hospital.","r":["He works in a hospital."],"why":"Present Simple'da is yok · Kutu 8"},{"w":"What time you get up?","r":["What time do you get up?"],"why":"soru sırası: do · Kutu 10"},{"w":"Mehmet and her wife are retired.","r":["Mehmet and his wife are retired."],"why":"Mehmet → his · Kutu 3"},{"w":"I'm 61 years old and I am live in Gemlik.","r":["I'm 61 years old and I live in Gemlik.","I am 61 years old and I live in Gemlik."],"why":"live fiil; am gereksiz · Kutu 2, 8"},{"w":"She is a engineer.","r":["She is an engineer.","She's an engineer."],"why":"e sesi → an · Kutu 4"},{"w":"I would like visit Paris.","r":["I would like to visit Paris.","I'd like to visit Paris."],"why":"would like + to · Kutu 13"},{"w":"We were at home in Sunday.","r":["We were at home on Sunday."],"why":"gün → on · Kutu 15"},{"w":"Where you were yesterday?","r":["Where were you yesterday?"],"why":"be soruda başa · Kutu 16"}]}]},{"id":"mixed-write","block":3,"step":17,"min":12,"extra":true,"mode":"Individual","material":"Ekran / defter","kicker":"Step 17 · Extra","title":"Write: About me","titleTR":"Yazma: Kendimi tanıtıyorum — tüm A1 yapıları tek metinde","lead":"Write 60–100 words about yourself. Try to use structures from many boxes.","leadTR":"Kendiniz hakkında 60–100 kelime yazın. Olabildiğince çok kutudan yapı kullanın.","sections":[{"type":"rules","title":"Linking words","titleTR":"Bağlaçlar: cümleleri birleştirin","cols":4,"items":[{"tag":"and","h":"ve","tr":"ekleme","ex":"I've got a son \u003cb>and\u003c/b> a daughter."},{"tag":"but","h":"ama","tr":"zıtlık","ex":"I can cook, \u003cb>but\u003c/b> I can't bake."},{"tag":"because","h":"çünkü","tr":"neden","ex":"I'm learning English \u003cb>because\u003c/b> I love travelling."},{"tag":"so","h":"bu yüzden","tr":"sonuç","ex":"It was cold, \u003cb>so\u003c/b> we stayed at home."}]},{"type":"modelHidden","title":"Model text","text":"My name \u003cb>is\u003c/b> Nilay and I\u003cb>'m\u003c/b> 56. I\u003cb>'m\u003c/b> from Gemlik, but I \u003cb>live\u003c/b> in Nilüfer now. I\u003cb>'ve got\u003c/b> two daughters and one grandson. \u003cb>There's\u003c/b> a lovely park near my house, \u003cb>so\u003c/b> I usually \u003cb>walk\u003c/b> there in the morning. I \u003cb>can\u003c/b> cook very well, but I \u003cb>can't\u003c/b> drive. I \u003cb>love\u003c/b> reading \u003cb>and\u003c/b> I\u003cb>'d like to\u003c/b> visit London one day. These days I\u003cb>'m learning\u003c/b> English \u003cb>because\u003c/b> I want to talk to people when I travel. Last summer we \u003cb>went\u003c/b> to Ayvalık. It \u003cb>was\u003c/b> wonderful!"},{"type":"writer","title":"Write here","titleTR":"Buraya yazın","target":[60,100],"ph":"My name is … and I'm …","checks":[{"label":"\u003cb>be\u003c/b> (I'm / I am / is / are)","re":"\\b(I'm|I’m|I am|is|are)\\b"},{"label":"\u003cb>have got\u003c/b> / has got / have","re":"\\b(have got|has got|'ve got|’ve got|'s got|’s got|I have)\\b"},{"label":"\u003cb>there is / there are\u003c/b>","re":"\\bthere('s|’s| is| are)\\b"},{"label":"\u003cb>can / can't\u003c/b>","re":"\\b(can|can't|can’t|cannot)\\b"},{"label":"A \u003cb>frequency adverb\u003c/b> (usually, often …)","re":"\\b(always|usually|often|sometimes|rarely|never)\\b"},{"label":"\u003cb>Present Continuous\u003c/b> (I'm …ing)","re":"\\b(am|is|are|'m|’m|'re|’re|'s|’s)\\s+\\w{2,}ing\\b"},{"label":"\u003cb>Past\u003c/b> (was, were, went, …ed)","re":"\\b(was|were|went|had|saw|did|made|bought|came|\\w{3,}ed)\\b"},{"label":"A linking word (and, but, because, so)","re":"\\b(but|because|so)\\b"}]}]},{"id":"close-feedback","block":3,"step":18,"min":2,"mode":"Whole class","material":"Ekran","kicker":"Step 18 · Feedback","title":"Which box was the most difficult?","titleTR":"Hangi kutu en zordu? Oylama ve kişisel geri bildirim","lead":"Tap one or two boxes. We'll spend five minutes on the winner next lesson!","leadTR":"Bir ya da iki kutuya dokunun. Kazanan kutuya bir sonraki derste 5 dakika ayıracağız!","sections":[{"type":"poll","options":["1 · Alphabet & numbers","2 · be","3 · my / his / her","4 · a / an / the, plurals","5 · this / that, adjectives","6 · have got","7 · there is / are","8 · Present Simple","9 · always / never","10 · Questions","11 · can","12 · Present Continuous","13 · like / would like","14 · some / any / much / many","15 · Time, in / on / at","16 · was / were, Past Simple"]},{"type":"frames","title":"Feedback language","titleTR":"Geri bildirim kalıpları","items":["Well done! Your … is very good.","Let's work on Kutu … .","Be careful with … (he / she + s, his / her …).","Thank you for your hard work today!"]},{"type":"callout","tone":"info","title":"Diagnosis grid","titleTR":"Tanı tablosu","text":"Isınmadaki ve karma tekrardaki yanlışlar öğrenci bazında burada.","go":[["diagnosis","Tanı tablosunu aç"]]}]},{"id":"close-hw","block":3,"step":18,"min":2,"mode":"Individual","material":"Ekran","kicker":"Step 18 · Homework","title":"Homework","titleTR":"Ödev: zor kutular, yazma ve 20 düzensiz fiil","lead":"Three small tasks. This file works at home without the internet!","leadTR":"Üç küçük görev. Bu dosya evde internetsiz de çalışır!","sections":[{"type":"steps","items":[{"en":"Open your difficult box (Kutu …) and do the practice screens again.","tr":"Zorlandığınız kutuyu açın ve alıştırmaları evde yeniden yapın."},{"en":"Write 60–100 words: About me (Step 17 · Extra). Use and, but, because, so.","tr":"“About me” metnini yazın (60–100 kelime)."},{"en":"Learn the 20 irregular verbs in Kutu 16.","tr":"Kutu 16'daki 20 düzensiz fiili ezberleyin."},{"en":"Optional: read the one-page summary (Kutu 1–16) before the next lesson.","tr":"İsteğe bağlı: tek sayfalık özeti okuyun."}]},{"type":"callout","tone":"tr","title":"Useful pages for home","titleTR":"Evde işe yarayacak sayfalar","text":"Tek sayfalık özet, büyük dilbilgisi haritası, düzensiz fiiller ve aranabilir kelime bankası.","go":[["handbook","A1 handbook"],["cheatsheet","Kutu 1–16 özet"],["grammarmap","A1 grammar map"],["irregular","Irregular verbs"],["vocab","Başvuru bankası"]]}]},{"id":"close-cando","block":3,"step":18,"min":5,"extra":true,"mode":"Individual","material":"Ekran","kicker":"Step 18 · Extra","title":"Can-do checklist","titleTR":"Yapabiliyorum listesi: kendinizi değerlendirin","lead":"Be honest! \u003cb>Not yet\u003c/b> is OK — it shows what to practise.","leadTR":"Dürüst olun! “Henüz değil” sorun değil; neye çalışacağınızı gösterir.","sections":[{"type":"checklist","items":[{"en":"I can spell my name and say numbers, dates and prices. (Kutu 1)","tr":"Adımı heceler; sayı, tarih ve fiyat söylerim."},{"en":"I can introduce myself with be: name, age, job, hometown. (Kutu 2)","tr":"be ile kendimi tanıtırım."},{"en":"I can use my, your, his, her, our, their and 's correctly. (Kutu 3)","tr":"İyelik sıfatlarını ve 's'yi doğru kullanırım."},{"en":"I can use a / an / the and irregular plurals. (Kutu 4)","tr":"a / an / the ve düzensiz çoğulları kullanırım."},{"en":"I can use this / these / that / those and adjectives. (Kutu 5)","tr":"this / these … ve sıfatları kullanırım."},{"en":"I can talk about my family and things with have got. (Kutu 6)","tr":"have got ile ailemi ve eşyalarımı anlatırım."},{"en":"I can describe my home and street with there is / are. (Kutu 7)","tr":"there is / are ile evimi ve sokağımı anlatırım."},{"en":"I can talk about my routine — and I remember he / she + s! (Kutu 8)","tr":"Rutinimi anlatırım; he / she + s'yi unutmam."},{"en":"I can say how often I do things. (Kutu 9)","tr":"Ne sıklıkla yaptığımı söylerim."},{"en":"I can ask questions in the correct order. (Kutu 10)","tr":"Doğru sırayla soru sorarım."},{"en":"I can talk about my abilities and ask for permission. (Kutu 11)","tr":"Yeteneklerimi anlatır, izin isterim."},{"en":"I can say what is happening now. (Kutu 12)","tr":"Şu an olanı anlatırım."},{"en":"I can say what I like and order politely: I'd like … (Kutu 13)","tr":"Sevdiklerimi söyler, kibarca sipariş veririm."},{"en":"I can shop and ask How much? / How many? (Kutu 14)","tr":"Alışverişte miktar ve fiyat sorarım."},{"en":"I can tell the time and use in / on / at. (Kutu 15)","tr":"Saati söyler, in / on / at kullanırım."},{"en":"I can say where I was and what I did yesterday. (Kutu 16)","tr":"Dün nerede olduğumu ve ne yaptığımı anlatırım."}]}]},{"id":"cheatsheet","block":0,"min":0,"kicker":"Resource","title":"Kutu 1–16 summary","titleTR":"Konu özetleri: on altı kutu tek sayfada","lead":"The main rules of each box. Print it (⎙) or come back here when a student makes a mistake.","leadTR":"Her kutunun ana kuralları. Yazdırın (⎙) ya da öğrenci hata yaptığında bu sayfaya dönün.","sections":[{"type":"callout","tone":"tr","title":"Need the full explanation?","titleTR":"Ayrıntılı anlatım","text":"Her kutunun bütün konu anlatımı, tabloları, tuzakları ve örnekleri “A1 handbook” sayfasında tek yerde.","go":[["handbook","A1 handbook"],["grammarmap","A1 grammar map"]]},{"type":"boxes","items":[{"tag":"1","h":"Alphabet, numbers, dates","tr":"Alfabe, sayılar, tarih","go":"k1-alphabet","points":["A /eɪ/ · E /iː/ · I /aɪ/ · G /dʒiː/ · J /dʒeɪ/ · R /ɑː/ · Y /waɪ/","13 thirTEEN ↔ 30 THIRty · 40 = forty","first, second, third, fifth, ninth, twelfth","the ninth of October · on 9 October · in October"]},{"tag":"2","h":"be: am / is / are","tr":"-im, -sin, -dir","go":"k2-rule","points":["I'm · he / she / it's · you / we / they're","− I'm not · isn't · aren't · ? Are you …?","Yes, I am. (Yes, I'm ✗)","I'm 52 · I'm hungry · I agree (I'm agree ✗)"]},{"tag":"3","h":"Possessives","tr":"my, his, her, 's","go":"k3-rule","points":["my · your · \u003cb>his\u003c/b> (erkeğin) · \u003cb>her\u003c/b> (kadının) · its · our · their","Ayşe and \u003cb>her\u003c/b> husband · Ali and \u003cb>his\u003c/b> wife","Hasan's car · my parents' house · Whose …?","me · you · him · her · it · us · them (Call me!)"]},{"tag":"4","h":"a / an / the · plurals","tr":"Tanımlıklar ve çoğullar","go":"k4-articles","points":["a book · an apple · an hour · a university","I'm \u003cb>a\u003c/b> nurse (meslekte a / an şart)","the: bilinen, tek · genel: I like cats.","bus → buses · city → cities · knife → knives · child → children · person → people"]},{"tag":"5","h":"this / that · adjectives","tr":"Bu, şu · sıfatlar","go":"k5-this-adj","points":["this / these (yakın) · that / those (uzak)","a red car · The car is red.","Sıfat -s almaz: red cars, happy people","an old house · a very big garden"]},{"tag":"6","h":"have got","tr":"Sahiplik: … var","go":"k6-rule","points":["I've got · she's got (has got)","− haven't got · hasn't got · ? Have you got …?","or: I have · Do you have …? (karıştırmayın)","aile, eşya, görünüş, hastalık: I've got a cold."]},{"tag":"7","h":"there is / there are","tr":"Bir yerde var / yok","go":"k7-rule","points":["There's a bakery in my street. (My street has ✗)","There are some … · There aren't any …","Is there a …? · Are there any …?","in · on · under · next to · between · behind · in front of · opposite"]},{"tag":"8","h":"Present Simple","tr":"Geniş zaman","go":"k8-rule","points":["I work · \u003cb>he works\u003c/b> · she watches · he studies · she has","− don't / doesn't + yalın fiil","? Do / Does + özne + yalın fiil","I am work ✗ · She doesn't works ✗"]},{"tag":"9","h":"Frequency","tr":"Sıklık","g
