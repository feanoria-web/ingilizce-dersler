/ would like, miktar, saat ve in / on / at, was / were, Past Simple, karma tekrar","minutes":50,"goal":"Şu an olanı ve alışkanlığı ayırır; istek ve tercih bildirir; alışverişte miktar sorar; saat söyler; geçmişi anlatmaya başlar."}],"outcomes":["Harfleri, sayıları, tarihleri ve saati İngilizce söyler; adını ve soyadını heceler","Kendini ve başkalarını be, have got ve iyelik sıfatlarıyla tanıtır (his / her farkını bilir)","Evini, odasını ve mahallesini there is / there are ve yer edatlarıyla anlatır","Günlük rutinini ve alışkanlıklarını Present Simple ve sıklık zarflarıyla anlatır; he / she / it ekini unutmaz","Doğru kelime sırasıyla soru sorar (Where do you live? · What does she do?)","Yeteneklerini can / can't ile anlatır; izin ve rica eder","Şu an olanları Present Continuous ile anlatır; -yor tuzağına düşmez","Sevdiği şeyleri, isteklerini ve tekliflerini (like, would like) ifade eder","Alışverişte miktar sorar ve söyler (some / any, How much / How many)","Geçmişle ilgili basit cümleler kurar (was / were, went, did)"],"grammarTargets":[["Alfabe, sayılar, sıra sayıları, tarih","Kutu 1","A · E · I · G · J · R · Y · W; -teen / -ty; the third of May"],["be: am / is / are, özne zamirleri","Kutu 2","I'm 52 (I have 52 years ✗) · I agree (I'm agree ✗)"],["Possessives: my / his / her …, 's, whose, me / him / her","Kutu 3","Ayşe and her husband · Ali and his wife"],["a / an / the, çoğul isimler","Kutu 4","I'm a nurse · an hour · children, people, women"],["this / that / these / those, sıfatlar","Kutu 5","these shoes · red cars · an old house"],["have got / has got (have)","Kutu 6","She's got two sons · Have you got …?"],["there is / there are, yer edatları","Kutu 7","There's a bakery in my street (… has a bakery ✗)"],["Present Simple","Kutu 8","he / she / it + -s · don't / doesn't · Do / Does …?"],["Sıklık zarfları ve zaman ifadeleri","Kutu 9","I always get up … · I'm never late"],["Soru kelimeleri ve soru sırası","Kutu 10","Where do you live? (Where you live? ✗)"],["can / can't","Kutu 11","She can swim (cans / can swims / can to ✗)"],["Present Continuous","Kutu 12","Look! It's raining · -yor tuzağı"],["like + -ing, would like, want to, emir cümleleri, Let's","Kutu 13","I like cooking · Would you like a tea?"],["Sayılabilir / sayılamaz, some / any, much / many","Kutu 14","How much money? · How many eggs?"],["Saat, in / on / at","Kutu 15","half past nine · at 9 · on Monday · in May"],["was / were, Past Simple (A1 sonu)","Kutu 16","I was born in … · I went · Did you go?"]],"smallClass":[],"screens":[{"id":"checkup","block":1,"step":1,"min":10,"mode":"Individual → class","material":"Ekran / tahta","kicker":"Step 1 · Warm-up","title":"A1 check-up: 16 questions","titleTR":"A1 kontrolü: her kutudan bir soru","lead":"Sixteen quick questions — one from each box. \u003cb>This is not an exam.\u003c/b> It shows us what we need to review today.","leadTR":"On altı kısa soru, her kutudan bir tane. Bu bir sınav değil; bugün neyi tekrar edeceğimizi gösterir.","sections":[{"type":"choice","title":"Choose the correct answer","titleTR":"Doğru cevabı seçin","items":[{"q":"My birthday is on the ___ of May.","o":["three","third","thirth"],"a":1,"why":"Tarihte sıra sayısı: the third (3rd) · Kutu 1"},{"q":"My grandchildren ___ at school now.","o":["is","am","are"],"a":2,"why":"Çoğul (they) → are · Kutu 2"},{"q":"Ali loves ___ wife very much.","o":["her","his","its"],"a":1,"why":"Ali erkek → his (onun) · Kutu 3"},{"q":"My son is ___ engineer.","o":["a","an","—"],"a":1,"why":"Sesli sesle başlayan kelime → an; meslekte a / an şart · Kutu 4"},{"q":"Look at ___ birds in the sky!","o":["this","these","those"],"a":2,"why":"Çoğul + uzakta → those · Kutu 5"},{"q":"My sister ___ two sons.","o":["have got","has got","is got"],"a":1,"why":"she → has got · Kutu 6"},{"q":"___ two banks in our street.","o":["There is","There are","It has"],"a":1,"why":"“var” + çoğul → There are · Kutu 7"},{"q":"My husband ___ in a factory.","o":["work","works","is work"],"a":1,"why":"he → fiil + s · Kutu 8"},{"q":"I ___ late for my lessons.","o":["never am","am never","never"],"a":1,"why":"Sıklık zarfı be'den sonra: I am never late · Kutu 9"},{"q":"Where ___ your daughter live?","o":["do","does","is"],"a":1,"why":"Soru: Where + does + she + yalın fiil · Kutu 10"},{"q":"She can ___ very well.","o":["swim","swims","to swim"],"a":0,"why":"can + yalın fiil (-s yok, to yok) · Kutu 11"},{"q":"Shh! The baby ___.","o":["sleeps","is sleeping","sleep"],"a":1,"why":"Shh! → şu an oluyor · Kutu 12"},{"q":"___ a cup of tea? — Yes, please.","o":["Do you like","Would you like","Are you like"],"a":1,"why":"Teklif: Would you like …? (ister misiniz?) · Kutu 13"},{"q":"How ___ sugar do you want in your tea?","o":["many","much","lot"],"a":1,"why":"sugar sayılamaz → How much · Kutu 14"},{"q":"The lesson starts ___ ten o'clock ___ Monday.","o":["at / on","in / at","on / in"],"a":0,"why":"saat → at · gün → on · Kutu 15"},{"q":"Where ___ you yesterday? — I ___ at home.","o":["were / was","was / were","did / was"],"a":0,"why":"you → were · I → was · Kutu 16"}]}]},{"id":"checkup-game","block":1,"step":1,"min":10,"extra":true,"mode":"Two teams","material":"Ekran","kicker":"Step 1 · Extra","title":"Mistake hunt: 20 sentences","titleTR":"Hata avı: takım oyunu (her kutudan tipik hatalar)","lead":"Read the sentence. Find the mistake. The first team to say the correct sentence gets a point.","leadTR":"Cümleyi okuyun, hatayı bulun. Doğru cümleyi ilk söyleyen takım puan alır.","sections":[{"type":"teamGame","items":[{"w":"I am 52 years.","r":"I'm 52. / I'm 52 years old.","why":"Yaş: be + sayı (+ years old) · Kutu 2"},{"w":"She is teacher.","r":"She's a teacher.","why":"Meslekte a / an şart · Kutu 4"},{"w":"He have got a red car.","r":"He has got a red car.","why":"he → has got · Kutu 6"},{"w":"My father work in Gemlik.","r":"My father works in Gemlik.","why":"he → fiil + s · Kutu 8"},{"w":"Where you live?","r":"Where do you live?","why":"Soruda yardımcı fiil: do · Kutu 10"},{"w":"There is three chairs in the room.","r":"There are three chairs in the room.","why":"çoğul → There are · Kutu 7"},{"w":"She can speaks English.","r":"She can speak English.","why":"can + yalın fiil · Kutu 11"},{"w":"I'm agree with you.","r":"I agree with you.","why":"agree bir fiil; önüne am gelmez · Kutu 2"},{"w":"Ayşe and his husband live in Kestel.","r":"Ayşe and her husband live in Kestel.","why":"Ayşe kadın → her · Kutu 3"},{"w":"I am go to work every day.","r":"I go to work every day.","why":"Present Simple'da am yok · Kutu 8"},{"w":"Look! It rains.","r":"Look! It's raining.","why":"Look! → şu an → Present Continuous · Kutu 12"},{"w":"I like swim.","r":"I like swimming.","why":"like + fiil-ing · Kutu 13"},{"w":"How many money have you got?","r":"How much money have you got?","why":"money sayılamaz → much · Kutu 14"},{"w":"See you in Friday!","r":"See you on Friday!","why":"günler → on · Kutu 15"},{"w":"I go to Antalya last summer.","r":"I went to Antalya last summer.","why":"last summer → geçmiş: went · Kutu 16"},{"w":"Did you went to the bazaar?","r":"Did you go to the bazaar?","why":"did + yalın fiil · Kutu 16"},{"w":"This shoes are new.","r":"These shoes are new.","why":"çoğul → these · Kutu 5"},{"w":"They are very goods students.","r":"They are very good students.","why":"sıfat çoğul olmaz · Kutu 5"},{"w":"I have two childs.","r":"I have two children.","why":"düzensiz çoğul: child → children · Kutu 4"},{"w":"He always is happy.","r":"He is always happy.","why":"sıklık zarfı be'den sonra · Kutu 9"}]}]},{"id":"k1-alphabet","block":1,"step":2,"min":4,"mode":"Whole class","material":"Ekran · Kutu 1","kicker":"Step 2 · Kutu 1 (1)","title":"The alphabet: letters that sound different","titleTR":"Alfabe: Türkçeden farklı okunan harfler ve heceleme","lead":"26 letters. Some sound very different from Turkish. Letters in the same group \u003cb>rhyme\u003c/b>.","leadTR":"26 harf. Bazıları Türkçeden çok farklı okunur. Aynı gruptaki harfler kafiyelidir.","sections":[{"type":"explain","title":"Konu anlatımı","icon":"🔤","paras":["İngiliz alfabesinde \u003cb>26 harf\u003c/b> var. Türkçede olmayan üç harf: \u003cb>Q, W, X\u003c/b>. Türkçeye özgü \u003cb>ç, ğ, ı, ö, ş, ü\u003c/b> İngilizcede yoktur.","Harflerin adları Türkçeden farklıdır. Aşağıda harfler \u003cb>sesine göre\u003c/b> gruplanmıştır: aynı gruptakiler kafiyelidir (A–H–J–K hepsi “ey” sesiyle biter). Bu grupları bilen kişi heceleneni kolayca yazar.","Heceleme (spelling) günlük hayatta çok lazım: otel, hastane, banka, telefonda isim söyleme. Kalıp: \u003ci>How do you spell that? — It's B-U-R-S-A.\u003c/i> Yan yana iki aynı harf: \u003ci>double\u003c/i> (Hello: H-E-\u003cb>double L\u003c/b>-O)."]},{"type":"sayTiles","title":"Seven sound groups","titleTR":"Yedi ses grubu","groups":[{"label":"/eɪ/","sub":"like “day” · ey","items":[["A","A","ey"],["H","H","eyç"],["J","J","cey"],["K","K","key"]]},{"label":"/iː/","sub":"like “see” · i","items":[["B","B","bi"],["C","C","si"],["D","D","di"],["E","E","i"],["G","G","ci"],["P","P","pi"],["T","T","ti"],["V","V","vi"]]},{"label":"/e/","sub":"like “ten” · e","items":[["F","F","ef"],["L","L","el"],["M","M","em"],["N","N","en"],["S","S","es"],["X","X","eks"],["Z","zed","zed"]]},{"label":"/aɪ/","sub":"like “my” · ay","items":[["I","I","ay"],["Y","Y","way"]]},{"label":"/əʊ/ · /uː/ · /ɑː/","sub":"no · you · car","items":[["O","O","ou"],["Q","Q","kyu"],["U","U","yu"],["W","W","dabılyu"],["R","R","aa(r)"]]}],"note":"Kutucuğa dokunun: bilgisayar harfi İngilizce okur. Z İngiliz İngilizcesinde “zed”, Amerikan İngilizcesinde “zee”dir."},{"type":"table","title":"Spelling Turkish names","titleTR":"Türkçe harfleri hecelemek","head":["Harf","İngilizce söyleyin","Örnek"],"rows":[["Ö / Ü","O with two dots · U with two dots","Öztürk: O with two dots – Z – T – U with two dots – R – K"],["Ş / Ç","S with a tail · C with a tail","Şahin: S with a tail – A – H – I – N"],["Ğ","soft G (G with a hat)","Doğan: D – O – soft G – A – N"],["I / İ","I without a dot · I with a dot","Işık: I without a dot – S with a tail – I without a dot – K"],["LL · SS","double L · double S","Hello: H – E – double L – O"]],"note":"İsimlerde ilk harf büyük: \u003ci>capital letter\u003c/i>; küçük harf: \u003ci>small letter\u003c/i>."},{"type":"promptCards","title":"Ask and answer","titleTR":"Sorun ve cevaplayın","small":true,"reveal":"Model","cards":[{"en":"How do you spell your surname?","tr":"Soyadınızı nasıl hecelersiniz?","ans":"It's Ö-Z-T-Ü-R-K."},{"en":"How do you spell “Mudanya”?","tr":"Mudanya'yı heceleyin.","ans":"M-U-D-A-N-Y-A"},{"en":"Can you spell that again, please?","tr":"Tekrar heceler misiniz?","ans":"Sure. It's …"}]}]},{"id":"k1-numbers","block":1,"step":2,"min":3,"mode":"Whole class","material":"Ekran · Kutu 1","kicker":"Step 2 · Kutu 1 (2)","title":"Numbers: -teen or -ty?","titleTR":"Sayılar: 13–19 ve 20–90 farkı, büyük sayılar, telefon ve yıllar","lead":"\u003cb>thirTEEN\u003c/b> (13) or \u003cb>THIRty\u003c/b> (30)? Listen to the stress.","leadTR":"13 mü 30 mu? Vurguyu dinleyin: -teen'de vurgu sonda, -ty'de başta.","sections":[{"type":"explain","title":"Konu anlatımı","icon":"🔢","paras":["\u003cb>1–12\u003c/b> ezberlenir: one, two, three, four, five, six, seven, eight, nine, ten, eleven, twelve.","\u003cb>13–19\u003c/b> sonuna \u003cb>-teen\u003c/b> alır ve vurgu sondadır: thir\u003cb>TEEN\u003c/b>, four\u003cb>TEEN\u003c/b>, fif\u003cb>TEEN\u003c/b>. \u003cb>20–90\u003c/b> sonuna \u003cb>-ty\u003c/b> alır ve vurgu baştadır: \u003cb>TWEN\u003c/b>ty, \u003cb>THIR\u003c/b>ty, \u003cb>FOR\u003c/b>ty, \u003cb>FIF\u003c/b>ty. 21–99 arası tireyle yazılır: twenty-one, forty-five.","\u003cb>100\u003c/b> = a / one hundred · \u003cb>101\u003c/b> = a hundred \u003cb>and\u003c/b> one (İngiliz İngilizcesinde “and” söylenir) · \u003cb>1,000\u003c/b> = a thousand · \u003cb>1,000,000\u003c/b> = a million. hundred / thousand / million sayıdan sonra \u003cb>-s almaz\u003c/b>: two hundred (two hundreds ✗). İngilizcede binlik ayıracı virgül, ondalık ayıracı noktadır: 2,500 · 2.5.","\u003cb>Yıllar\u003c/b> ikişer ikişer okunur: 1974 = nineteen seventy-four · 2026 = twenty twenty-six · 2005 = two thousand and five. \u003cb>Telefon\u003c/b> rakam rakam: 0532 = oh five three two; 77 = double seven. \u003cb>Fiyat\u003c/b>: 45.50 TL = forty-five lira fifty."]},{"type":"sayTiles","title":"Tap and listen","titleTR":"Dokunun ve dinleyin","groups":[{"label":"1–12","sub":"learn by heart","items":[["1","one","one"],["2","two","two"],["3","three","three"],["4","four","four"],["5","five","five"],["6","six","six"],["7","seven","seven"],["8","eight","eight"],["9","nine","nine"],["10","ten","ten"],["11","eleven","eleven"],["12","twelve","twelve"]]},{"label":"13–19 · -TEEN","sub":"stress at the end","items":[["13","thirteen","thirteen"],["14","fourteen","fourteen"],["15","fifteen","fifteen"],["16","sixteen","sixteen"],["17","seventeen","seventeen"],["18","eighteen","eighteen"],["19","nineteen","nineteen"]]},{"label":"20–100 · -TY","sub":"stress at the start","items":[["20","twenty","twenty"],["30","thirty","thirty"],["40","forty","forty"],["50","fifty","fifty"],["60","sixty","sixty"],["70","seventy","seventy"],["80","eighty","eighty"],["90","ninety","ninety"],["100","a hundred","a hundred"]]},{"label":"Big numbers","sub":"years · prices","wide":true,"items":[["21","twenty-one","twenty-one"],["45","forty-five","forty-five"],["101","a hundred and one","a hundred and one"],["250","two hundred and fifty","two hundred and fifty"],["1,000","a thousand","a thousand"],["3,500","three thousand five hundred","three thousand five hundred"],["1974","nineteen seventy-four","year"],["2026","twenty twenty-six","year"],["1,000,000","a million","a million"]]}]},{"type":"trTrap","title":"Watch out","titleTR":"Dikkat: en sık hatalar","rows":[{"tr":"40","wrong":"fourty","right":"forty"},{"tr":"200","wrong":"two hundreds","right":"two hundred"},{"tr":"1985 (yıl)","wrong":"one thousand nine hundred eighty-five","right":"nineteen eighty-five"},{"tr":"Telefon: 0 / 55","wrong":"zero / fifty-five","right":"oh / double five"},{"tr":"52 yaşındayım.","wrong":"I have 52 years.","right":"I'm 52. / I'm 52 years old."}]}]},{"id":"k1-listen","block":1,"step":2,"min":5,"extra":true,"mode":"Individual","material":"Ekran","kicker":"Step 2 · Extra","title":"Listening: which number?","titleTR":"Dinleme: hangi sayıyı duydunuz?","lead":"Press 🔊. Listen to the stress. Choose the number you hear.","leadTR":"🔊 düğmesine basın, vurguyu dinleyin ve duyduğunuz sayıyı seçin.","sections":[{"type":"choice","items":[{"q":"\u003cbutton class=\"say-btn\" data-say=\"thirteen\" title=\"Dinle\" aria-label=\"Listen\">🔊\u003c/button> Which number?","o":["13","30"],"a":0,"why":"thirTEEN → 13"},{"q":"\u003cbutton class=\"say-btn\" data-say=\"forty\" title=\"Dinle\" aria-label=\"Listen\">🔊\u003c/button> Which number?","o":["14","40"],"a":1,"why":"FORty → 40"},{"q":"\u003cbutton class=\"say-btn\" data-say=\"fifteen\" title=\"Dinle\" aria-label=\"Listen\">🔊\u003c/button> Which number?","o":["15","50"],"a":0,"why":"fifTEEN → 15"},{"q":"\u003cbutton class=\"say-btn\" data-say=\"sixty\" title=\"Dinle\" aria-label=\"Listen\">🔊\u003c/button> Which number?","o":["16","60"],"a":1,"why":"SIXty → 60"},{"q":"\u003cbutton class=\"say-btn\" data-say=\"seventeen\" title=\"Dinle\" aria-label=\"Listen\">🔊\u003c/button> Which number?","o":["17","70"],"a":0,"why":"sevenTEEN → 17"},{"q":"\u003cbutton class=\"say-btn\" data-say=\"eighty\" title=\"Dinle\" aria-label=\"Listen\">🔊\u003c/button> Which number?","o":["18","80"],"a":1,"why":"EIGHty → 80"},{"q":"\u003cbutton class=\"say-btn\" data-say=\"nineteen\" title=\"Dinle\" aria-label=\"Listen\">🔊\u003c/button> Which number?","o":["19","90"],"a":0,"why":"nineTEEN → 19"},{"q":"\u003cbutton class=\"say-btn\" data-say=\"It costs fifty lira.\" title=\"Dinle\" aria-label=\"Listen\">🔊\u003c/button> How much?","o":["15 TL","50 TL"],"a":1,"why":"FIFty → 50"},{"q":"\u003cbutton class=\"say-btn\" data-say=\"My phone number is oh five three two, four one six, double seven, eight nine.\" title=\"Dinle\" aria-label=\"Listen\">🔊\u003c/button> Which number?","o":["0532 416 77 89","0532 460 77 98"],"a":0,"why":"oh = 0 · double seven = 77"},{"q":"\u003cbutton class=\"say-btn\" data-say=\"I was born in nineteen seventy-three.\" title=\"Dinle\" aria-label=\"Listen\">🔊\u003c/button> Which year?","o":["1937","1973"],"a":1,"why":"nineteen seventy-three = 1973"}]},{"type":"listen","title":"Write the number in words","titleTR":"Duyduğunuz sayıyı kelimeyle yazın","items":[{"text":"forty","hint":"40 değil, kelimeyle"},{"text":"fifteen","hint":"kelimeyle"},{"text":"ninety","hint":"kelimeyle"},{"text":"twelve","hint":"kelimeyle"},{"text":"twenty-one","hint":"tireyle"},{"text":"a hundred","hint":"iki kelime"}]}]},{"id":"k1-dates","block":1,"step":2,"min":6,"extra":true,"mode":"Whole class → pairs","material":"Ekran","kicker":"Step 2 · Extra","title":"Ordinals, days, months and dates","titleTR":"Sıra sayıları, günler, aylar, mevsimler ve tarih söyleme","lead":"first, second, third … and \u003cb>the ninth of October\u003c/b>. Days and months always start with a \u003cb>capital letter\u003c/b>.","leadTR":"Birinci, ikinci, üçüncü … ve “9 Ekim”. Gün ve ay adları her zaman büyük harfle başlar.","sections":[{"type":"explain","title":"Konu anlatımı","icon":"📅","paras":["\u003cb>Sıra sayıları\u003c/b>: first (1st), second (2nd), third (3rd); gerisi sayının sonuna \u003cb>-th\u003c/b>: fourth, sixth, seventh, tenth. Yazım değişenler: five → \u003cb>fifth\u003c/b>, eight → \u003cb>eighth\u003c/b>, nine → \u003cb>ninth\u003c/b>, twelve → \u003cb>twelfth\u003c/b>, twenty → \u003cb>twentieth\u003c/b> (y → ie). Bileşiklerde yalnızca son kelime değişir: twenty-\u003cb>first\u003c/b>, thirty-\u003cb>first\u003c/b>.","\u003cb>Tarih söyleme\u003c/b>: “the + sıra sayısı + of + ay”: \u003ci>the ninth of October\u003c/i>. Yazarken: 9 October / 9th October. Gün → \u003cb>on\u003c/b> (on Monday, on 9 October) · ay, yıl, mevsim → \u003cb>in\u003c/b> (in October, in 2026, in winter).","Gün ve ay adları \u003cb>büyük harfle\u003c/b> başlar: Monday, October (Türkçede küçük: pazartesi, ekim)."]},{"type":"sayTiles","title":"Ordinal numbers","titleTR":"Sıra sayıları","groups":[{"label":"1st – 12th","sub":"watch the spelling","wide":true,"items":[["1st","first","first"],["2nd","second","second"],["3rd","third","third"],["4th","fourth","fourth"],["5th","fifth","fifth"],["6th","sixth","sixth"],["7th","seventh","seventh"],["8th","eighth","eighth"],["9th","ninth","ninth"],["10th","tenth","tenth"],["11th","eleventh","eleventh"],["12th","twelfth","twelfth"]]},{"label":"13th – 31st","sub":"dates","wide":true,"items":[["13th","thirteenth","thirteenth"],["15th","fifteenth","fifteenth"],["20th","twentieth","twentieth"],["21st","twenty-first","twenty-first"],["22nd","twenty-second","twenty-second"],["23rd","twenty-third","twenty-third"],["29th","twenty-ninth","twenty-ninth"],["30th","thirtieth","thirtieth"],["31st","thirty-first","thirty-first"]]}],"note":"Kutucuğa dokunun. Kısaltmada sayının son iki harfi yazılır: 1\u003cb>st\u003c/b>, 2\u003cb>nd\u003c/b>, 3\u003cb>rd\u003c/b>, 4\u003cb>th\u003c/b>."},{"type":"sayTiles","title":"Days, months and seasons","titleTR":"Günler, aylar, mevsimler","groups":[{"label":"Days","sub":"on Monday","wide":true,"items":[["Monday","Monday","pazartesi"],["Tuesday","Tuesday","salı"],["Wednesday","Wednesday","çarşamba"],["Thursday","Thursday","perşembe"],["Friday","Friday","cuma"],["Saturday","Saturday","cumartesi"],["Sunday","Sunday","pazar"]]},{"label":"Months","sub":"in May","wide":true,"items":[["January","January","ocak"],["February","February","şubat"],["March","March","mart"],["April","April","nisan"],["May","May","mayıs"],["June","June","haziran"],["July","July","temmuz"],["August","August","ağustos"],["September","September","eylül"],["October","October","ekim"],["November","November","kasım"],["December","December","aralık"]]},{"label":"Seasons","sub":"in summer","wide":true,"items":[["spring","spring","ilkbahar"],["summer","summer","yaz"],["autumn","autumn","sonbahar (US: fall)"],["winter","winter","kış"]]}]},{"type":"examples","title":"Dates in sentences","titleTR":"Cümlede tarih","items":[["Republic Day is on \u003cb>the twenty-ninth of October\u003c/b>.","Cumhuriyet Bayramı 29 Ekim'de."],["Children's Day is on \u003cb>the twenty-third of April\u003c/b>.","Çocuk Bayramı 23 Nisan'da."],["New Year's Day is on \u003cb>the first of January\u003c/b>.","Yılbaşı 1 Ocak'ta."],["My birthday is \u003cb>in\u003c/b> March. It's \u003cb>on\u003c/b> the fifth of March.","Doğum günüm martta; 5 Mart'ta."],["I was born \u003cb>in\u003c/b> 1971.","1971'de doğdum."],["We go to Mudanya \u003cb>in\u003c/b> summer.","Yazın Mudanya'ya gideriz."]]},{"type":"promptCards","title":"Ask your partner","titleTR":"Partnerinize sorun","small":true,"reveal":"Model answer","cards":[{"en":"When's your birthday?","tr":"Doğum gününüz ne zaman?","ans":"It's on the twelfth of June."},{"en":"What's your favourite month? Why?","tr":"En sevdiğiniz ay hangisi? Neden?","ans":"May. It's warm and green."},{"en":"What's your favourite season?","tr":"En sevdiğiniz mevsim?","ans":"Autumn. I love the colours."},{"en":"What day is it today?","tr":"Bugün günlerden ne?","ans":"It's …day."}]}]},{"id":"k1-classroom","block":1,"step":2,"min":5,"extra":true,"mode":"Whole class","material":"Ekran","kicker":"Step 2 · Extra","title":"Survival English for the classroom","titleTR":"Sınıfta hayat kurtaran kalıplar","lead":"Ten sentences you need in every lesson. Use them instead of Turkish!","leadTR":"Her derste lazım olan on cümle. Türkçe yerine bunları kullanın!","sections":[{"type":"examples","items":[["How do you say “\u003ci>ajanda\u003c/i>” in English?","… İngilizcede nasıl denir?"],["What does “\u003ci>neighbour\u003c/i>” mean?","… ne demek?"],["Can you repeat that, please?","Tekrar eder misiniz?"],["Can you speak more slowly, please?","Daha yavaş konuşur musunuz?"],["How do you spell it?","Nasıl yazılıyor / heceleniyor?"],["Sorry, I don't understand.","Pardon, anlamıyorum."],["Sorry, I don't know.","Pardon, bilmiyorum."],["What page is it?","Hangi sayfa?"],["Can I ask a question?","Bir soru sorabilir miyim?"],["I'm sorry I'm late.","Geç kaldığım için özür dilerim."]]},{"type":"flip","title":"Turkish → English","titleTR":"Türkçesine bakın, İngilizcesini söyleyin, sonra çevirin","big":true,"items":[["Tekrar eder misiniz?","Can you repeat that, please?"],["… ne demek?","What does … mean?"],["Anlamıyorum.","I don't understand."],["Nasıl yazılıyor?","How do you spell it?"],["Daha yavaş, lütfen.","More slowly, please."],["İngilizcede nasıl denir?","How do you say … in English?"]]}]},{"id":"k2-rule","block":1,"step":3,"min":4,"mode":"Whole class","material":"Ekran · Kutu 2","kicker":"Step 3 · Kutu 2 (1)","title":"be: am · is · are","titleTR":"be fiili: -im, -sin, -dir · özne zamirleri · olumlu, olumsuz, soru, kısa cevap","lead":"In Turkish we say \u003ci>öğretmen\u003cb>im\u003c/b>\u003c/i>. In English we need a verb: \u003cb>I am\u003c/b> a teacher. No other verb? → use \u003cb>be\u003c/b>.","leadTR":"Türkçede “öğretmenim” deriz; İngilizcede fiil şart: I am a teacher. Başka fiil yoksa be kullanılır.","sections":[{"type":"explain","title":"Konu anlatımı","icon":"🟢","paras":["Türkçede “Ben öğretmen\u003cb>im\u003c/b>, o yorgun, biz evde\u003cb>yiz\u003c/b>” cümlelerinde ayrı bir fiil yoktur; ekler iş görür. İngilizcede ise \u003cb>her cümlenin bir fiili olmak zorundadır\u003c/b>. Başka fiil yoksa bu işi \u003cb>be\u003c/b> fiili yapar: \u003cb>am · is · are\u003c/b>.","\u003cb>I\u003c/b> → am · \u003cb>he / she / it\u003c/b> → is · \u003cb>you / we / they\u003c/b> → are. Konuşmada neredeyse hep kısaltılır: I'm, she's, they're.","Olumsuz yapmak için be'den sonra \u003cb>not\u003c/b>: I'm not, she isn't, they aren't. Soru için be özneden \u003cb>öne\u003c/b> geçer: You are tired → \u003cb>Are you\u003c/b> tired? Başka yardımcı (do) gerekmez!"]},{"type":"persons","title":"Subject pronouns + be","titleTR":"Özne zamirleri ve be","rows":[["I","\u003cb>I am\u003c/b> · I'm",false,"ben …im"],["you","\u003cb>you are\u003c/b> · you're",false,"sen …sin / siz …siniz"],["he","\u003cb>he is\u003c/b> · he's",true,"o (erkek) …dir"],["she","\u003cb>she is\u003c/b> · she's",true,"o (kadın) …dir"],["it","\u003cb>it is\u003c/b> · it's",true,"o (eşya, hayvan, hava, saat)"],["we","\u003cb>we are\u003c/b> · we're",false,"biz …iz"],["they","\u003cb>they are\u003c/b> · they're",false,"onlar …dir"]],"note":"Türkçede tek bir “o” var; İngilizcede üç: \u003cb>he\u003c/b> (erkek), \u003cb>she\u003c/b> (kadın), \u003cb>it\u003c/b> (eşya, hayvan, hava)."},{"type":"formTable","title":"Form","titleTR":"Yapı","rows":[{"sign":"+","ex":"I'\u003cb>m\u003c/b> retired. · My wife \u003cb>is\u003c/b> a nurse. · We'\u003cb>re\u003c/b> from Bursa.","note":"emekliyim · hemşire · Bursalıyız"},{"sign":"−","ex":"I'\u003cb>m not\u003c/b> tired. · He \u003cb>isn't\u003c/b> at home. · They \u003cb>aren't\u003c/b> married.","note":"değilim · değil · değiller"},{"sign":"?","ex":"\u003cb>Are\u003c/b> you married? · \u003cb>Is\u003c/b> she from İzmir? · Where \u003cb>are\u003c/b> they?","note":"be özneden önce"},{"sign":"↩","ex":"Yes, I \u003cb>am\u003c/b>. / No, I'\u003cb>m not\u003c/b>. · Yes, she \u003cb>is\u003c/b>. / No, she \u003cb>isn't\u003c/b>.","note":"kısa cevap"}]},{"type":"examples","title":"Examples","titleTR":"Örnekler","items":[["I'\u003cb>m\u003c/b> Selin. I'\u003cb>m\u003c/b> from Kestel.","Ben Selin. Kestelliyim."],["My husband \u003cb>isn't\u003c/b> at home. He'\u003cb>s\u003c/b> at the coffee house.","Eşim evde değil. Kahvehanede."],["\u003cb>Are\u003c/b> you tired? — No, I'\u003cb>m not\u003c/b>. I'\u003cb>m\u003c/b> fine.","Yorgun musun? — Hayır, iyiyim."],["\u003cb>Is\u003c/b> your daughter married? — Yes, she \u003cb>is\u003c/b>.","Kızın evli mi? — Evet."],["We'\u003cb>re\u003c/b> retired, but we'\u003cb>re\u003c/b> very busy!","Emekliyiz ama çok meşgulüz!"],["\u003cb>It's\u003c/b> cold today. Where'\u003cb>s\u003c/b> my coat?","Bugün hava soğuk. Montum nerede?"],["My grandchildren \u003cb>are\u003c/b> seven and ten.","Torunlarım yedi ve on yaşında."],["Where \u003cb>are\u003c/b> you from? — I'\u003cb>m\u003c/b> from Gemlik.","Nerelisiniz? — Gemlikliyim."]]},{"type":"callout","tone":"warn","title":"Two small traps","titleTR":"İki küçük tuzak","text":"\u003cb>I am not\u003c/b> → I'm not (I amn't diye bir kısaltma yok) · Olumlu kısa cevapta kısaltma yok: \u003cb>Yes, I am.\u003c/b> ✓ / Yes, I'm. ✗ · \u003cb>he's\u003c/b> = he is (bazen he has) — \u003cb>his\u003c/b> = onun (Kutu 3)!"}]},{"id":"k2-uses","block":1,"step":3,"min":3,"mode":"Whole class","material":"Ekran · Kutu 2","kicker":"Step 3 · Kutu 2 (2)","title":"When do we use be?","titleTR":"be ne zaman kullanılır? Sekiz kullanım ve Türkçe tuzakları","lead":"Name, age, job, country, feelings, place, weather, price — all with \u003cb>be\u003c/b>.","leadTR":"İsim, yaş, meslek, memleket, duygu, yer, hava durumu, fiyat — hepsi be ile.","sections":[{"type":"rules","cols":4,"items":[{"tag":"Name","h":"İsim","tr":"Adım …","ex":"My name\u003cb>'s\u003c/b> Hülya. I\u003cb>'m\u003c/b> Hülya."},{"tag":"Age","h":"Yaş","tr":"… yaşındayım","ex":"I\u003cb>'m\u003c/b> 54. She\u003cb>'s\u003c/b> ten years old."},{"tag":"Job","h":"Meslek","tr":"… olarak çalışıyorum","ex":"He\u003cb>'s\u003c/b> a driver. We\u003cb>'re\u003c/b> retired."},{"tag":"Country","h":"Memleket, milliyet","tr":"…lıyım","ex":"I\u003cb>'m\u003c/b> from Gemlik. I\u003cb>'m\u003c/b> Turkish."},{"tag":"Feelings","h":"Duygu ve durum","tr":"acıktım, üşüdüm, yorgunum","ex":"I\u003cb>'m\u003c/b> hungry. Are you cold?"},{"tag":"Place","h":"Yer","tr":"evdeyim, işteyiz","ex":"She\u003cb>'s\u003c/b> at work. They\u003cb>'re\u003c/b> in Ankara."},{"tag":"Weather & time","h":"Hava, saat","tr":"hava soğuk, saat üç","ex":"\u003cb>It's\u003c/b> cold. \u003cb>It's\u003c/b> three o'clock."},{"tag":"Price & description","h":"Fiyat, nitelik","tr":"kaç para? çok güzel","ex":"How much \u003cb>is\u003c/b> it? It\u003cb>'s\u003c/b> beautiful."}]},{"type":"trTrap","title":"Turkish traps","titleTR":"Türkçeden çeviri tuzakları","rows":[{"tr":"52 yaşındayım.","wrong":"I have 52 years.","right":"I'm 52. / I'm 52 years old."},{"tr":"Katılıyorum.","wrong":"I'm agree.","right":"I agree."},{"tr":"Acıktım. / Üşüdüm.","wrong":"I hungry. / I have cold.","right":"I'm hungry. / I'm cold."},{"tr":"Evliyim.","wrong":"I married.","right":"I'm married."},{"tr":"Hava soğuk.","wrong":"Is cold. / Weather cold.","right":"It's cold. / The weather is cold."},{"tr":"Korkuyorum.","wrong":"I afraid.","right":"I'm afraid. / I'm scared."},{"tr":"Haklısın.","wrong":"You have right.","right":"You're right."},{"tr":"Emekliyim.","wrong":"I retired person.","right":"I'm retired."}]}]},{"id":"k2-practice","block":1,"step":3,"min":3,"mode":"Individual → class","material":"Ekran","kicker":"Step 3 · Kutu 2 · Practice","title":"Practice: am, is, are","titleTR":"Alıştırma: be fiilini doğru biçimde yazın","lead":"Write the correct form of \u003cb>be\u003c/b>. Short forms are OK.","leadTR":"be fiilinin doğru biçimini yazın. Kısaltmalar da doğru kabul edilir.","sections":[{"type":"gap","items":[{"q":"My name ___ Hülya and I ___ from İnegöl.","a":["is|'s","am|'m"],"why":"my name → is · I → am"},{"q":"My grandchildren ___ seven and nine.","a":["are|'re"],"why":"çoğul → are; yaş → be"},{"q":"It ___ very cold today.","a":["is|'s"],"why":"hava → it is"},{"q":"___ you married? — Yes, I ___.","a":["Are","am"],"why":"soru: Are you …? · kısa cevap: Yes, I am"},{"q":"My father ___ a farmer.","a":["is|'s"],"why":"he → is"},{"q":"We ___ (not) tired. We ___ fine!","a":["are not|aren't|'re not","are|'re"],"why":"olumsuz: aren't"},{"q":"___ your husband at home? — No, he ___.","a":["Is","isn't|is not|'s not"],"why":"kısa cevap: No, he isn't"},{"q":"I ___ (not) hungry, thanks.","a":["am not|'m not"],"why":"I'm not (amn't yok)"},{"q":"Where ___ my glasses? — They ___ on the table.","a":["are","are|'re"],"why":"glasses → çoğul"},{"q":"How much ___ this bag? — It ___ 300 lira.","a":["is|'s","is|'s"],"why":"fiyat → be"}]}]},{"id":"k2-fix","block":1,"step":3,"min":5,"extra":true,"mode":"Individual","material":"Ekran","kicker":"Step 3 · Extra","title":"Correct the sentences: be","titleTR":"Cümleleri düzeltin: be ile ilgili Türkçe kaynaklı hatalar","lead":"Every sentence has one mistake. Write the correct sentence.","leadTR":"Her cümlede bir hata var. Doğru cümleyi yazın.","sections":[{"type":"fix","items":[{"w":"I have 50 years.","r":["I'm 50.","I am 50.","I'm 50 years old.","I am 50 years old."],"why":"yaş → be"},{"w":"She married.","r":["She's married.","She is married."],"why":"evli (durum) → be married"},{"w":"My brothers is doctors.","r":["My brothers are doctors."],"why":"çoğul → are"},{"w":"He from Gemlik.","r":["He's from Gemlik.","He is from Gemlik."],"why":"fiil eksik → is"},{"w":"Is cold today.","r":["It's cold today.","It is cold today."],"why":"hava → it"},{"w":"You are a teacher? (soru)","r":["Are you a teacher?"],"why":"soruda be başa"},{"w":"Are you tired? — Yes, I'm.","r":["Yes, I am."],"why":"olumlu kısa cevapta kısaltma yok"},{"w":"I'm agree with you.","r":["I agree with you."],"why":"agree fiil; am gereksiz"}]}]},{"id":"k2-talk","block":1,"step":3,"min":6,"extra":true,"mode":"Pairs → class","material":"Ekran","kicker":"Step 3 · Extra","title":"Yes, I am — and a bit more","titleTR":"Kısa cevap + bir bilgi: konuşma pratiği","lead":"Answer with a \u003cb>short answer\u003c/b> and add \u003cb>one more sentence\u003c/b>.","leadTR":"Kısa cevap verin ve bir cümle daha ekleyin.","sections":[{"type":"golden","badLabel":"Too short","goodLabel":"Short answer + more","short":"— Are you from Bursa?\u003cbr>— Yes.","long":"— Are you from Bursa?\u003cbr>— \u003cb>Yes, I am.\u003c/b> I'm from Mudanya, but I live in Nilüfer. \u003cb>And you?\u003c/b>"},{"type":"promptCards","small":true,"reveal":"Model","cards":[{"en":"Are you from Bursa?","ans":"Yes, I am. / No, I'm not. I'm from …"},{"en":"Are you married?","ans":"Yes, I am. My husband's name is …"},{"en":"Is your house big?","ans":"No, it isn't. It's small but nice."},{"en":"Are your children at university?","ans":"No, they aren't. They're married."},{"en":"Is your best friend funny?","ans":"Yes, she is. She's very funny!"},{"en":"Are you tired today?","ans":"A little. I'm OK."},{"en":"Is English difficult?","ans":"Yes, it is — but it's fun!"},{"en":"Are you retired?","ans":"Yes, I am. / No, I'm not. I'm a …"},{"en":"Is it hot in Bursa in summer?","ans":"Yes, it is. It's very hot in August."}]}]},{"id":"k2-identity","block":1,"step":3,"min":8,"extra":true,"mode":"Whole class game","material":"Ekran","kicker":"Step 3 · Extra","title":"New identity: countries and nationalities","titleTR":"Yeni kimlik: ülkeler ve milliyetler (be ile tanıtım oyunu)","lead":"Draw a card. You are a new person! Introduce yourself. The class asks you questions.","leadTR":"Kart çekin; artık yeni birisiniz! Kendinizi tanıtın, sınıf size sorular sorsun.","sections":[{"type":"table","title":"Country → nationality","titleTR":"Ülke → milliyet","head":["-ish / -sh","-an / -ian","-ese","different"],"firstBold":false,"rows":[["Turkey → Turk\u003cb>ish\u003c/b>","Italy → Ital\u003cb>ian\u003c/b>","Japan → Japan\u003cb>ese\u003c/b>","Greece → \u003cb>Greek\u003c/b>"],["England → Engl\u003cb>ish\u003c/b>","Germany → Germ\u003cb>an\u003c/b>","China → Chin\u003cb>ese\u003c/b>","France → \u003cb>French\u003c/b>"],["Spain → Span\u003cb>ish\u003c/b>","Russia → Russ\u003cb>ian\u003c/b>","Portugal → Portugu\u003cb>ese\u003c/b>","the Netherlands → \u003cb>Dutch\u003c/b>"],["Ireland → Ir\u003cb>ish\u003c/b>","America (the USA) → Americ\u003cb>an\u003c/b>","Vietnam → Vietnam\u003cb>ese\u003c/b>","Iraq → \u003cb>Iraqi\u003c/b>"]],"note":"Ülke ve milliyetler büyük harfle yazılır. Dil çoğunlukla milliyetle aynıdır: I speak Turkish."},{"type":"cardDraw","promptTitle":"Introduce yourself","decks":[{"key":"id","name":"Identity cards","tr":"Kimlik kartları","prompts":["Hello, I'm … .","I'm a … (job).","I'm from … . I'm … (nationality).","I'm … years old.","Class: Are you married? · Is your city big? · Are you happy?"],"cards":[{"en":"Yuki · doctor · Japan · 45","tr":"Japonya → Japanese"},{"en":"Marco · chef · Italy · 38","tr":"İtalya → Italian"},{"en":"Ana · teacher · Spain · 52","tr":"İspanya → Spanish"},{"en":"Hans · engineer · Germany · 60","tr":"Almanya → German"},{"en":"Li · shop assistant · China · 29","tr":"Çin → Chinese"},{"en":"Sophie · nurse · France · 41","tr":"Fransa → French"},{"en":"John · taxi driver · England · 57","tr":"İngiltere → English"},{"en":"Elena · singer · Greece · 33","tr":"Yunanistan → Greek"},{"en":"Olga · farmer · Russia · 49","tr":"Rusya → Russian"},{"en":"Mike · police officer · the USA · 44","tr":"ABD → American"}]}]}]},{"id":"k3-rule","block":1,"step":4,"min":4,"mode":"Whole class","material":"Ekran · Kutu 3","kicker":"Step 4 · Kutu 3 (1)","title":"my · your · his · her · its · our · their","titleTR":"İyelik sıfatları, 's (Ali'nin), whose, nesne zamirleri — tek tabloda","lead":"Turkish puts the ending \u003cb>after\u003c/b> the word: \u003ci>kitab\u003cb>ım\u003c/b>\u003c/i>. English puts a word \u003cb>before\u003c/b> it: \u003cb>my\u003c/b> book.","leadTR":"Türkçede iyelik eki kelimenin sonuna gelir (kitabım); İngilizcede başına ayrı bir kelime gelir (my book).","sections":[{"type":"explain","title":"Konu anlatımı","icon":"👜","paras":["İyelik sıfatı (my, your, his …) ismin \u003cb>önüne\u003c/b> gelir ve \u003cb>hiç değişmez\u003c/b>: my car, my cars, my children. Önüne a / an / the gelmez: \u003ci>my a car\u003c/i> ✗.","En kritik nokta \u003cb>his / her\u003c/b>: Türkçede ikisi de “onun”. Bakılacak şey \u003cb>sahibinin\u003c/b> cinsiyetidir: \u003ci>Ayşe and \u003cb>her\u003c/b> husband\u003c/i> (Ayşe kadın) · \u003ci>Ali and \u003cb>his\u003c/b> wife\u003c/i> (Ali erkek). Eşya ve hayvan için \u003cb>its\u003c/b>: \u003ci>The cat is hungry. Its bowl is empty.\u003c/i> Dikkat: \u003cb>it's\u003c/b> = it is!","İsimle sahiplik: \u003cb>'s\u003c/b> → \u003ci>Hasan\u003cb>'s\u003c/b> car\u003c/i> (Hasan'ın arabası), \u003ci>my mother\u003cb>'s\u003c/b> house\u003c/i>. -s ile biten çoğulda yalnızca kesme: \u003ci>my parents\u003cb>'\u003c/b> house\u003c/i>. Soru: \u003cb>Whose\u003c/b> …? (kimin?) → \u003ci>Whose bag is this? — It's Ayşe's.\u003c/i>","Fiilden ve edattan \u003cb>sonra\u003c/b> nesne zamiri gelir: \u003ci>Call \u003cb>me\u003c/b>. I love \u003cb>him\u003c/b>. Come with \u003cb>us\u003c/b>.\u003c/i> (Call I ✗). Tek başına kullanılan iyelik zamirleri: \u003ci>This bag is \u003cb>mine\u003c/b>. Is it \u003cb>yours\u003c/b>?\u003c/i>"]},{"type":"table","title":"The big pronoun table","titleTR":"Büyük zamir tablosu","head":["Subject","be","Possessive + noun","Object","Alone","Türkçe"],"hi":[2,3],"rows":[["I","I'm","\u003cb>my\u003c/b> house","me","mine","ben · benim · beni · benimki"],["you","you're","\u003cb>your\u003c/b> house","you","yours","sen/siz · senin · seni · seninki"],["he","he's","\u003cb>his\u003c/b> house","him","his","o (erkek) · onun · onu · onunki"],["she","she's","\u003cb>her\u003c/b> house","her","hers","o (kadın) · onun · onu · onunki"],["it","it's","\u003cb>its\u003c/b> house","it","—","o (eşya / hayvan) · onun · onu"],["we","we're","\u003cb>our\u003c/b> house","us","ours","biz · bizim · bizi · bizimki"],["they","they're","\u003cb>their\u003c/b> house","them","theirs","onlar · onların · onları · onlarınki"]],"note":"Sarı satırlar en çok karışanlar: \u003cb>his\u003c/b> (erkeğin) / \u003cb>her\u003c/b> (kadının). \u003cb>their\u003c/b> (onların) ≠ \u003cb>there\u003c/b> (orada) ≠ \u003cb>they're\u003c/b> (they are) — üçü aynı okunur!"},{"type":"examples","title":"Examples","titleTR":"Örnekler","items":[["\u003cb>My\u003c/b> name is Kemal and this is \u003cb>my\u003c/b> wife, Selin.","Benim adım Kemal, bu da eşim Selin."],["Ayşe lives with \u003cb>her\u003c/b> daughter.","Ayşe kızıyla yaşıyor."],["Murat loves \u003cb>his\u003c/b> grandchildren.","Murat torunlarını çok seviyor."],["We've got a dog. \u003cb>Its\u003c/b> name is Karabaş.","Bir köpeğimiz var. Onun adı Karabaş."],["My neighbours are nice. \u003cb>Their\u003c/b> garden is lovely.","Komşularım iyi. Bahçeleri çok güzel."],["This is \u003cb>Hasan's\u003c/b> car. That's \u003cb>my sister's\u003c/b> house.","Bu Hasan'ın arabası. Şu ablamın evi."],["\u003cb>Whose\u003c/b> phone is this? — It's \u003cb>mine\u003c/b>.","Bu kimin telefonu? — Benim."],["I visit \u003cb>them\u003c/b> every Sunday. Come with \u003cb>us\u003c/b>!","Onları her pazar ziyaret ederim. Bizimle gel!"]]},{"type":"trTrap","title":"The most common mistakes","titleTR":"En sık hatalar","rows":[{"tr":"Ayşe ve kocası","wrong":"Ayşe and his husband","right":"Ayşe and her husband"},{"tr":"Mehmet ve karısı","wrong":"Mehmet and her wife","right":"Mehmet and his wife"},{"tr":"Ali'nin arabası","wrong":"the car of Ali","right":"Ali's car"},{"tr":"Kedinin adı (onun adı)","wrong":"it's name","right":"its name"},{"tr":"Beni ara.","wrong":"Call I.","right":"Call me."},{"tr":"Onların evi","wrong":"there house","right":"their house"}]}]},{"id":"k3-practice","block":1,"step":4,"min":4,"mode":"Individual → pairs","material":"Ekran","kicker":"Step 4 · Kutu 3 · Practice","title":"Practice: possessives","titleTR":"Alıştırma: my / his / her …, 's ve me / him / them","lead":"Complete the sentences with one word.","leadTR":"Cümleleri tek kelimeyle tamamlayın.","sections":[{"type":"gap","items":[{"q":"Ayşe lives with ___ husband in Kestel.","a":["her"],"why":"Ayşe (kadın) → her"},{"q":"Mehmet loves ___ grandchildren very much.","a":["his"],"why":"Mehmet (erkek) → his"},{"q":"We love ___ new flat. It's very bright.","a":["our"],"why":"we → our"},{"q":"My neighbours are lovely. ___ garden is full of roses.","a":["Their"],"why":"they → their"},{"q":"This is my cat. ___ name is Pamuk.","a":["Its"],"why":"hayvan → its (it's değil)"},{"q":"Excuse me, what's ___ name?","a":["your"],"why":"you → your"},{"q":"This is ___ car. (Hasan)","a":["Hasan's"],"why":"isim + 's"},{"q":"My ___ house is in Gemlik. (parents)","a":["parents'"],"why":"-s ile biten çoğul → parents'"},{"q":"I love my grandmother. I visit ___ every Sunday.","a":["her"],"why":"nesne: her (onu)"},{"q":"Where are my glasses? I can't find ___.","a":["them"],"why":"glasses → them (onları)"}]},{"type":"choice","title":"Quick choice","titleTR":"Hızlı seçim","start":11,"items":[{"q":"___ bag is this? — It's Fatma's.","o":["Who","Whose","Who's"],"a":1,"why":"kimin? → Whose"},{"q":"Is this your coat? — Yes, it's ___.","o":["my","me","mine"],"a":2,"why":"tek başına → mine"},{"q":"Can you help ___, please?","o":["I","me","my"],"a":1,"why":"fiilden sonra nesne → me"},{"q":"Our children and ___ children are friends.","o":["they","there","their"],"a":2,"why":"onların → their"}]}]},{"id":"k3-reading","block":1,"step":4,"min":8,"extra":true,"mode":"Individual → class","material":"Ekran","kicker":"Step 4 · Extra","title":"Reading: Kemal's family","titleTR":"Okuma: Kemal'in ailesi — his, her ve 's işaretleme","lead":"Read about Kemal's family. Tap the words \u003cb>his\u003c/b>, \u003cb>her\u003c/b>, \u003cb>their\u003c/b> and the \u003cb>'s\u003c/b> words.","leadTR":"Kemal'in ailesini okuyun. his, her, their ve 's'li kelimelere dokunarak renklendirin.","sections":[{"type":"reading","id":"kemal","tap":"Kelimelere","unit":"kelime","colTitle":"Sort the words","title":"My family","byline":"Kemal Doğan, 58, Mudanya","marks":{"h":{"label":"his","tr":"erkeğin","cls":"m-teal"},"r":{"label":"her","tr":"kadının","cls":"m-coral"},"t":{"label":"their / 's","tr":"onların, …'nin","cls":"m-purple"}},"columns":{"h":"his","r":"her","t":"their / 's"},"paragraphs":["Hello! My name is Kemal and I'm from Mudanya. I'm a fisherman, but I'm retired now. My {t|wife's} name is Selin. {r|Her} family is from Bursa. She's a teacher and {r|her} students love her.","We've got two children, a son and a daughter. Our son is Emre. {h|His} wife is Deniz and {h|his} job is in İstanbul. Our daughter is Zeynep. {r|Her} husband is a doctor. {t|Their} children are seven and four. {t|Zeynep's} son is very funny!","My brother Ahmet lives next to us. {h|His} house is small but {h|his} garden is beautiful. {t|Ahmet's} wife is Fatma. {r|Her} cakes are the best in Mudanya!"],"questions":[{"q":"What's Kemal's wife's name?","a":"Her name is Selin."},{"q":"Where is Selin's family from?","a":"Her family is from Bursa."},{"q":"Who is Deniz?","a":"She's Emre's wife. (Kemal's daughter-in-law)"},{"q":"What's Zeynep's husband's job?","a":"He's a doctor."},{"q":"Whose cakes are the best?","a":"Fatma's cakes."}],"note":"Yalnızca his / her / their ve isim + 's (wife's, Zeynep's) işaretlenir. my / our ile kısaltma olan 's (She's = She is) ve nesne olan her (love her) işaretlenmez — ayrım için iyi bir tartışma noktası."}]},{"id":"k3-object","block":1,"step":4,"min":5,"extra":true,"mode":"Individual","material":"Ekran","kicker":"Step 4 · Extra","title":"me, him, her, us, them","titleTR":"Nesne zamirleri: fiilden ve edattan sonra","lead":"After a verb or a preposition, use \u003cb>me, you, him, her, it, us, them\u003c/b>.","leadTR":"Fiilden veya edattan (with, for, to …) sonra nesne zamiri kullanılır.","sections":[{"type":"examples","items":[["I love \u003cb>you\u003c/b>. Do you love \u003cb>me\u003c/b>?","Seni seviyorum. Sen beni seviyor musun?"],["My son calls \u003cb>me\u003c/b> every evening.","Oğlum her akşam beni arar."],["Where's Ali? I can't see \u003cb>him\u003c/b>.","Ali nerede? Onu göremiyorum."],["This present is for \u003cb>her\u003c/b>.","Bu hediye onun için."],["Come to the cinema with \u003cb>us\u003c/b>!","Bizimle sinemaya gel!"],["These apples are nice. I want \u003cb>them\u003c/b>.","Bu elmalar güzel. Onları istiyorum."]]},{"type":"choice","items":[{"q":"My daughter lives in Ankara. I miss ___ a lot.","o":["she","her","hers"],"a":1,"why":"fiilden sonra → her"},{"q":"Can you give ___ the salt, please?","o":["I","my","me"],"a":2,"why":"→ me"},{"q":"My grandsons are here. I play football with ___.","o":["they","them","their"],"a":1,"why":"edattan sonra → them"},{"q":"Mr Yılmaz is our neighbour. We like ___.","o":["him","he","his"],"a":0,"why":"→ him"},{"q":"Is this tea for ___? — Yes, it's for you.","o":["I","me","mine"],"a":1,"why":"for + me"},{"q":"We're in the garden. Come and sit with ___.","o":["we","our","us"],"a":2,"why":"with + us"}]}]},{"id":"k3-whose","block":1,"step":4,"min":6,"extra":true,"mode":"Whole class game","material":"Öğrencilerin eşyaları","kicker":"Step 4 · Extra","title":"Whose is this?","titleTR":"Bu kimin? — eşya toplama oyunu","lead":"Put one thing on the teacher's table: a pen, keys, glasses … Then ask and answer.","leadTR":"Herkes masaya bir eşyasını koysun (kalem, anahtar, gözlük …). Sonra sorup cevaplayın.","sections":[{"type":"steps","items":[{"en":"Everybody puts one or two things on the table.","tr":"Herkes masaya bir iki eşya koyar."},{"en":"Teacher: “Whose pen is this?” / “Whose keys are these?”","tr":"Öğretmen bir eşyayı kaldırıp sorar."},{"en":"Students guess: “I think it's Kemal's.” / “I think they're Selin's.”","tr":"Öğrenciler tahmin eder."},{"en":"Owner: “Yes, it's mine!” / “No, it isn't mine. It's his / hers.”","tr":"Sahibi cevap verir."}]},{"type":"frames","title":"Useful language","titleTR":"Kalıplar","items":["Whose … is this? / Whose … are these?","I think it's …'s. / I think they're …'s.","Yes, it's mine! / They're mine!","No, it isn't mine. Maybe it's his / hers."]}]},{"id":"k4-articles","block":1,"step":5,"min":3,"mode":"Whole class","material":"Ekran · Kutu 4","kicker":"Step 5 · Kutu 4 (1)","title":"a · an · the · no article","titleTR":"Tanımlıklar: a / an (bir), the (belirli), hiç tanımlık yok","lead":"Turkish has no word for \u003ci>the\u003c/i>, and we often don't say \u003ci>bir\u003c/i>. English needs them: \u003cb>I'm a nurse.\u003c/b>","leadTR":"Türkçede “the” yok, “bir”i de çoğu zaman söylemeyiz. İngilizcede gerekir: I'm a nurse.","sections":[{"type":"explain","title":"Konu anlatımı","icon":"🅰️","paras":["\u003cb>a / an\u003c/b> = “bir”. Yalnızca \u003cb>tekil ve sayılabilir\u003c/b> isimlerle kullanılır: a car, an apple. Çoğulla ve sayılamazla kullanılmaz: \u003ci>a cars\u003c/i> ✗, \u003ci>a water\u003c/i> ✗.","\u003cb>an\u003c/b>, sesli \u003cb>sesle\u003c/b> başlayan kelimeden önce gelir: an apple, an egg, an orange, an umbrella, an \u003cb>h\u003c/b>our (h okunmaz). Yazılışı sesliyle başlasa da “yu” sesiyle başlıyorsa \u003cb>a\u003c/b>: a university, a uniform, a European city.","\u003cb>the\u003c/b> = belirli olan: daha önce söz ettiğimiz şey (\u003ci>I've got a cat. \u003cb>The\u003c/b> cat is black.\u003c/i>), herkesin bildiği tek şey (the sun, the moon, the sea), ortamda belli olan (Close \u003cb>the\u003c/b> door, please). the tekil, çoğul ve sayılamaz isimlerle kullanılır.","\u003cb>Tanımlık yok\u003c/b>: genel konuşurken çoğul ve sayılamaz isimler (\u003ci>I like cats. Water is important.\u003c/i>), kişi ve şehir adları (Bursa, Ayşe), öğünler (have breakfast), kalıplar: \u003ci>at home, at work, go home, go to bed, by bus\u003c/i>.","\u003cb>Meslek\u003c/b>: İngilizcede meslekten önce a / an \u003cb>şart\u003c/b>: \u003ci>I'm \u003cb>a\u003c/b> nurse. He's \u003cb>an\u003c/b> engineer.\u003c/i> Türkçedeki “Hemşireyim” yanıltmasın."]},{"type":"rules","cols":4,"items":[{"tag":"a","h":"a + consonant sound","tr":"sessiz sesle başlayan","ex":"\u003cb>a\u003c/b> book · \u003cb>a\u003c/b> house · \u003cb>a\u003c/b> university"},{"tag":"an","h":"an + vowel sound","tr":"sesli sesle başlayan","ex":"\u003cb>an\u003c/b> apple · \u003cb>an\u003c/b> egg · \u003cb>an\u003c/b> hour"},{"tag":"the","h":"the: we know which","tr":"belirli, bilinen, tek","ex":"\u003cb>The\u003c/b> cat is black. · \u003cb>the\u003c/b> sea"},{"tag":"—","h":"no article","tr":"genel, isimler, kalıplar","ex":"I like \u003cb>tea\u003c/b>. · at \u003cb>home\u003c/b> · in \u003cb>Bursa\u003c/b>"}]},{"type":"examples","items":[["I'm \u003cb>a\u003c/b> housewife and my husband is \u003cb>an\u003c/b> electrician.","Ev hanımıyım, eşim elektrikçi."],["I've got \u003cb>a\u003c/b> dog and \u003cb>a\u003c/b> cat. \u003cb>The\u003c/b> dog is very old.","Bir köpeğim ve bir kedim var. Köpek çok yaşlı."],["Can you open \u003cb>the\u003c/b> window, please?","Pencereyi açar mısınız?"],["I eat \u003cb>an\u003c/b> apple every day.","Her gün bir elma yerim."],["The lesson is \u003cb>an\u003c/b> hour and a half.","Ders bir buçuk saat."],["My son is at \u003cb>a\u003c/b> university in İzmir.","Oğlum İzmir'de bir üniversitede."],["I love \u003cb>—\u003c/b> flowers. \u003cb>The\u003c/b> flowers in your garden are beautiful.","Çiçekleri severim (genel). Bahçendeki çiçekler (belirli) çok güzel."],["We have \u003cb>—\u003c/b> breakfast at eight and go to \u003cb>—\u003c/b> work by \u003cb>—\u003c/b> bus.","Sekizde kahvaltı yapar, işe otobüsle gideriz."]]}]},{"id":"k4-plurals","block":1,"step":5,"min":2,"mode":"Whole class","material":"Ekran · Kutu 4","kicker":"Step 5 · Kutu 4 (2)","title":"Plurals: -s, -es, -ies, -ves and irregular","titleTR":"Çoğul isimler: yazım kuralları ve düzensiz çoğullar","lead":"One \u003cb>child\u003c/b>, two \u003cb>children\u003c/b>. One \u003cb>person\u003c/b>, two \u003cb>people\u003c/b>. Learn the irregular ones!","leadTR":"Bir çocuk, iki çocuk (children). Bir kişi, iki kişi (people). Düzensizleri ezberleyin!","sections":[{"type":"spelling","title":"Spelling rules","titleTR":"Yazım kuralları","items":[{"title":"Most nouns → + s","rows":[["book → books","çoğu isim"],["car → cars",""],["day → days","sesli + y → s"]]},{"title":"-s, -ss, -sh, -ch, -x, -o → + es","rows":[["bus → buses","/ɪz/ okunur"],["glass → glasses · dish → dishes",""],["watch → watches · box → boxes",""],["tomato → tomatoes · potato → potatoes","ama: photo → photos"]]},{"title":"consonant + y → -ies","rows":[["city → cities","sessiz + y"],["baby → babies · family → families",""],["country → countries","ama: boy → boys"]]},{"title":"-f / -fe → -ves","rows":[["knife → knives",""],["wife → wives · life → lives",""],["shelf → shelves · leaf → leaves",""]]}]},{"type":"table","title":"Irregular plurals","titleTR":"Düzensiz çoğullar","head":["Singular","Plural","Türkçe","Example"],"rows":[["man","\u003cb>men\u003c/b>","adam, erkek","Two men are at the door."],["woman","\u003cb>women\u003c/b> (/ˈwɪmɪn/)","kadın","There are ten women in our class."],["child","\u003cb>children\u003c/b>","çocuk","I've got three children."],["person","\u003cb>people\u003c/b>","kişi, insan","Bursa people are friendly."],["foot","\u003cb>feet\u003c/b>","ayak","My feet are cold."],["tooth","\u003cb>teeth\u003c/b>","diş","Brush your teeth!"],["mouse","\u003cb>mice\u003c/b>","fare","There are mice in the garage!"],["sheep · fish","\u003cb>sheep · fish\u003c/b>","koyun · balık (değişmez)","My uncle has got fifty sheep."]],"note":"\u003cb>children, people, men, women\u003c/b> zaten çoğul: \u003ci>childrens, peoples\u003c/i> ✗."}]},{"id":"k5-this-adj","block":1,"step":5,"min":2,"mode":"Whole class","material":"Ekran · Kutu 5","kicker":"Step 5 · Kutu 5","title":"this · that · these · those + adjectives","titleTR":"Bu / şu / bunlar / şunlar ve sıfatların yeri","lead":"\u003cb>this\u003c/b> (here, one) · \u003cb>these\u003c/b> (here, many) · \u003cb>that\u003c/b> (there, one) · \u003cb>those\u003c/b> (there, many). Adjectives never take \u003cb>-s\u003c/b>.","leadTR":"this / these yakındaki, that / those uzaktaki için. Sıfatlar çoğul eki almaz.","sections":[{"type":"rules","cols":4,"items":[{"tag":"This · near · 1","h":"this","tr":"bu (yakın, tekil)","ex":"\u003cb>This\u003c/b> bag is new."},{"tag":"These · near · 2+","h":"these","tr":"bunlar (yakın, çoğul)","ex":"\u003cb>These\u003c/b> shoes are new."},{"tag":"That · far · 1","h":"that","tr":"şu / o (uzak, tekil)","ex":"\u003cb>That\u003c/b> house is old."},{"tag":"Those · far · 2+","h":"those","tr":"şunlar / onlar (uzak, çoğul)","ex":"\u003cb>Those\u003c/b> trees are tall."}]},{"type":"explain","title":"Konu anlatımı · sıfatlar","icon":"🎨","paras":["Sıfat ya \u003cb>isimden önce\u003c/b> gelir (\u003ci>a \u003cb>big\u003c/b> house, \u003cb>old\u003c/b> friends\u003c/i>) ya da \u003cb>be'den sonra\u003c/b> (\u003ci>The house is \u003cb>big\u003c/b>.\u003c/i>). Türkçedeki gibi “Araba kırmızı” derken fiili (is) unutmayın.","Sıfat \u003cb>hiç değişmez\u003c/b>: çoğul olmaz, cinsiyete göre değişmez: \u003ci>red cars, happy children, They are tired\u003c/i> (reds, happys, tireds ✗).","a / an sıfatın sesine göre seçilir: \u003ci>\u003cb>an\u003c/b> old house · \u003cb>a\u003c/b> big apple\u003c/i>. Pekiştireçler sıfattan önce: \u003ci>very cold, really nice, quite old, a bit tired\u003c/i>. Birden çok sıfatta genelde boyut → yaş → renk: \u003ci>a big old black car · long black hair\u003c/i>."]},{"type":"examples","title":"Examples","titleTR":"Örnekler","items":[["\u003cb>This\u003c/b> is my husband, Kemal.","Bu eşim Kemal. (tanıştırma)"],["Hello, \u003cb>this\u003c/b> is Ayşe. Can I speak to Fatma?","Alo, ben Ayşe. Fatma'yla konuşabilir miyim? (telefon)"],["\u003cb>These\u003c/b> tomatoes are very \u003cb>fresh\u003c/b>.","Bu domatesler çok taze."],["Look at \u003cb>that beautiful\u003c/b> house!","Şu güzel eve bak!"],["\u003cb>Those\u003c/b> people are my \u003cb>new\u003c/b> neighbours.","Şu insanlar yeni komşularım."],["I've got \u003cb>an old\u003c/b> car, but it's \u003cb>very good\u003c/b>.","Eski bir arabam var ama çok iyi."],["My grandson has got \u003cb>big brown\u003c/b> eyes.","Torunumun iri kahverengi gözleri var."],["The soup is \u003cb>really delicious\u003c/b>!","Çorba gerçekten çok lezzetli!"]]},{"type":"trTrap","rows":[{"tr":"Bu ayakkabılar yeni.","wrong":"This shoes is new.","right":"These shoes are new."},{"tr":"kırmızı arabalar","wrong":"reds cars","right":"red cars"},{"tr":"Araba kırmızı.","wrong":"The car red.","right":"The car is red."},{"tr":"çok güzel bir ev","wrong":"a house very beautiful","right":"a very beautiful house"},{"tr":"eski bir ev","wrong":"a old house","right":"an old house"}]}]},{"id":"k45-practice","block":1,"step":5,"min":2,"mode":"Individual → class","material":"Ekran","kicker":"Step 5 · Kutu 4–5 · Practice","title":"Practice: a / an / the, plurals, this / these","titleTR":"Hızlı alıştırma: Kutu 4 ve 5","lead":"Choose the correct answer.","leadTR":"Doğru cevabı seçin.","sections":[{"type":"choice","items":[{"q":"My husband is ___ electrician.","o":["a","an","—"],"a":1,"why":"e sesi → an; meslek → a / an şart"},{"q":"We waited for ___ hour.","o":["a","an","the"],"a":1,"why":"h okunmaz → an hour"},{"q":"My daughter is at ___ university in Ankara.","o":["a","an","—"],"a":0,"why":"“yu” sesi → a university"},{"q":"I've got a cat and a dog. ___ cat is white.","o":["A","The","—"],"a":1,"why":"ikinci kez → the"},{"q":"I like ___ cats. They're lovely.","o":["the","a","—"],"a":2,"why":"genel → tanımlık yok"},{"q":"My sister has got three ___.","o":["childs","children","childrens"],"a":1,"why":"düzensiz: children"},{"q":"There are a lot of ___ in the bazaar today.","o":["persons","peoples","people"],"a":2,"why":"person → people"},{"q":"Can you wash the ___, please?","o":["dishs","dishes","dishies"],"a":1,"why":"-sh → -es"},{"q":"___ shoes are very comfortable. (ayağınızdakiler)","o":["This","These","That"],"a":1,"why":"yakın + çoğul → these"},{"q":"Look at ___ house on the hill!","o":["these","those","that"],"a":2,"why":"uzak + tekil → that"},{"q":"They are very ___ people.","o":["kinds","kind","a kind"],"a":1,"why":"sıfat çoğul olmaz"},{"q":"It's ___ old building.","o":["a","an","the"],"a":1,"why":"sıfat old → an"}]}]},{"id":"k4-sort","block":1,"step":5,"min":5,"extra":true,"mode":"Individual → pairs","material":"Ekran","kicker":"Step 5 · Extra","title":"Sort the plurals","titleTR":"Çoğulları sınıflandırın: -s, -es, -ies / -ves, düzensiz","lead":"Tap a ":1,"step":5,"min":6,"extra":true,"mode":"Pairs","material":"Sınıftaki eşyalar","kicker":"Step 5 · Extra","title":"What's this? What are those?","titleTR":"Sınıftaki eşyaları this / that / these / those ve sıfatlarla anlatın","lead":"Point at things in the classroom. Ask and answer.","leadTR":"Sınıftaki eşyaları gösterin; sorun ve cevaplayın.","sections":[{"type":"frames","items":["What's this? — It's a pen. It's blue.","What are these? — They're my glasses. They're new.","What's that? — It's a window. It's very big.","What are those? — They're trees. They're tall and green.","Is this your bag? — Yes, it is. / No, it isn't.","Are those your keys? — Yes, they are. / No, they aren't."]},{"type":"model","title":"Model","text":"\u003cb>This\u003c/b> is my bag. It's \u003cb>black\u003c/b> and \u003cb>very old\u003c/b>, but I love it. \u003cb>These\u003c/b> are my glasses. They're \u003cb>new\u003c/b>. \u003cb>That\u003c/b> is our classroom window. It's \u003cb>big\u003c/b> and \u003cb>clean\u003c/b>. \u003cb>Those\u003c/b> trees in the garden are \u003cb>tall\u003c/b>.","listen":true}]},{"id":"k6-rule","block":1,"step":6,"min":3,"mode":"Whole class","material":"Ekran · Kutu 6","kicker":"Step 6 · Kutu 6","title":"have got / has got","titleTR":"have got: sahiplik (…im var) — have ile karşılaştırma","lead":"\u003ci>Bir arabam var.\u003c/i> → \u003cb>I've got\u003c/b> a car. / \u003cb>I have\u003c/b> a car. Both are correct!","leadTR":"“-im var” (sahiplik) İngilizcede have got veya have ile söylenir. İkisi de doğru.","sections":[{"type":"explain","title":"Konu anlatımı","icon":"🔑","paras":["Türkçedeki \u003cb>sahiplik\u003c/b> anlamındaki “var / yok” İngilizcede \u003cb>have got\u003c/b> (İngiliz İngilizcesi, konuşmada çok yaygın) veya \u003cb>have\u003c/b> (her yerde) ile söylenir. Anlam aynıdır.","\u003cb>I / you / we / they\u003c/b> → have got · have &nbsp;|&nbsp; \u003cb>he / she / it\u003c/b> → \u003cb>has\u003c/b> got · \u003cb>has\u003c/b>. Kısaltma: I've got, she's got, we've got.","Kullanım: \u003cb>aile\u003c/b> (I've got two sons), \u003cb>eşyalar\u003c/b> (She's got a new phone), \u003cb>dış görünüş\u003c/b> (He's got blue eyes), \u003cb>hastalık\u003c/b> (I've got a headache / a cold), \u003cb>zaman\u003c/b> (I haven't got time).","Olumsuz ve soru \u003cb>iki farklı sistemle\u003c/b> yapılır: have got → \u003ci>I haven't got · Have you got …?\u003c/i> &nbsp; have → \u003ci>I don't have · Do you have …?\u003c/i> İkisini karıştırmak en sık hatadır: \u003ci>Do you have got …?\u003c/i> ✗"]},{"type":"formCompare","left":{"name":"have got","tr":"İngiliz İngilizcesi","rows":[["+","I'\u003cb>ve got\u003c/b> a car. · She'\u003cb>s got\u003c/b> two sons."],["−","I \u003cb>haven't got\u003c/b> a car. · She \u003cb>hasn't got\u003c/b> a dog."],["?","\u003cb>Have\u003c/b> you \u003cb>got\u003c/b> a car? · \u003cb>Has\u003c/b> she \u003cb>got\u003c/b> children?"],["↩","Yes, I \u003cb>have\u003c/b>. / No, she \u003cb>hasn't\u003c/b>."]]},"right":{"name":"have","tr":"her yerde","rows":[["+","I \u003cb>have\u003c/b> a car. · She \u003cb>has\u003c/b> two sons."],["−","I \u003cb>don't have\u003c/b> a car. · She \u003cb>doesn't have\u003c/b> a dog."],["?","\u003cb>Do\u003c/b> you \u003cb>have\u003c/b> a car? · \u003cb>Does\u003c/b> she \u003cb>have\u003c/b> children?"],["↩","Yes, I \u003cb>do\u003c/b>. / No, she \u003cb>doesn't\u003c/b>."]]}},{"type":"examples","items":[["I'\u003cb>ve got\u003c/b> two brothers and a sister.","İki erkek, bir kız kardeşim var."],["My husband \u003cb>has got\u003c/b> a beard.","Eşimin sakalı var."],["We \u003cb>haven't got\u003c/b> a car, but we'\u003cb>ve got\u003c/b> two bikes.","Arabamız yok ama iki bisikletimiz var."],["\u003cb>Have\u003c/b> you \u003cb>got\u003c/b> any grandchildren? — Yes, I \u003cb>have\u003c/b>. Three!","Torununuz var mı? — Evet, üç tane!"],["She'\u003cb>s got\u003c/b> long grey hair and green eyes.","Uzun gri saçları ve yeşil gözleri var."],["I'\u003cb>ve got\u003c/b> a terrible headache.","Başım çok ağrıyor."],["\u003cb>Do\u003c/b> you \u003cb>have\u003c/b> a pen? — Sorry, I \u003cb>don't\u003c/b>.","Kalemin var mı? — Maalesef yok."],["Sorry, I \u003cb>haven't got\u003c/b> time today.","Kusura bakma, bugün vaktim yok."]]},{"type":"trTrap","title":"Mistakes to avoid","titleTR":"Kaçınılacak hatalar","rows":[{"tr":"Arabanız var mı?","wrong":"Do you have got a car?","right":"Have you got a car? / Do you have a car?"},{"tr":"Bir kızı var.","wrong":"She have got a daughter.","right":"She has got (She's got) a daughter."},{"tr":"İki oğlum var.","wrong":"I am have two sons.","right":"I've got two sons. / I have two sons."},{"tr":"Evet, var. (has got sorusuna)","wrong":"Yes, she has got.","right":"Yes, she has."},{"tr":"Masada bir kitap var.","wrong":"The table has got a book.","right":"There's a book on the table. (Kutu 7)"}]}]},{"id":"k6-practice","block":1,"step":6,"min":3,"mode":"Individual → class","material":"Ekran","kicker":"Step 6 · Kutu 6 · Practice","title":"Practice: have got / has got","titleTR":"Alıştırma: have got, has got, haven't got, Have … got?","lead":"Complete with the correct form of \u003cb>have got\u003c/b>. Short forms are OK.","leadTR":"have got'ın doğru biçimiyle tamamlayın. Kısaltmalar kabul.","sections":[{"type":"gap","items":[{"q":"My sister ___ three children.","a":["has got|'s got"],"why":"she → has got"},{"q":"I ___ a cat and two dogs.","a":["have got|'ve got"],"why":"I → have got"},{"q":"We ___ (not) a garden. We live in a flat.","a":["have not got|haven't got|'ve not got"],"why":"olumsuz: haven't got"},{"q":"___ you ___ any brothers or sisters?","a":["Have","got"],"why":"soru: Have you got …?"},{"q":"My husband ___ (not) a car. He goes everywhere on foot.","a":["has not got|hasn't got|'s not got"],"why":"he → hasn't got"},{"q":"___ your daughter ___ a job? — Yes, she ___.","a":["Has","got","has"],"why":"kısa cevap: Yes, she has"},{"q":"They ___ a beautiful house in Mudanya.","a":["have got|'ve got"],"why":"they → have got"},{"q":"Do you have a pen? — No, I ___.","a":["don't|do not"],"why":"have sorusu → do ile cevap"}]}]},{"id":"k6-sort","block":1,"step":6,"min":5,"extra":true,"mode":"Individual → class","material":"Ekran","kicker":"Step 6 · Extra","title":"be or have got?","titleTR":"be mi, have got mı? Türkçede ikisi de bazen “var”","lead":"Tap a card, then tap the correct box. \u003ci>I'm …\u003c/i> or \u003ci>I've got …\u003c/i>?","leadTR":"Karta, sonra doğru kutuya dokunun: I'm … mı, I've got … mı?","sections":[{"type":"sort","id":"behave","buckets":["I'm …","I've got …"],"items":[["52 (years old)",0],["hungry",0],["married",0],["from Bursa",0],["tired",0],["a teacher",0],["at home",0],["tall",0],["two sons",1],["a headache",1],["blue eyes",1],["a cold",1],["a big garden",1],["short hair",1],["three grandchildren",1],["a new car",1]]}]},{"id":"k6-talk","block":1,"step":6,"min":7,"extra":true,"mode":"Pairs","material":"Ekran","kicker":"Step 6 · Extra","title":"Family and things: interview","titleTR":"Aile ve eşyalar: ikili röportaj","lead":"Ask your partner. Answer with a short answer + more information.","leadTR":"Partnerinize sorun. Kısa cevap + ek bilgiyle cevap verin.","sections":[{"type":"promptCards","small":true,"reveal":"Model","cards":[{"en":"Have you got any brothers or sisters?","ans":"Yes, I have. I've got two brothers."},{"en":"Have you got any children?","ans":"Yes, I have. A son and a daughter."},{"en":"Have you got any grandchildren?","ans":"No, I haven't. Not yet!"},{"en":"Have you got a pet?","ans":"Yes, I've got a cat. Its name is …"},{"en":"Have you got a garden?","ans":"No, I haven't. I've got a balcony."},{"en":"Has your house got a big kitchen?","ans":"Yes, it has. / No, it hasn't."},{"en":"Have you got a car?","ans":"Yes, I have. It's an old white car."},{"en":"Have you got a smartphone?","ans":"Yes, I have. It's new."}]},{"type":"frames","title":"Report to the class","titleTR":"Partnerinizi sınıfa anlatın","items":["… has got two brothers.","… hasn't got de bir şeyin varlığını söylerken there is / there are kullanılır, have got değil.","sections":[{"type":"explain","title":"Konu anlatımı","icon":"🏘️","paras":["Türkçede “Sokağımda bir fırın \u003cb>var\u003c/b>, evde süt \u003cb>yok\u003c/b>” cümlelerindeki var / yok, bir \u003cb>yerde\u003c/b> bir şeyin bulunup bulunmadığını anlatır. İngilizcede bunun kalıbı: \u003cb>There is\u003c/b> (tekil ve sayılamaz) · \u003cb>There are\u003c/b> (çoğul).","Cümle sırası: \u003cb>There is / are + şey + yer\u003c/b>: \u003ci>There's a bank next to the post office.\u003c/i> Türkçe sırayla (yer + şey + var) kurulmaz.","Olumsuz: \u003ci>There \u003cb>isn't\u003c/b> a … / There \u003cb>aren't any\u003c/b> …\u003c/i> · Soru: \u003ci>\u003cb>Is there\u003c/b> a …? / \u003cb>Are there any\u003c/b> …?\u003c/i> · Kısa cevap: \u003ci>Yes, there is. / No, there aren't.\u003c/i>","\u003cb>some\u003c/b> olumlu çoğulda “birkaç, biraz” (There are some chairs), \u003cb>any\u003c/b> olumsuz ve soruda “hiç” (There aren't any chairs. Are there any chairs?). Ayrıntı Kutu 14'te."]},{"type":"formTable","rows":[{"sign":"+","ex":"\u003cb>There's\u003c/b> a park near my house. · \u003cb>There are\u003c/b> two bakeries in my street.","note":"tekil · çoğul"},{"sign":"−","ex":"\u003cb>There isn't\u003c/b> a cinema in our town. · \u003cb>There aren't any\u003c/b> shops here.","note":"yok"},{"sign":"?","ex":"\u003cb>Is there\u003c/b> a bus stop near here? · \u003cb>Are there any\u003c/b> good restaurants?","note":"var mı?"},{"sign":"↩","ex":"Yes, there \u003cb>is\u003c/b>. / No, there \u003cb>isn't\u003c/b>. · Yes, there \u003cb>are\u003c/b>. / No, there \u003cb>aren't\u003c/b>.","note":"kısa cevap"}]},{"type":"examples","items":[["\u003cb>There's\u003c/b> a big mosque in the centre of the village.","Köyün merkezinde büyük bir cami var."],["\u003cb>There are\u003c/b> three bedrooms in our flat.","Dairemizde üç yatak odası var."],["\u003cb>There's\u003c/b> some milk in the fridge.","Buzdolabında biraz süt var."],["\u003cb>There aren't any\u003c/b> eggs. Can you buy some?","Hiç yumurta yok. Biraz alır mısın?"],["\u003cb>Is there\u003c/b> a pharmacy near here? — Yes, \u003cb>there is\u003c/b>. It's opposite the bank.","Yakında eczane var mı? — Evet, bankanın karşısında."],["How many people \u003cb>are there\u003c/b> in your family? — \u003cb>There are\u003c/b> five.","Ailenizde kaç kişi var? — Beş."]]},{"type":"trTrap","rows":[{"tr":"Sokağımda bir fırın var.","wrong":"My street has a bakery. / In my street has a bakery.","right":"There's a bakery in my street."},{"tr":"Odada üç sandalye var.","wrong":"There is three chairs in the room.","right":"There are three chairs in the room."},{"tr":"Evde hiç ekmek yok.","wrong":"There is no any bread at home.","right":"There isn't any bread at home."},{"tr":"Yakında banka var mı?","wrong":"There is a bank near here?","right":"Is there a bank near here?"}]}]},{"id":"k7-prep","block":2,"step":7,"min":2,"mode":"Whole class","material":"Ekran · Kutu 7","kicker":"Step 7 · Kutu 7 (2)","title":"Where's the ball? Prepositions of place","titleTR":"Yer edatları: in, on, under, next to, between, behind, in front of, opposite, above, near","lead":"Look at the pictures. Where is the red ball?","leadTR":"Resimlere bakın: kırmızı top nerede?","sections":[{"type":"prepPics","items":[{"p":"in","s":"The ball is \u003cb>in\u003c/b> the box.","tr":"Top kutunun içinde."},{"p":"on","s":"The ball is \u003cb>on\u003c/b> the box.","tr":"Top kutunun üstünde."},{"p":"under","s":"The ball is \u003cb>under\u003c/b> the table.","tr":"Top masanın altında."},{"p":"next to","s":"The ball is \u003cb>next to\u003c/b> the box.","tr":"Top kutunun yanında."},{"p":"between","s":"The ball is \u003cb>between\u003c/b> the boxes.","tr":"Top kutuların arasında."},{"p":"behind","s":"The ball is \u003cb>behind\u003c/b> the box.","tr":"Top kutunun arkasında."},{"p":"in front of","s":"The ball is \u003cb>in front of\u003c/b> the box.","tr":"Top kutunun önünde."},{"p":"above","s":"
