<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English B1 · Day 02 · Life then and now</title>
<meta name="description" content="Offline B1 lesson, day 2 (06.10.2026): Present Simple vs Continuous, stative verbs, used to, opinions and superstitions. Hüdavendigar SGM · Gürkan Öztürk.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230b756d'/%3E%3Cpath d='M14 17h15v30H14zm21 0h15v30H35z' fill='white'/%3E%3C/svg%3E">
<style>:root{
  --ink:#172b37;--muted:#5d7079;--teal:#087c70;--teal-dark:#06665c;--teal-light:#e4f5ee;--teal-soft:#f0f9f5;
  --mint:#6ad8b0;--nav:#172d36;--nav-2:#1d3843;--border:#dfe7e8;--bg:#f4f7f7;--card:#fff;
  --amber:#f4ba54;--amber-light:#fdf3df;--amber-ink:#8a5a07;
  --purple:#735fc4;--purple-light:#efecfa;--red:#c4473a;--red-light:#fbeceb;--green:#1f8a5b;--green-light:#e3f5ec;
  --shadow:0 10px 30px #17333b0d;--shadow-lg:0 18px 50px #17333b18;--radius:18px;
  --side:272px;--bar:76px;
  font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:16px;line-height:1.5
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body.proj{font-size:19px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
img{max-width:100%;display:block}
[hidden]{display:none!important}
b,strong{font-weight:700}

/* ── Sidebar ── */
.sidebar{position:fixed;inset:0 auto 0 0;width:var(--side);background:var(--nav);color:#d9e5e7;display:flex;flex-direction:column;z-index:40;padding:26px 16px 18px;overflow-y:auto;transition:transform .25s ease}
.brand{display:flex;align-items:center;gap:12px;border:0;background:none;color:#fff;text-align:left;font-size:.85rem;font-weight:700;letter-spacing:.05em;padding:0 8px 22px}
.brand small{display:block;font-size:.74rem;color:#adbec3;letter-spacing:0;font-weight:400;margin-top:4px}
.brand-icon{flex:none;width:40px;height:44px;background:var(--mint);color:#17382e;border-radius:12px 12px 12px 3px;display:grid;place-items:center;font-weight:800;font-size:1rem}
.side-course{padding:14px 10px 12px;border-top:1px solid #ffffff15;letter-spacing:.1em;font-size:.72rem;color:#9db2b9;display:flex;justify-content:space-between}
.side-course span{color:var(--mint)}
.nav-btn{display:flex;width:100%;align-items:center;gap:10px;border:0;background:none;color:#cadadd;border-radius:9px;padding:7px 10px;font-size:.86rem;text-align:left;line-height:1.3}
.nav-btn:hover{background:#ffffff0b}
.nav-btn.active{background:#6ad8b026;color:#8ee6c3}
.nav-btn .nav-num{font-size:.72rem;min-width:24px;color:#8da6ae;font-variant-numeric:tabular-nums}
.nav-btn.done .nav-num{color:var(--mint)}
.nav-btn .nav-min{margin-left:auto;font-size:.7rem;color:#7f989f}
.nav-btn.extra{color:#a9bcc1}
.nav-btn.extra .nav-min::after{content:" · ek"}
.nav-btn.brk{color:var(--amber)}
.nav-group{margin:18px 0 6px;padding:0 10px;color:#9ab1b7;font-size:.7rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;display:flex;justify-content:space-between}
.side-bottom{margin-top:auto;padding:24px 10px 0}
.progress-label{display:flex;justify-content:space-between;font-size:.74rem;color:#b0c5ca}
.progress-label strong{color:#87dcbd}
.progress-track{height:5px;background:#ffffff14;border-radius:5px;margin:8px 0;overflow:hidden}
.progress-track span{display:block;height:100%;background:var(--mint);width:0;transition:width .3s}
.side-bottom p{font-size:.72rem;color:#7f989f;margin:6px 0 0}
.scrim{display:none;position:fixed;inset:0;background:#0b1a2066;z-index:35}
body.nav-open .scrim{display:block}

/* ── Workspace ── */
.workspace{margin-left:var(--side);min-height:100vh;padding-bottom:calc(var(--bar) + 30px)}
.topbar{position:sticky;top:0;z-index:20;background:#ffffffee;backdrop-filter:blur(8px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:11px 28px;min-height:64px}
.top-label{font-size:.76rem;letter-spacing:.12em;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-label span{margin:0 8px;color:#a9b9bd}
.top-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.pill{border:1px solid var(--border);background:#fff;border-radius:11px;padding:7px 13px;font-size:.86rem;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.pill:hover{border-color:#bfd3d4}
.pill span{font-size:.66rem;font-weight:700;color:#8b9ca2;letter-spacing:.05em}
.pill[aria-pressed=true]{background:var(--teal-light);border-color:#b8e2cf;color:var(--teal-dark)}
.pill[aria-pressed=true] span{color:var(--teal)}
.pill.soft{background:var(--teal-light);border-color:#c3e6d5;color:var(--teal-dark)}
.icon-btn{border:1px solid var(--border);background:#fff;border-radius:11px;width:40px;height:38px;display:grid;place-items:center;font-size:1.05rem;flex:none}
.menu-toggle{display:none}
main{max-width:1180px;margin:0 auto;padding:34px 32px 20px}
main:focus{outline:none}

/* ── Screen header ── */
.kicker{display:flex;align-items:center;gap:12px;font-size:.8rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--teal);margin:0 0 10px}
.kicker::before{content:"";width:28px;height:2px;background:var(--teal)}
.screen-head{display:flex;gap:18px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
h1{font-size:clamp(1.8rem,3.4vw,2.6rem);line-height:1.12;margin:0 0 6px;letter-spacing:-.01em}
h2{font-size:1.3rem;margin:0 0 12px}
h3{font-size:1.05rem;margin:0 0 8px}
.title-tr{color:var(--muted);font-size:1.05rem;margin:0 0 4px}
.badges{display:flex;gap:7px;flex-wrap:wrap;margin-top:6px}
.badge{border:1px solid #c8e7d8;background:var(--teal-light);color:var(--teal-dark);border-radius:8px;padding:5px 10px;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.badge.gray{background:#fff;border-color:var(--border);color:var(--muted)}
.badge.amber{background:var(--amber-light);border-color:#f3d79f;color:var(--amber-ink)}
.lead{font-size:1.32rem;line-height:1.45;margin:18px 0 4px;max-width:58rem}
.lead-tr{color:var(--purple);font-size:1rem;margin:2px 0 0}
.tr{display:none}
body.tr-on .tr{display:block}
body.tr-on span.tr,body.tr-on small.tr{display:inline}
.tr-badge{font-size:.62rem;font-weight:800;letter-spacing:.08em;color:var(--purple);background:var(--purple-light);border-radius:5px;padding:2px 5px;margin-right:6px;vertical-align:2px}

/* ── Teacher panel ── */
.teacher-panel{display:none;margin:22px 0 0;border:1px dashed #e2c37e;background:#fffaf0;border-radius:16px;padding:16px 20px}
body.teacher-on .teacher-panel{display:block}
.teacher-panel h4{margin:0 0 8px;font-size:.76rem;letter-spacing:.12em;text-transform:uppercase;color:var(--amber-ink)}
.teacher-panel ul{margin:0;padding-left:20px}
.teacher-panel li{margin:4px 0;font-size:.95rem}
.stages{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.stage{background:#fff;border:1px solid #f0dcae;border-radius:9px;padding:5px 10px;font-size:.8rem}
.stage b{color:var(--amber-ink);margin-right:4px}
.t-only{display:none}
body.teacher-on .t-only{display:block}

/* ── Sections ── */
.sec{margin-top:28px}
.sec-title{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:0 0 12px}
.sec-title h2{margin:0}
.sec-title .tr{color:var(--purple);font-size:.92rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 22px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))}
.label{font-size:.74rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--teal)}
.muted{color:var(--muted)}
.btn{border:1px solid var(--border);background:#fff;border-radius:11px;padding:8px 15px;font-size:.9rem;font-weight:600}
.btn:hover{border-color:#b9cfd1}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.primary:hover{background:var(--teal-dark)}
.btn.small{padding:5px 11px;font-size:.8rem;border-radius:9px}
.btn.ghost{background:transparent}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}

/* answers */
.ans{display:none}
body.show-answers .ans,.open>.ans,.open .ans-inline{display:block}
body.show-answers span.ans,.open span.ans{display:inline}
.ans-box{margin-top:10px;background:var(--green-light);border-left:4px solid var(--green);border-radius:10px;padding:9px 13px;color:#11563a;font-size:.95rem}
.reveal-btn{border:0;background:none;color:var(--teal);font-weight:600;font-size:.85rem;padding:4px 0;text-decoration:underline;text-underline-offset:3px}
body.show-answers .reveal-btn{display:none}

/* prompt cards */
.prompt-card{position:relative;background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:20px 22px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px}
.prompt-card .q{font-size:1.28rem;font-weight:600;line-height:1.35}
.prompt-card.small .q{font-size:1.05rem}
.prompt-card .num{font-size:.75rem;font-weight:800;color:var(--teal);letter-spacing:.1em}
.prompt-card .tag{display:inline-block;background:var(--amber-light);color:var(--amber-ink);border-radius:8px;padding:4px 10px;font-size:.82rem;font-weight:700;margin-top:4px}
.prompt-card .foot{margin-top:auto;padding-top:6px}

/* golden */
.golden{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.golden .bad,.golden .good{border-radius:16px;padding:16px 18px}
.golden .bad{background:var(--red-light);color:#7a2a22}
.golden .good{background:var(--green-light);color:#11563a}
.golden .bad b,.golden .good>b{display:block;font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:#fff;border:1px solid var(--border);border-radius:999px;padding:7px 14px;font-size:.95rem}
.frame{background:var(--teal-soft);border:1px solid #cfeadc;border-radius:12px;padding:10px 14px;font-size:1.05rem;font-weight:500}

/* steps */
.steps{counter-reset:s;display:grid;gap:10px;margin:0;padding:0;list-style:none}
.steps li{counter-increment:s;display:flex;gap:14px;align-items:flex-start;background:#fff;border:1px solid var(--border);border-radius:14px;padding:12px 16px}
.steps li::before{content:counter(s);flex:none;width:30px;height:30px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-weight:700;font-size:.9rem}

/* callouts */
.callout{border-radius:16px;padding:16px 20px;border:1px solid}
.callout h3{margin:0 0 6px;font-size:1rem}
.callout p{margin:0}
.callout.info{background:var(--teal-soft);border-color:#cde9db}
.callout.warn{background:var(--amber-light);border-color:#f2d9a4}
.callout.tr{background:var(--purple-light);border-color:#dcd5f4}

/* test board */
.test-board{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
.test-rules{background:var(--nav);color:#fff;border-radius:22px;padding:30px 32px}
.test-rules ol{margin:0;padding-left:1.3em;font-size:1.45rem;line-height:1.6}
.test-rules li::marker{color:var(--mint);font-weight:700}
.finish{background:#fff;border:1px solid var(--border);border-radius:22px;padding:26px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;box-shadow:var(--shadow)}
.finish .big{font-size:4.2rem;font-weight:800;color:var(--teal);font-variant-numeric:tabular-nums;line-height:1}
.finish small{color:var(--muted)}

/* timeline */
.tl-wrap{background:#fff;border:1px solid var(--border);border-radius:22px;padding:26px 26px 18px;box-shadow:var(--shadow)}
.tl{position:relative;height:200px;margin:0 6px}
.tl-line{position:absolute;left:0;right:0;top:142px;height:4px;background:linear-gradient(90deg,#b8c8cc,var(--teal) 50%,#b8c8cc);border-radius:4px}
.tl-line::after{content:"";position:absolute;right:-4px;top:-7px;border:9px solid transparent;border-left:12px solid #b8c8cc;border-right:0}
.tl-now{position:absolute;left:50%;top:120px;width:4px;height:48px;background:var(--red);border-radius:3px;transform:translateX(-50%)}
.tl-lbl{position:absolute;top:172px;font-size:.78rem;font-weight:800;letter-spacing:.14em;color:var(--muted);transform:translateX(-50%)}
.tl-lbl.now{color:var(--red)}
.tl-dot{position:absolute;top:134px;width:20px;height:20px;border-radius:50%;background:var(--amber);border:3px solid #fff;box-shadow:0 0 0 2px var(--amber);transform:translateX(-50%);opacity:0;transition:opacity .3s}
.tl-dot.span{width:46%;border-radius:10px;left:27%!important;transform:none;background:#f4ba5466;box-shadow:none;border:2px dashed var(--amber)}
.tl-dot.on{opacity:1}
.tl-tag{position:absolute;top:0;transform:translateX(-50%);background:var(--amber-light);color:var(--amber-ink);border-radius:9px;padding:4px 9px;font-size:.78rem;font-weight:700;white-space:nowrap;opacity:0;transition:opacity .3s}
.tl-tag.on{opacity:1}
.tl-items{display:grid;gap:8px;margin-top:10px}
.tl-item{display:flex;align-items:center;gap:12px;border:1px solid var(--border);background:var(--bg);border-radius:12px;padding:10px 14px;text-align:left;font-size:1.12rem}
.tl-item .n{flex:none;width:28px;height:28px;border-radius:50%;background:#fff;border:1px solid var(--border);display:grid;place-items:center;font-size:.85rem;font-weight:700}
.tl-item .tense{margin-left:auto;font-size:.8rem;font-weight:700;color:var(--amber-ink);background:var(--amber-light);padding:3px 9px;border-radius:7px;visibility:hidden}
.tl-item.on{background:#fff;border-color:var(--amber)}
.tl-item.on .tense{visibility:visible}
.tl-item.on .n{background:var(--amber);border-color:var(--amber)}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:#fff;box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{padding:12px 14px;text-align:left;vertical-align:top;border-bottom:1px solid var(--border);font-size:.93rem}
th{background:var(--teal-soft);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--teal-dark)}
tr:last-child td{border-bottom:0}
td.tname{font-weight:700;white-space:nowrap}
td.tname small{display:block;font-weight:400;color:var(--muted);white-space:normal;max-width:12em}
td.sig{color:var(--purple)}
tbody tr:hover{background:#fafcfc}
table.plain{min-width:0}

/* mcq / choice */
.q-list{display:grid;gap:10px;counter-reset:q}
.q-item{background:#fff;border:1px solid var(--border);border-radius:14px;padding:13px 16px;counter-increment:q}
.q-item .qtext{font-size:1.1rem;display:flex;gap:10px}
.q-item .qtext::before{content:counter(q);flex:none;width:26px;height:26px;border-radius:8px;background:var(--teal-light);color:var(--teal-dark);font-weight:700;font-size:.85rem;display:grid;place-items:center;margin-top:2px}
.opts{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 0 36px}
.opt{border:1px solid var(--border);background:var(--bg);border-radius:10px;padding:6px 13px;font-size:.95rem}
.opt:hover{border-color:#a9c6c8;background:#fff}
.opt.right{background:var(--green-light);border-color:var(--green);color:#11563a;font-weight:600}
.opt.wrong{background:var(--red-light);border-color:var(--red);color:#7a2a22;text-decoration:line-through}
body.show-answers .opt.is-ans{background:var(--green-light);border-color:var(--green);color:#11563a;font-weight:600}
.why{margin:8px 0 0 36px;font-size:.88rem;color:#11563a;display:none}
.q-item.answered .why,body.show-answers .why{display:block}
.why:empty{display:none!important}
.qtext>span:first-of-type{flex:1;min-width:0}
.peek-btn{flex:none;align-self:flex-start;border:1px solid #f2d9a4;background:var(--amber-light);color:var(--amber-ink);border-radius:9px;padding:4px 11px;font-size:.82rem;font-weight:700;white-space:nowrap}
.peek-btn:hover{border-color:var(--amber)}
.peek-btn[aria-pressed=true]{background:#fff;border-color:var(--border);color:var(--muted)}
body.show-answers .peek-btn{display:none}
.q-item.peek .why{display:block}
.q-item.peek .gap-ans{display:inline}
.q-item.peek .ans{display:block}
.q-item.peek .opt.is-ans{background:var(--green-light);border-color:var(--green);color:#11563a;font-weight:600}
.q-item.peek .opt.is-ans::after{content:" ✓"}
.q-item.ok{border-color:#9fd8bb}
.q-item.no{border-color:#eab2ab}

/* gap */
.gap-text{font-size:1.12rem;line-height:2.1}
.gap-in{border:0;border-bottom:2px solid #a9c4c7;background:var(--teal-soft);border-radius:6px 6px 0 0;padding:2px 8px;min-width:9ch;font-size:1.02rem;color:var(--teal-dark);font-weight:600}
.gap-in:focus{outline:none;border-bottom-color:var(--teal);background:#fff}
.gap-in.right{border-bottom-color:var(--green);background:var(--green-light)}
.gap-in.wrong{border-bottom-color:var(--red);background:var(--red-light)}
.gap-ans{display:none;color:var(--green);font-weight:700;font-size:.92rem;margin-left:4px}
body.show-answers .gap-ans,.q-item.answered .gap-ans{display:inline}
.ex-tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.score{font-weight:700;color:var(--teal-dark);font-size:.95rem}

/* fix */
.fix-wrong{font-size:1.12rem;color:#7a2a22}
.fix-wrong s{text-decoration-color:#c4473a88}
.fix-in{width:100%;margin-top:8px;border:1px solid var(--border);border-radius:10px;padding:9px 12px;font-size:1.02rem;background:var(--bg)}
.fix-in:focus{background:#fff;border-color:var(--teal);outline:none}
.fix-in.right{border-color:var(--green);background:var(--green-light)}
.fix-in.wrong{border-color:var(--amber);background:var(--amber-light)}

/* team game */
.team{display:grid;grid-template-columns:1fr 2.4fr 1fr;gap:16px;align-items:stretch}
.team-score{background:#fff;border:1px solid var(--border);border-radius:20px;padding:18px;text-align:center;display:flex;flex-direction:column;gap:8px;justify-content:center;box-shadow:var(--shadow)}
.team-score .tname{font-weight:800;letter-spacing:.1em;font-size:.8rem;text-transform:uppercase}
.team-score.a .tname{color:var(--teal)}
.team-score.b .tname{color:var(--purple)}
.team-score .pts{font-size:3.6rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.team-score.a .pts{color:var(--teal)}
.team-score.b .pts{color:var(--purple)}
.team-score .row{justify-content:center}
.game-card{background:var(--nav);color:#fff;border-radius:22px;padding:26px 30px;display:flex;flex-direction:column;gap:14px;min-height:260px}
.game-card .cnt{font-size:.78rem;letter-spacing:.14em;color:var(--mint);font-weight:700}
.game-card .wrong-s{font-size:1.9rem;font-weight:600;line-height:1.25}
.game-card .right-s{font-size:1.5rem;color:var(--mint);font-weight:700;display:none}
.game-card .right-s small{display:block;font-size:.95rem;color:#c5d6da;font-weight:400;margin-top:4px}
.game-card.open .right-s,body.show-answers .game-card .right-s{display:block}
.game-card .row{margin-top:auto}
.game-card .btn{background:#ffffff14;border-color:#ffffff2a;color:#fff}
.game-card .btn.primary{background:var(--mint);border-color:var(--mint);color:#13362b}
.plain-list{display:grid;gap:10px}
.plain-item{background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px 18px}
.plain-item .w{font-size:1.25rem;color:#7a2a22}
.plain-item .r{font-size:1.2rem;color:#11563a;font-weight:700}

/* reading */
.reading{display:grid;grid-template-columns:1.7fr 1fr;gap:18px;align-items:start}
.paper{background:#fffdf8;border:1px solid #ece4d3;border-radius:20px;padding:28px 32px;box-shadow:var(--shadow)}
.paper h2{font-family:Georgia,'Times New Roman',serif;font-size:1.8rem;margin:0 0 2px}
.paper .byline{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.paper p{font-family:Georgia,'Times New Roman',serif;font-size:1.2rem;line-height:1.75;margin:0 0 14px}
.mw{cursor:pointer;border-radius:5px;padding:0 2px;border-bottom:2px dotted #b9c7ca;transition:background .15s}
.mw:hover{background:#eef3f3}
.mw.m-teal,.legend .m-teal{background:#cdeedf;border-bottom:2px solid var(--teal)}
.mw.m-amber,.legend .m-amber{background:#fbe4b5;border-bottom:2px solid #d79a26}
.mw.m-purple,.legend .m-purple{background:#e1dbf7;border-bottom:2px solid var(--purple)}
.mw.bad{outline:2px solid var(--red);outline-offset:1px}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.legend span{padding:3px 10px;border-radius:7px;font-size:.85rem;font-weight:600}
.side-stack{display:grid;gap:14px}
.colbox{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.colbox .col{background:#fff;border:1px solid var(--border);border-radius:14px;padding:12px}
.colbox .col h4{margin:0 0 8px;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase}
.colbox ul{margin:0;padding-left:18px;font-size:.92rem}
.colbox .empty{color:var(--muted);font-size:.85rem;font-style:italic}
.qa{display:grid;gap:8px}
.qa-item{background:#fff;border:1px solid var(--border);border-radius:12px;padding:10px 14px}
.qa-item .qq{font-weight:600}
.note{font-size:.88rem;color:var(--muted);margin-top:6px}

/* uses box */
.uses{display:grid;gap:10px}
.use-row{display:grid;grid-template-columns:130px 1fr 1.25fr;gap:14px;align-items:center;background:#fff;border:1px solid var(--border);border-radius:14px;padding:13px 16px}
.use-side{font-weight:800;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;border-radius:8px;padding:6px 10px;text-align:center}
.use-side.s0{background:var(--teal-light);color:var(--teal-dark)}
.use-side.s1{background:var(--amber-light);color:var(--amber-ink)}
.use-row .u{font-weight:600;font-size:1.06rem}
.use-row .u small{display:block;color:var(--purple);font-weight:500;font-size:.92rem}
.use-ex{font-size:1.06rem}
.use-ex .ans{font-family:Georgia,serif}
.form-card h3{display:flex;align-items:center;gap:8px}
.form-row{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:1.02rem}
.form-row:last-child{border:0}
.sign{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-weight:800;background:var(--bg)}
.spell-row{display:grid;grid-template-columns:1.3fr 1fr;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);font-size:.95rem}
.spell-row:last-child{border:0}
.spell-row span:last-child{color:var(--purple)}

/* tr trap */
.trap{display:grid;gap:10px}
.trap-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;background:#fff;border:1px solid var(--border);border-radius:14px;padding:13px 16px;align-items:center;font-size:1.04rem}
.trap-row .trs{color:var(--purple);font-weight:500}
.trap-row .wr{color:#9b3a30;text-decoration:line-through;text-decoration-color:#c4473a99}
.trap-row .rt{color:#11563a;font-weight:600}
.trap-head{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;padding:0 16px;font-size:.72rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

.two-cols .col-card h3{font-size:.8rem;letter-spacing:.1em;text-transform:uppercase}
.col-card.c0 h3{color:var(--teal)}
.col-card.c1 h3{color:var(--amber-ink)}
.col-card ul{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:7px}
.col-card li{background:var(--bg);border-radius:9px;padding:5px 11px;font-size:.98rem}
.col-card.c0 li{background:var(--teal-light)}
.col-card.c1 li{background:var(--amber-light)}
.col-card.list li{display:block;width:100%;background:var(--bg)}

.contrast-item{background:#fff;border:1px solid var(--border);border-radius:16px;padding:16px 18px}
.contrast-pair{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;font-size:1.18rem;font-weight:600}
.contrast-pair .vs{font-size:.75rem;font-weight:800;color:var(--muted);background:var(--bg);border-radius:6px;padding:3px 7px}

.ccq{display:grid;gap:8px}
.ccq-item{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid var(--border);border-radius:12px;padding:11px 15px;font-size:1.05rem}
.ccq-item .tagq{font-size:.68rem;font-weight:800;letter-spacing:.1em;color:#fff;background:var(--purple);border-radius:6px;padding:3px 7px}
.ccq-item .ans{color:var(--green);font-weight:700}

/* big question */
.bigq{background:var(--nav);color:#fff;border-radius:24px;padding:34px;text-align:center}
.bigq .s{font-size:clamp(1.8rem,4vw,2.8rem);font-weight:700;font-family:Georgia,serif}
.bigq .ans{margin-top:16px;font-size:1.4rem;color:var(--mint)}
.bigq .ans small{display:block;color:#c5d6da;font-size:1rem;margin-top:6px}
.bigq .btn{margin-top:18px;background:#ffffff14;border-color:#ffffff2a;color:#fff}
.bigq.open .btn{display:none}

.vgroup h3{display:flex;justify-content:space-between;align-items:baseline}
.vgroup h3 small{color:var(--purple);font-weight:500;font-size:.85rem}
.vgroup .chips{margin:6px 0 10px}
.vgroup .chip{background:var(--teal-soft);border-color:#cfeadc;font-weight:600}
.vgroup .ex{font-size:.92rem;color:var(--muted)}

/* used to hero */
.ut-hero{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}
.ut-visual{background:#fff;border:1px solid var(--border);border-radius:22px;padding:24px;box-shadow:var(--shadow)}
.ut-bar{display:grid;grid-template-columns:3fr 1fr;align-items:end;gap:0;margin:16px 0 6px}
.ut-past{height:46px;background:repeating-linear-gradient(90deg,var(--purple) 0 18px,transparent 18px 28px);border-radius:8px 0 0 8px;opacity:.85}
.ut-nowcell{height:46px;border-left:4px solid var(--red);display:flex;align-items:center;justify-content:center;font-size:1.6rem;color:var(--red);font-weight:800}
.ut-lbls{display:grid;grid-template-columns:3fr 1fr;font-size:.75rem;font-weight:800;letter-spacing:.12em;color:var(--muted)}
.ut-lbls span:last-child{text-align:center;color:var(--red)}
.ut-sent{font-size:1.7rem;font-weight:700;margin-top:14px;font-family:Georgia,serif}
.ut-sent b{color:var(--purple)}
.ut-tr{color:var(--purple);font-size:1.05rem}
.ut-def{background:var(--purple);color:#fff;border-radius:22px;padding:26px}
.ut-def p{margin:0 0 10px;font-size:1.15rem}
.ut-def .big{font-size:1.5rem;font-weight:700}
.ft-row{display:grid;grid-template-columns:44px 1.3fr 1.5fr;gap:14px;align-items:center;background:#fff;border:1px solid var(--border);border-radius:14px;padding:12px 16px;font-size:1.12rem}
.ft-row .note-c{font-size:.92rem;color:var(--purple)}
.ft-row .sign{background:var(--purple-light);color:var(--purple)}

/* phrases & zero */
.phrase-card h3{font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--teal);display:flex;justify-content:space-between}
.phrase-card h3 small{text-transform:none;letter-spacing:0;color:var(--purple);font-weight:500}
.phrase-card ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.phrase-card li{background:var(--bg);border-radius:9px;padding:7px 11px;font-size:1.02rem}
.zero{background:var(--nav);color:#fff;border-radius:22px;padding:26px 28px;display:grid;gap:14px}
.formula{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:1.25rem;font-weight:700}
.formula span{background:#ffffff14;border-radius:10px;padding:7px 13px}
.formula span.k{background:var(--mint);color:#13362b}
.zero ul{margin:0;padding-left:20px;font-size:1.1rem;line-height:1.7}
.zero .z-note{color:#b9cdd2;font-size:.92rem}

/* dialogue */
.dlg{display:grid;gap:10px}
.line{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.avatar{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-weight:800;color:#fff;font-size:.9rem}
.bubble{background:#fff;border:1px solid var(--border);border-radius:4px 16px 16px 16px;padding:10px 15px;font-size:1.1rem}
.bubble .who{font-size:.74rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:block}
.bubble.speaking{border-color:var(--teal);box-shadow:0 0 0 3px #087c7022}

/* card draw */
.deck-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.deck-tab{border:1px solid var(--border);background:#fff;border-radius:11px;padding:8px 14px;font-weight:600}
.deck-tab.active{background:var(--nav);color:#fff;border-color:var(--nav)}
.draw{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}
.draw-card{min-height:300px;border-radius:24px;padding:30px 34px;color:#fff;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden;background:linear-gradient(140deg,#0b6e64,#174b57)}
.draw-card.life{background:linear-gradient(140deg,#5a48b0,#2b3e6b)}
.draw-card::after{content:"";position:absolute;right:-60px;bottom:-60px;width:220px;height:220px;border-radius:50%;background:#ffffff10}
.draw-card .dc-cat{font-size:.78rem;letter-spacing:.14em;font-weight:800;text-transform:uppercase;color:#bff0dc}
.draw-card .dc-en{font-size:clamp(1.5rem,3vw,2.2rem);font-weight:700;line-height:1.25}
.draw-card .dc-tr{color:#d7e6ea;font-size:1.05rem}
.draw-card .dc-empty{font-size:1.3rem;color:#d7e6ea;margin:auto 0}
.draw-card.flip{animation:flip .45s ease}
@keyframes flip{from{transform:rotateY(80deg);opacity:.3}to{transform:none;opacity:1}}
.prompts{display:grid;gap:8px}
.prompts li{list-style:none;background:#fff;border:1px solid var(--border);border-radius:12px;padding:11px 14px;font-size:1.05rem}
.prompts{margin:0;padding:0}

/* then now table */
.tn-table td{vertical-align:middle}
.tn-in{width:100%;border:1px solid var(--border);border-radius:9px;padding:8px 10px;background:var(--bg);font-size:.98rem}
.tn-in:focus{background:#fff;border-color:var(--teal);outline:none}
.tn-topic{font-weight:700}
.tn-topic small{display:block;color:var(--purple);font-weight:500}

/* interview */
.iv-card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:16px 18px;display:grid;gap:8px}
.iv-card .topic{font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--muted)}
.iv-q{display:flex;gap:10px;align-items:flex-start;font-size:1.06rem}
.iv-q i{font-style:normal;flex:none;font-size:.68rem;font-weight:800;border-radius:6px;padding:3px 7px;margin-top:3px;letter-spacing:.05em}
.iv-q.a i{background:var(--teal-light);color:var(--teal-dark)}
.iv-q.b i{background:var(--amber-light);color:var(--amber-ink)}
.model{background:var(--teal-soft);border:1px solid #cfeadc;border-radius:16px;padding:16px 20px;font-size:1.12rem}
.model .label{display:block;margin-bottom:4px}

/* exit ticket & writer */
.et-item{background:#fff;border:1px solid var(--border);border-radius:16px;padding:16px 18px}
.et-item textarea,.writer textarea{width:100%;border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:var(--bg);font-size:1.02rem;resize:vertical}
.et-item textarea:focus,.writer textarea:focus{background:#fff;border-color:var(--teal);outline:none}
.writer{display:grid;grid-template-columns:1.8fr 1fr;gap:16px}
.writer textarea{min-height:300px;line-height:1.6}
.checks{display:grid;gap:8px;align-content:start}
.check{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--border);border-radius:12px;padding:10px 13px;font-size:.95rem}
.check .dot{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid #b9c7ca;display:grid;place-items:center;font-size:.75rem;color:#fff}
.check.ok{border-color:#a7dcc0;background:var(--green-light)}
.check.ok .dot{background:var(--green);border-color:var(--green)}
.wc{font-size:2.4rem;font-weight:800;color:var(--teal);font-variant-numeric:tabular-nums;line-height:1}
.planner .card h3{color:var(--teal)}
.planner .card p{margin:0;font-size:1rem}

/* home */
.hero{display:grid;grid-template-columns:1.1fr 1fr;border-radius:24px;overflow:hidden;border:1px solid #cfe8dc;background:var(--teal-light);box-shadow:var(--shadow);margin-top:22px}
.hero-text{padding:36px 38px;display:flex;flex-direction:column;gap:12px;justify-content:center}
.hero-text .tagline{align-self:flex-start;border:1px solid #b7dcc9;background:#fff;border-radius:8px;padding:5px 10px;font-size:.74rem;font-weight:700;letter-spacing:.06em}
.hero-text h2{font-size:clamp(2rem,4vw,3rem);line-height:1.08;margin:0}
.hero-text p{margin:0;color:#3f5862;font-size:1.12rem}
.hero-img{min-height:320px;background-size:cover;background-position:center}
.block-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:20px 22px;box-shadow:var(--shadow);text-align:left;display:flex;flex-direction:column;gap:6px}
.block-card:hover{border-color:#b6d6cf}
.block-card .bn{font-size:.8rem;font-weight:800;color:var(--teal);letter-spacing:.08em}
.block-card h3{font-size:1.2rem;margin:0}
.block-card p{margin:0;font-size:.9rem;color:var(--muted)}
.block-card ul{margin:6px 0 0;padding-left:18px;font-size:.86rem;color:var(--ink)}
.outcomes{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.outcomes li{display:flex;gap:10px;background:#fff;border:1px solid var(--border);border-radius:12px;padding:10px 14px}
.outcomes li::before{content:"✓";color:var(--teal);font-weight:800}
.shortcuts{display:flex;flex-wrap:wrap;gap:8px;font-size:.85rem;color:var(--muted)}
kbd{background:#fff;border:1px solid var(--border);border-bottom-width:2px;border-radius:6px;padding:1px 7px;font-family:inherit;font-size:.8rem}

/* break */
.break{display:grid;grid-template-columns:1fr 1fr;border-radius:26px;overflow:hidden;background:var(--nav);color:#fff;margin-top:22px;min-height:420px}
.break-img{background-size:cover;background-position:center}
.break-text{padding:40px;display:flex;flex-direction:column;justify-content:center;gap:14px}
.break-text .big{font-size:5rem;font-weight:800;color:var(--mint);line-height:1;font-variant-numeric:tabular-nums}
.break-text h2{font-size:2.4rem;margin:0}
.break-text p{color:#c5d6da;margin:0;font-size:1.15rem}

/* vocab */
.vtools{background:var(--teal-light);border-radius:var(--radius);padding:18px 20px;display:grid;grid-template-columns:1.4fr 1fr auto;gap:14px;align-items:end}
.vtools label{display:grid;gap:6px;font-weight:600;font-size:.9rem}
.vtools input,.vtools select{border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:#fff}
.vcard{background:#fff;border:1px solid var(--border);border-radius:16px;padding:14px 18px;display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.vcard .vcat{font-size:.7rem;font-weight:700;letter-spacing:.06em;color:var(--teal);grid-column:1/-1}
.vcard .vw{font-size:1.3rem;font-weight:700}
.vcard .vm{grid-column:1/-1;display:none;color:var(--purple);font-weight:600}
.vcard .vex{grid-column:1/-1;display:none;color:var(--muted);font-size:.92rem;font-style:italic}
.vcard.open .vm,.vcard.open .vex,.vlist.all .vm,.vlist.all .vex{display:block}

/* plan */
.plan-table td:first-child,.plan-table td:nth-child(2){white-space:nowrap}
.plan-table tr.brk td{background:var(--amber-light);color:var(--amber-ink);font-weight:600}
.plan-table tr.ext td{color:var(--muted)}
.plan-table .go{border:0;background:none;color:var(--teal);font-weight:600;text-align:left;padding:0}

/* bottom bar */
.bottombar{position:fixed;left:var(--side);right:0;bottom:0;z-index:30;background:var(--nav);color:#fff;display:flex;align-items:center;gap:12px;padding:12px 24px calc(12px + env(safe-area-inset-bottom,0px));min-height:var(--bar)}
.bb-btn{border:1px solid #ffffff2e;background:transparent;color:#fff;border-radius:11px;padding:9px 14px;font-weight:600;font-size:.9rem;white-space:nowrap}
.bb-btn:hover{background:#ffffff10}
.bb-btn.mint{background:var(--mint);border-color:var(--mint);color:#13362b}
.bb-btn.mint[aria-pressed=true]{background:#fff;border-color:#fff}
.bb-select{background:var(--nav-2);color:#fff;border:1px solid #ffffff2e;border-radius:11px;padding:9px 12px;max-width:320px;min-width:0;flex:1 1 200px}
.timer{display:flex;align-items:center;gap:8px;margin-left:auto}
.timer-display{font-size:1.6rem;font-weight:800;font-variant-numeric:tabular-nums;min-width:4.2ch;text-align:right}
.timer-display.low{color:var(--amber)}
.timer-display.done{color:#ff8a7a;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.counter{font-variant-numeric:tabular-nums;color:#c5d6da;font-size:.9rem;min-width:4.5ch;text-align:center}
.nav-arrows{display:flex;gap:8px;align-items:center}
.bb-arrow{width:42px;height:40px;border-radius:11px;border:1px solid #ffffff2e;background:transparent;color:#fff;font-size:1.2rem;font-weight:700}
.bb-arrow.next{background:var(--mint);border-color:var(--mint);color:#13362b}

.toast{position:fixed;left:50%;bottom:calc(var(--bar) + 18px);transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;font-size:.92rem;opacity:0;pointer-events:none;transition:.25s;z-index:60}
.toast.show{opacity:1;transform:translateX(-50%)}
.page-footer{max-width:1180px;margin:30px auto 0;padding:0 32px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}

/* projector: hide sidebar, bigger */
body.proj .sidebar{transform:translateX(-100%)}
body.proj .workspace{margin-left:0}
body.proj .bottombar{left:0}
body.proj main{max-width:1400px}
body.proj .menu-toggle{display:grid}
body.proj.nav-open .sidebar{transform:none}

/* responsive */
@media (max-width:1100px){
  .reading,.writer,.draw,.test-board,.ut-hero{grid-template-columns:1fr}
  .team{grid-template-columns:1fr 1fr}
  .team .game-card{grid-column:1/-1;order:-1}
}
@media (max-width:900px){
  .sidebar{transform:translateX(-100%)}
  body.nav-open .sidebar{transform:none}
  .workspace{margin-left:0}
  .bottombar{left:0;flex-wrap:wrap;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
  .workspace{padding-bottom:150px}
  .menu-toggle{display:grid}
  .hero,.break{grid-template-columns:1fr}
  .hero-img{min-height:200px}
  .use-row,.trap-row,.ft-row{grid-template-columns:1fr}
  .trap-head{display:none}
  .golden{grid-template-columns:1fr}
  .vtools{grid-template-columns:1fr}
  .top-label{display:none}
  .bb-select{order:5;max-width:none;flex-basis:100%}
  .timer{margin-left:0}
}
@media (max-width:560px){
  main{padding:22px 16px}
  .topbar{padding:10px 16px}
  .pill{padding:6px 9px;font-size:.78rem}
  .pill span{display:none}
  .lead{font-size:1.12rem}
  .paper{padding:20px}
  .paper p{font-size:1.06rem}
  .opts,.why{margin-left:0}
  .colbox{grid-template-columns:1fr}
  .contrast-pair{grid-template-columns:1fr}
  .team{grid-template-columns:1fr}
  .bb-btn{padding:8px 10px;font-size:.82rem}
  .timer-display{font-size:1.3rem}
}

@media print{
  .sidebar,.topbar,.bottombar,.toast,.page-footer,.btn,.reveal-btn,.ex-tools{display:none!important}
  .workspace{margin:0;padding:0}
  main{max-width:none;padding:0}
  .card,.q-item,.prompt-card{box-shadow:none;break-inside:avoid}
  body{background:#fff}
}

<script>/* B1 · Day 02 · lesson app */
(function () {
  const S = LESSON.screens;
  const EXTRA = new Set(["mistake-game", "extra2", "extra3", "supQuiz"]);
  const KEY = "b1-day2-2026-10-06";
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const strip = s => String(s).replace(/<[^>]+>/g, "").replace(/\{\w\|([^}]+)\}/g, "$1");

  /* ── state ── */
  let st = { idx: -1, tr: false, teacher: false, proj: false, visited: {}, inputs: {}, choices: {}, marks: {}, sorts: {}, scores: { a: 0, b: 0 }, game: {}, deck: {} };
  try { const raw = localStorage.getItem(KEY); if (raw) st = Object.assign(st, JSON.parse(raw)); } catch (e) {}
  let saveT;
  function save() { clearTimeout(saveT); saveT = setTimeout(() => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }, 150); }

  function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("show"), 1800); }

  /* ── normalisation for answer checking ── */
  function norm(s) {
    s = String(s).toLowerCase().replace(/[’‘`´]/g, "'").replace(/[.,!?;:"“”]/g, " ");
    s = s.replace(/\bcan't\b/g, "can not").replace(/\bwon't\b/g, "will not").replace(/n't\b/g, " not")
      .replace(/'m\b/g, " am").replace(/'re\b/g, " are").replace(/'ve\b/g, " have").replace(/'s\b/g, " is").replace(/'ll\b/g, " will");
    return s.replace(/\s+/g, " ").trim();
  }
  const accepts = (val, alts) => alts.split("|").some(a => norm(a) === norm(val));

  /* ── speech ── */
  const synth = window.speechSynthesis;
  let voices = [];
  function loadVoices() { try { voices = synth ? synth.getVoices().filter(v => /^en/i.test(v.lang)) : []; } catch (e) { voices = []; } }
  if (synth) { loadVoices(); synth.onvoiceschanged = loadVoices; }
  function pickVoice(i = 0) { if (!voices.length) return null; const gb = voices.filter(v => /GB/i.test(v.lang)); const pool = gb.length > 1 ? gb : voices; return pool[i % pool.length]; }
  function speak(parts, btn, onLine) {
    if (!synth) { toast("Bu tarayıcı sesli okumayı desteklemiyor."); return; }
    if (synth.speaking) { synth.cancel(); if (btn) btn.textContent = btn.dataset.label; return; }
    const list = Array.isArray(parts) ? parts : [{ text: parts }];
    list.forEach((p, i) => {
      const u = new SpeechSynthesisUtterance(p.text);
      u.lang = "en-GB"; u.rate = 0.88; const v = pickVoice(p.voice || 0); if (v) u.voice = v; if (p.pitch) u.pitch = p.pitch;
      u.onstart = () => onLine && onLine(i);
      if (i === list.length - 1) u.onend = () => { if (btn) btn.textContent = btn.dataset.label; onLine && onLine(-1); };
      synth.speak(u);
    });
    if (btn) btn.textContent = "■ Durdur";
  }

  /* ── sidebar ── */
  function screenNum(i) { return String(i + 1).padStart(2, "0"); }
  function buildNav() {
    const nav = $("#lesson-nav"); let html = ""; let curBlock = null;
    S.forEach((s, i) => {
      const b = s.block;
      if (b !== curBlock) {
        curBlock = b;
        if (b > 0) { const bl = LESSON.blocks[b - 1]; html += `<div class="nav-group"><span>Block ${b} · ${esc(bl.title)}</span></div>`; }
        else html += `<div class="nav-group"><span>Resources</span></div>`;
      }
      const cls = ["nav-btn"]; if (s.type === "break") cls.push("brk"); if (EXTRA.has(s.id)) cls.push("extra");
      const num = s.type === "break" ? "☕" : (b === 0 ? "▤" : screenNum(i));
      html += `<button class="${cls.join(" ")}" data-i="${i}"><span class="nav-num">${num}</span><span>${esc(s.title)}</span>${s.min ? `<span class="nav-min">${s.min}′</span>` : ""}</button>`;
    });
    nav.innerHTML = html;
    const sel = $("#screen-select");
    sel.innerHTML = `<option value="-1">Ders akışı · Overview</option>` + S.map((s, i) => `<option value="${i}">${s.type === "break" ? "☕" : screenNum(i)} · ${esc(s.title)}</option>`).join("");
  }
  function updateNav() {
    $$(".nav-btn[data-i]").forEach(b => { const i = +b.dataset.i; b.classList.toggle("active", i === st.idx); b.classList.toggle("done", !!st.visited[S[i].id]); });
    $$(".home-nav").forEach(b => b.classList.toggle("active", st.idx === -1));
    $("#screen-select").value = st.idx;
    const core = S.filter(s => s.block > 0 && s.type !== "break");
    const done = core.filter(s => st.visited[s.id]).length;
    $("#progress-count").textContent = `${done} / ${core.length}`;
    $("#progress-fill").style.width = (done / core.length * 100) + "%";
    $("#counter").textContent = st.idx < 0 ? "—" : `${st.idx + 1} / ${S.length}`;
  }

  /* ── go ── */
  function go(i, push = true) {
    i = Math.max(-1, Math.min(S.length - 1, i));
    if (synth && synth.speaking) synth.cancel();
    st.idx = i;
    if (i >= 0) st.visited[S[i].id] = true;
    document.body.classList.remove("show-answers"); $("#ans-btn").setAttribute("aria-pressed", "false"); $("#ans-btn").textContent = "Cevapları göster";
    render(); updateNav(); save();
    if (!timer.running) timer.set(i >= 0 && S[i].min ? S[i].min * 60 : 300);
    if (push) { try { history.replaceState(null, "", "#" + (i >= 0 ? S[i].id : "home")); } catch (e) {} }
    window.scrollTo({ top: 0 }); $("#main").focus({ preventScroll: true });
    document.body.classList.remove("nav-open");
  }

  /* ── render ── */
  function header(s) {
    const badges = [];
    if (s.mode) badges.push(`<span class="badge">${esc(s.mode)}</span>`);
    if (s.min) badges.push(`<span class="badge gray">${s.min} min</span>`);
    if (s.material) badges.push(`<span class="badge gray">${esc(s.material)}</span>`);
    if (EXTRA.has(s.id)) badges.push(`<span class="badge amber">Ek / yedek</span>`);
    if (s.id === "interview") badges.push(`<span class="badge amber">kısaltılabilir</span>`);
    const stages = (s.stages || []).map(([t, m]) => `<span class="stage"><b>${m ? m + "′" : "·"}</b>${esc(t)}</span>`).join("");
    return `<p class="kicker">${esc(s.kicker || "")}</p>
      <div class="screen-head"><div><h1>${esc(s.title)}</h1>${s.titleTR ? `<p class="title-tr">${esc(s.titleTR)}</p>` : ""}</div><div class="badges">${badges.join("")}</div></div>
      ${s.lead ? `<p class="lead">${s.lead}</p>` : ""}${s.leadTR ? `<p class="lead-tr tr"><span class="tr-badge">TR</span>${s.leadTR}</p>` : ""}
      ${(s.teacher && s.teacher.length) || stages ? `<aside class="teacher-panel"><h4>Teacher notes · Öğretmen notları</h4>${stages ? `<div class="stages">${stages}</div>` : ""}<ul>${(s.teacher || []).map(t => `<li>${t}</li>`).join("")}</ul></aside>` : ""}`;
  }
  function secTitle(o, fallback) {
    const t = o.title || fallback; if (!t) return "";
    return `<div class="sec-title"><h2>${t}</h2>${o.titleTR ? `<span class="tr">${o.titleTR}</span>` : ""}</div>`;
  }

  function render() {
    const m = $("#main");
    if (st.idx < 0) { m.innerHTML = renderHome(); bindHome(m); return; }
    const s = S[st.idx];
    if (s.type === "break") { m.innerHTML = renderBreak(s); return; }
    if (s.type === "vocab") { m.innerHTML = header(s) + renderVocab(); bindVocab(m); return; }
    if (s.type === "plan") { m.innerHTML = header(s) + renderPlan(); bindPlan(m); return; }
    let html = header(s);
    s.sections.forEach((sec, k) => { const fn = R[sec.type]; html += `<section class="sec" data-k="${k}">${fn ? fn(sec, s, k) : ""}</section>`; });
    html += `<div class="row" style="margin-top:34px">${st.idx > 0 ? `<button class="btn" data-go="${st.idx - 1}">← ${esc(S[st.idx - 1].title)}</button>` : ""}<span class="spacer"></span>${st.idx < S.length - 1 ? `<button class="btn primary" data-go="${st.idx + 1}">${esc(S[st.idx + 1].title)} →</button>` : ""}</div>`;
    m.innerHTML = html;
    s.sections.forEach((sec, k) => { const b = B[sec.type]; if (b) b($(`section[data-k="${k}"]`, m), sec, s, k); });
    bindCommon(m);
  }

  function bindCommon(root) {
    $$("[data-reveal]", root).forEach(btn => btn.addEventListener("click", () => {
      const host = btn.closest("[data-host]") || btn.parentElement; host.classList.toggle("open");
      btn.textContent = host.classList.contains("open") ? (btn.dataset.hide || "Gizle") : btn.dataset.label;
    }));
    $$("[data-go]", root).forEach(b => b.addEventListener("click", () => go(+b.dataset.go)));
    $$("[data-peek]", root).forEach(b => b.addEventListener("click", () => {
      const q = b.closest(".q-item"); const on = q.classList.toggle("peek");
      b.textContent = on ? "Gizle" : "💡 Cevap"; b.setAttribute("aria-pressed", on);
    }));
  }
  const revealBtn = (label = "Cevabı göster", hide = "Gizle") => `<button class="reveal-btn" data-reveal data-label="${label}" data-hide="${hide}">${label}</button>`;
  const peekBtn = `<button class="peek-btn" data-peek title="Bu sorunun cevabını göster">💡 Cevap</button>`;
  const key = (s, k, i, j = 0) => `${s.id}.${k}.${i}.${j}`;

  /* ── section renderers ── */
  const R = {}, B = {};

  R.promptCards = (o) => `${secTitle(o)}<div class="grid ${o.small ? "g3" : "g2"}">${o.cards.map((c, i) => `
    <div class="prompt-card ${o.small ? "small" : ""}" data-host><span class="num">${String(i + 1).padStart(2, "0")}</span><div class="q">${c.en}</div>${c.tr ? `<div class="tr muted">${c.tr}</div>` : ""}
    <div class="foot"><span class="ans tag">${c.ans}</span>${revealBtn(o.reveal || "Show")}</div></div>`).join("")}</div>`;

  R.golden = (o) => `${secTitle(o)}<div class="golden"><div class="bad"><b>✗ Too short</b>${o.short}</div><div class="good"><b>✓ Longer + throw it back</b>${o.long}</div></div>`;

      dc.innerHTML = c ? `<span class="dc-cat">${dk.name} · ${used.length} / ${dk.cards.length}</span><div class="dc-en">${c.en}</div><div class="dc-tr tr">${c.tr}</div>`

  /* sort */
  R.sort = (o) => `${secTitle(o)}<div class="card"><div class="chips" data-pool style="min-height:44px"></div>

    <div class="ex-tools"><button class="btn primary small" data-check>Kontrol et</button><button class="btn small" data-solve>Cevapları yerleştir</button><span class="score" data-score></span><button class="btn small ghost" data-clear>Temizle</button></div></div>`;
  B.sort = (el, o) => {
    const pl = st.sorts[o.id] = st.sorts[o.id] || {}; let sel = null, checked = false;
    const chip = (i, extra = "") => `<button class="chip ${extra}" data-c="${i}" style="cursor:pointer;${sel === i ? "outline:3px solid var(--amber);" : ""}">${o.items[i][0]}</button>`;
    const paint = () => {
      $("[data-pool]", el).innerHTML = o.items.map((_, i) => pl[i] === undefined ? chip(i) : "").join("") || `<span class="muted">Tüm kartlar yerleşti ✓</span>`;
      o.buckets.forEach((_, b) => { $(`[data-in="${b}"]`, el).innerHTML = o.items.map((it, i) => pl[i] === b ? `<li style="padding:0;background:none">${chip(i, checked ? (it[1] === b ? "ok-c" : "no-c") : "")}</li>` : "").join(""); });
      $$(".ok-c", el).forEach(c => { c.style.background = "var(--green-light)"; c.style.borderColor = "var(--green)"; });
      $$(".no-c", el).forEach(c => { c.style.background = "var(--red-light)"; c.style.borderColor = "var(--red)"; });
      $$("[data-c]", el).forEach(c => c.addEventListener("click", e => { e.stopPropagation(); const i = +c.dataset.c; if (pl[i] !== undefined && sel !== i) { delete pl[i]; checked = false; save(); } sel = sel === i ? null : (pl[i] === undefined ? i : null); paint(); }));
    };
    $$("[data-bucket]", el).forEach(b => { const put = () => { if (sel === null) return; pl[sel] = +b.dataset.bucket; sel = null; checked = false; save(); paint(); }; b.addEventListener("click", put); b.addEventListener("keydown", e => { if (e.key === "Enter") put(); }); });
    $("[data-check]", el).addEventListener("click", () => { checked = true; const n = Object.keys(pl).length, ok = o.items.filter((it, i) => pl[i] === it[1]).length; $("[data-score]", el).textContent = `${ok} / ${o.items.length} doğru${n < o.items.length ? ` · ${o.items.length - n} kart bekliyor` : ""}`; paint(); });
    $("[data-solve]", el).addEventListener("click", () => { o.items.forEach((it, i) => pl[i] = it[1]); checked = true; save(); paint(); });
    $("[data-clear]", el).addEventListener("click", () => { Object.keys(pl).forEach(x => delete pl[x]); checked = false; $("[data-score]", el).textContent = ""; save(); paint(); });
    paint();

  R.interview = (o) => `<div class="grid g2">${o.pairs.map(p => `<div class="iv-card"><span class="topic">${p.topic}</span><div class="iv-q a"><i>USUALLY</i><span>${p.a}</span></div><div class="iv-q b"><i>THESE DAYS</i><span>${p.b}</span></div></div>`).join("")}</div>`;

  R.thenNowTable = (o, s, k) => `<div class="tbl-wrap"><table class="tn-table"><thead><tr><th style="width:18%">Topic</th><th>When I was young, I used to …</th><th>Now I … / These days I'm …</th></tr></thead><tbody>
    ${o.rows.map((r, i) => { const [a, b] = r.eg.split(" → "); return `<tr><td class="tn-topic">${r.topic}<small>${r.tr}</small></td><td><input class="tn-in" data-id="${key(s, k, i, 0)}" placeholder="e.g. ${esc(a)}" value="${esc(st.inputs[key(s, k, i, 0)] || "")}"></td><td><input class="tn-in" data-id="${key(s, k, i, 1)}" placeholder="e.g. ${esc(b)}" value="${esc(st.inputs[key(s, k, i, 1)] || "")}"></td></tr>`; }).join("")}</tbody></table></div>

  B.exitTicket = (el) => $$("textarea", el).forEach(t => t.addEventListener("input", () => { st.inputs[t.dataset.id] = t.value; save(); }));

  R.writer = (o, s, k) => `<div class="writer"><div><textarea data-id="${key(s, k, 0)}" placeholder="When I was young, I used to …">${esc(st.inputs[key(s, k, 0)] || "")}</textarea>
      <div class="ex-tools"><button class="btn small" data-dl>⬇ Çalışmamı indir (.txt)</button><span class="muted" style="font-size:.85rem">Yazınız bu cihazda otomatik kaydedilir.</span></div></div>
    <div class="checks"><div class="card" style="padding:14px 16px"><span class="label">Words</span><div class="wc" data-wc>0</div><small class="muted">Hedef: 100–120</small></div>
      <div class="check" data-ck="wc"><span class="dot">✓</span>100–120 words</div>

  B.writer = (el) => {
    const ta = $("textarea", el);

      const v = ta.value, n = (v.trim().match(/[A-Za-zÀ-ÿ'’-]+/g) || []).length;

      set("ut", /\bused to\b|\buse to\b/i.test(v));
      set("ps", /\b(usually|always|often|never|sometimes|every\s+\w+|on\s+(mondays|tuesdays|wednesdays|thursdays|fridays|saturdays|sundays))\b/i.test(v));
      set("pc", /\b(am|is|are|'m|'s|'re|’m|’s|’re)\s+(not\s+)?\w{2,}ing\b/i.test(v));
      set("op", /\b(i think|in my opinion|i believe|personally)\b/i.test(v));
      set("bad", v.trim().length > 0 && !/didn'?t\s+used\s+to|did\s+not\s+used\s+to/i.test(v));

  function bindPlan(m) {

    $("#reset-all", m).addEventListener("click", e => {
      if (!armed) { armed = true; e.target.textContent = "Emin misiniz? Tekrar tıklayın"; setTimeout(() => { armed = false; e.target.textContent = "Tüm kayıtları sıfırla"; }, 3000); return; }
      st.inputs = {}; st.choices = {}; st.marks = {}; st.sorts = {}; st.scores = { a: 0, b: 0 }; st.game = {}; st.deck = {}; st.visited = {}; save(); updateNav(); toast("Tüm kayıtlar sıfırlandı"); e.target.textContent = "Tüm kayıtları sıfırla"; armed = false;
    });
  }

  function downloadWork() {
    const lines = [`${LESSON.meta.school}`, `B1 · ${LESSON.meta.day} · ${LESSON.meta.date} · ${LESSON.meta.title}`, ""];
    S.forEach(s => {
      const own = Object.keys(st.inputs).filter(k => k.startsWith(s.id + ".") && st.inputs[k] && st.inputs[k].trim());
      if (!own.length) return;
      lines.push(`## ${s.title}`); own.forEach(k => lines.push("- " + st.inputs[k].trim())); lines.push("");
    });
    if (lines.length < 4) { toast("Henüz kaydedilmiş yazılı cevap yok"); return; }
    try {
      const blob = new Blob([lines.join("\r\n")], { type: "text/plain;charset=utf-8" });
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "B1-Day2-calismam.txt"; document.body.appendChild(a); a.click(); a.remove();
    } catch (e) { toast("İndirme başarısız"); }
  }

  /* ── timer ── */
  const fmt = t => { t = Math.max(0, Math.round(t)); return String(Math.floor(t / 60)).padStart(2, "0") + ":" + String(t % 60).padStart(2, "0"); };
  const timer = {
    left: 300, total: 300, running: false, endAt: 0, iv: null,
    set(sec) { this.stop(); this.left = this.total = sec; this.paint(); },
    start() { if (this.left <= 0) this.left = this.total; this.running = true; this.endAt = Date.now() + this.left * 1000; this.iv = setInterval(() => this.tick(), 250); this.paint(); updateFinish(); },
    stop() { this.running = false; clearInterval(this.iv); this.paint(); },
    tick() { this.left = (this.endAt - Date.now()) / 1000; if (this.left <= 0) { this.left = 0; this.stop(); beep(); toast("⏰ Süre doldu!"); } this.paint(); },
    add(sec) { this.left += sec; this.total = Math.max(this.total, this.left); if (this.running) this.endAt += sec * 1000; this.paint(); updateFinish(); },
    paint() {
      const d = $("#timer-display"); d.textContent = fmt(this.left);
      d.classList.toggle("low", this.left > 0 && this.left <= 60); d.classList.toggle("done", this.left <= 0);
      $("#timer-btn").textContent = this.running ? "Durdur" : "Başlat";
      const bt = $("[data-break-time]"); if (bt) bt.textContent = fmt(this.left);
      const back = $("#back-at"); if (back) back.textContent = this.running ? "See you at " + clock(new Date(this.endAt)) : "";
    }
  };
  const clock = d => String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  function updateFinish() {
    const f = $("#finish-at"); if (!f) return;
    f.textContent = clock(new Date(timer.running ? timer.endAt : Date.now() + timer.left * 1000));
    $("#finish-note").textContent = timer.running ? "Test bitiş saati" : "Şimdi başlarsanız · Başlat'a basın";
  }
  setInterval(() => { if (!timer.running) updateFinish(); }, 20000);
  function beep() {
    try { const C = window.AudioContext || window.webkitAudioContext; const c = new C(); [0, 0.35, 0.7].forEach(t => { const o = c.createOscillator(), g = c.createGain(); o.frequency.value = 880; o.connect(g); g.connect(c.destination); g.gain.setValueAtTime(0.18, c.currentTime + t); g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + t + 0.3); o.start(c.currentTime + t); o.stop(c.currentTime + t + 0.3); }); } catch (e) {}
  }

  /* ── toggles ── */
  function applyToggles() {
    document.body.classList.toggle("tr-on", st.tr); document.body.classList.toggle("teacher-on", st.teacher); document.body.classList.toggle("proj", st.proj);
    const p = (id, on) => { const b = $(id); b.setAttribute("aria-pressed", on); const sp = $("span", b); if (sp) sp.textContent = on ? "ON" : "OFF"; };
    p("#tr-toggle", st.tr); p("#teacher-toggle", st.teacher); p("#proj-toggle", st.proj);
  }
  function toggleAnswers() {
    const on = !document.body.classList.contains("show-answers");
    document.body.classList.toggle("show-answers", on);
    $("#ans-btn").setAttribute("aria-pressed", on); $("#ans-btn").textContent = on ? "Cevapları gizle" : "Cevapları göster";
    $$("section").forEach(sec => sec._reveal && sec._reveal(on));
  }
  function fullscreen() { try { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); } catch (e) {} }

  /* ── init ── */
  function init() {
    buildNav();
    $("#lesson-nav").addEventListener("click", e => { const b = e.target.closest("[data-i]"); if (b) go(+b.dataset.i); });
    $$(".home-nav, .brand").forEach(b => b.addEventListener("click", () => go(-1)));
    $("#screen-select").addEventListener("change", e => go(+e.target.value));
    $("#prev-btn").addEventListener("click", () => go(st.idx - 1));
    $("#next-btn").addEventListener("click", () => go(st.idx + 1));
    $("#flow-btn").addEventListener("click", () => go(S.findIndex(s => s.id === "plan")));
    $("#ans-btn").addEventListener("click", toggleAnswers);
    $("#timer-btn").addEventListener("click", () => timer.running ? timer.stop() : timer.start());
    $("#timer-reset").addEventListener("click", () => timer.set(st.idx >= 0 && S[st.idx].min ? S[st.idx].min * 60 : 300));
    $("#timer-plus").addEventListener("click", () => timer.add(60));
    $("#tr-toggle").addEventListener("click", () => { st.tr = !st.tr; applyToggles(); save(); });
    $("#teacher-toggle").addEventListener("click", () => { st.teacher = !st.teacher; applyToggles(); save(); });
    $("#proj-toggle").addEventListener("click", () => { st.proj = !st.proj; applyToggles(); save(); });
    $("#fs-btn").addEventListener("click", fullscreen);
    $("#print-btn").addEventListener("click", () => window.print());
    $("#menu-btn").addEventListener("click", () => document.body.classList.toggle("nav-open"));
    $("#scrim").addEventListener("click", () => document.body.classList.remove("nav-open"));
    document.addEventListener("keydown", e => {
      const tag = (e.target.tagName || "").toLowerCase();
      if (tag === "input" || tag === "textarea" || tag === "select" || e.ctrlKey || e.metaKey || e.altKey) return;
      if (e.key === "ArrowRight") { e.preventDefault(); go(st.idx + 1); }
      else if (e.key === "ArrowLeft") { e.preventDefault(); go(st.idx - 1); }
      else if (e.key === " ") { if (tag === "button") return; e.preventDefault(); toggleAnswers(); }
      else if (e.key === "f" || e.key === "F") fullscreen();
      else if (e.key === "t" || e.key === "T") $("#teacher-toggle").click();
      else if (e.key === "h" || e.key === "H") $("#tr-toggle").click();
      else if (e.key === "p" || e.key === "P") $("#proj-toggle").click();
      else if (e.key === "s" || e.key === "S") $("#timer-btn").click();
    });
    applyToggles();
    const h = decodeURIComponent((location.hash || "").slice(1));
    const fromHash = S.findIndex(s => s.id === h);
    go(h === "home" ? -1 : (fromHash >= 0 ? fromHash : st.idx), false);
  }
  init();
})();
</script>
