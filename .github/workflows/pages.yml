name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v6
      - name: Node.js kur
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: GitHub Pages ayarlarını hazırla
        uses: actions/configure-pages@v5
      - name: Ders kataloğunu ve siteyi oluştur
        run: npm run build
      - name: Yayın dosyalarını doğrula
        run: npm run check:build
      - name: YDS test ve kayıt akışlarını doğrula
        run: npm run check:yds
      - name: Site dosyalarını yükle
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: GitHub Pages üzerinde yayınla
        id: deployment
        uses: actions/deploy-pages@v4
