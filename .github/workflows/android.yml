name: Android paketlerini doğrula

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: false
          log-accepted-android-sdk-licenses: false
      - name: Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.1.0'
      - name: APK, AAB ve Android denetimi
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain assembleDebug bundleRelease lintRelease
      - uses: actions/upload-artifact@v4
        with:
          name: android-build-check
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/reports/lint-results-release.html
          retention-days: 14
